              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/QueueError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/queue/walk-ins:
    post:
      tags: [queue]
      operationId: addWalkIn
      summary: Add a walk-in to today's queue
      description: |
        FR-QUE-04; spec R11, D21. Joins the doctor's open session running now, else the next one
        today, or the named session_id of today's (409 QUE_NO_SESSION when there is none): the next
        token, or in slot mode slot_start or the earliest free slot that has not ended (409
        APT_SESSION_FULL when none). Source WALK_IN, status ARRIVED at once. Records
        appointment.booked. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWalkIn'
      responses:
        '201':
          description: Added and arrived
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/QueueError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/queue:
    get:
      tags: [queue]
      operationId: getQueue
      summary: A day's queue
      description: |
        FR-QUE-01; D22. The date's sessions (generated as GET /sessions does) with their active
        appointments in token or slot order, each with the patient's code, name and age and the
        minutes waited. date defaults to the clinic's today. Permission APPOINTMENTS_MANAGE.
        FR-QUE-03, R12, D23 (M3-P4): the 200 carries a strong ETag, a hash of the body; send it
        back in If-None-Match (compared weakly, as RFC 9110 says) and an unchanged queue is a
        bodiless 304. Screens poll every 5 seconds. Still no-store: nothing is cached.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the queue the screen already has
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: doctor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: include_cancelled
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: The day's queue
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '304':
          description: Unchanged since the ETag sent; no body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/staff:
    get:
      tags: [clinic]
      operationId: listStaff
      summary: The clinic's members with their roles
      description: |
        Permission: STAFF_MANAGE (owners only; FR-ORG-03). Includes invited and
        deactivated memberships so an owner can see the whole team. Unpaginated.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: Memberships of this clinic, by member name
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
    post:
      tags: [clinic]
      operationId: inviteStaff
      summary: Invite somebody to join this clinic
      description: |
        FR-ORG-04, FR-ORG-07. Permission: STAFF_MANAGE (owners). An email address or a phone
        number is required, because that is how they will sign in (R1). A person who already has
        a MediEase account keeps it and gains a membership; an active member is refused
        (409 CLN_MEMBER_EXISTS); a still-pending invitation is re-issued, which retires the
        previous link; a deactivated member is invited back (M6a-P5, staff.reinvited) and keeps
        their history. From M6a-P5 an invitation to someone with an email address is emailed by
        the worker (delivery email, accept_url null); a phone-only one returns accept_url, the
        one place its secret appears. At most 10 an hour per clinic (429). Records staff.invited
        or staff.reinvited. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaffInvite'
      responses:
        '201':
          $ref: '#/components/responses/TeamInvited'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '429':
          $ref: '#/components/responses/InviteRateLimited'
  /api/v1/clinic/staff/{membership_id}/resend:
    post:
      tags: [clinic]
      operationId: resendStaffInvite
      summary: Send a pending invitation again
      description: |
        FR-ORG-07 (M6a-P5). Permission: STAFF_MANAGE (owners). Only for a member still INVITED
        (409 CLN_INVALID_TRANSITION otherwise). The previous link stops working at once; the new
        invitation is emailed when the member has an email address, otherwise its link is
        returned once in accept_url. At most 3 an hour per member (429). Records staff.invited
        with resent=true. No body. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/TeamInvited'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/InviteRateLimited'
  /api/v1/clinic/staff/{membership_id}:
    patch:
      tags: [clinic]
      operationId: changeStaffMembership
      summary: Change a member's role, deactivate them, or both
      description: |
        FR-ORG-04, FR-AUD-01. Permission: STAFF_MANAGE (owners only). Send a role, a status,
        or both; each change is written with its own audit event in one transaction, so it is
        never unrecorded (spec R11). status accepts DEACTIVATED only; bringing somebody back is
        a new invitation (POST /api/v1/clinic/staff, M6a-P5), which they must accept. The last
        active owner can be neither demoted nor deactivated
        (409 CLN_LAST_OWNER). The member keeps their session, but their next request is
        refused once deactivated, and a new role applies from their next request. Setting the
        role they already hold changes nothing and records nothing. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMembershipUpdate'
      responses:
        '200':
          description: The member after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients:
    post:
      tags: [patients]
      operationId: registerPatient
      summary: Register a patient
      description: |
        FR-PAT-01, 02, 03, 06; spec patients R1-R4, R9, R10. Permission: PATIENTS_MANAGE.
        `phone` is the contact of record: for a patient under 18 it is the guardian's, and
        `guardian_name` is then required (422 PAT_GUARDIAN_REQUIRED). Give a
        date of birth or an age, not both. If the clinic already has patients on that number
        the answer is 409 PAT_PHONE_EXISTS with up to 10 candidates (families share phones);
        send `confirm_new: true` to register another person on it. A refusal takes no code.
        Registration is serialised per clinic, so two simultaneous registrations of one new
        number have exactly one winner. Records patient.created and the checklist's first
        patient. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPatient'
      responses:
        '201':
          description: The new patient
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PhoneExistsError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
    get:
      tags: [patients]
      operationId: lookupPatients
      summary: Look patients up by phone, code or name
      description: |
        FR-PAT-04; spec patients R5. Permission: PATIENTS_MANAGE. `q` is read in order as a phone
        number (7 or more digits, any usual formatting), then a patient code (`ME-0142`, any case,
        hyphen optional), otherwise the start of a name (case-insensitive). At most 20 results,
        ordered by name. Blank text, or phone-shaped text that is not a number, returns an empty
        list. The text is never logged.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Matching patients
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}:
    get:
      tags: [patients]
      operationId: getPatient
      summary: One patient of this clinic
      description: |
        Permission: PATIENTS_MANAGE. A patient of another clinic returns 404 REQ_NOT_FOUND, so
        its existence is never confirmed (NFR-08, AC7).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
      responses:
        '200':
          description: The patient
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [patients]
      operationId: updatePatient
      summary: Correct a patient's demographics
      description: |
        FR-PAT-01; spec patients R3, R7. Permission: PATIENTS_MANAGE. Only the fields sent change;
        send at least one. The code never changes. A date of birth or an age replaces the whole
        age fact. A blank `guardian_name` clears it (refused for a minor). Changing the phone
        does not run the duplicate check. Records one patient.updated listing the changed field
        *names* (never values); an edit that changes nothing records nothing. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
      responses:
        '200':
          description: The patient after the edit
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}/consent:
    put:
      tags: [patients]
      operationId: recordPatientConsent
      summary: Record whether the patient may be messaged on WhatsApp and SMS
      description: |
        FR-PAT-05, FR-PAT-06; spec patients R6. Permission: PATIENTS_MANAGE. Both flags are required:
        this records an answer, with who and when. Both false is "asked and declined", which differs
        from never asked (`consent_recorded_at` null). For a patient under 18 it is the guardian's
        answer. Refused with 409 PAT_OPTED_OUT while the patient is opted out: use opt-in, which
        takes the new consent. Records patient.consent_changed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientConsent'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConsentConflict'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}/opt-out:
    post:
      tags: [patients]
      operationId: optOutPatient
      summary: Stop all messages to the patient
      description: |
        FR-MSG-05; spec patients R6. Permission: PATIENTS_MANAGE. An opt-out overrides consent until
        an explicit opt-in (AC5); the consent record is kept. Idempotent: opting out an opted-out
        patient changes nothing and records nothing. Records patient.opted_out (source staff; M5's
        STOP replies use the same action). No body. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/patients/{patient_id}/portal-invite:
    post:
      tags: [patients]
      operationId: invitePatientToPortal
      summary: Invite the patient to link this record to the patient app
      description: |
        M6b-P1 (FR-PRT-06 b, spec R1). Permission: PATIENTS_MANAGE. A single-use link valid for
        seven days, returned once and never stored (only its digest is); a new invite supersedes
        the pending one. 409 PRT_ALREADY_LINKED when the record is already linked. Records
        patient.portal_invited. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: The invite, shown once
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalInvitation'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PortalLinkingError'
  /api/v1/patients/{patient_id}/portal:
    get:
      tags: [patients]
      operationId: getPatientPortalStatus
      summary: Whether the record is linked to a patient account
      description: |
        Spec R14. Permission: PATIENTS_MANAGE. NOT_LINKED, INVITED (with the invite's expiry) or
        LINKED (with the method and since when); never the account's email or name.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
      responses:
        '200':
          description: The record's portal status
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPortalStatus'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/patients/{patient_id}/portal-link:
    delete:
      tags: [patients]
      operationId: unlinkPatientFromPortal
      summary: End the record's link to a patient account
      description: |
        Spec R8. Permission: PATIENTS_MANAGE. The account sees nothing of this clinic from its
        next request; the record is unchanged. 404 REQ_NOT_FOUND when it is not linked. Returns
        the new status. Records patient.portal_unlinked. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The record's portal status after unlinking
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPortalStatus'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/patients/{patient_id}/opt-in:
    post:
      tags: [patients]
      operationId: optInPatient
      summary: Undo an opt-out, recording the consent given on the way back
      description: |
        FR-PAT-05, FR-MSG-05; spec patients R6, AC5. Permission: PATIENTS_MANAGE. The explicit way
        back from an opt-out: clears it and records consent in one step. 409 PAT_NOT_OPTED_OUT if
        the patient has not opted out (record consent instead). Records patient.opted_in.
        Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientConsent'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConsentConflict'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/invites/{token}:
    get:
      tags: [invites]
      operationId: describeInvite
      summary: What this invitation is for
      description: |
        Public (M1-P5): the invitee has no session yet. Returns the clinic, their name and
        the role, so the page can ask for a password with context. Unknown secrets are 404
        CLN_INVITE_INVALID; one that is expired or already used says which, because the
        person holding the link needs to know whether to ask for a new one.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The pending invitation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '404':
          $ref: '#/components/responses/InviteError'
        '410':
          $ref: '#/components/responses/InviteError'
  /api/v1/auth/invites/{token}/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Join the clinic and sign in (sets a new password, or proves the existing one)
      description: |
        FR-ORG-04, FR-AUTH-01, spec R13. Public: the secret in the URL is needed but is not enough
        for an account that already exists, so no X-CSRF-Token is needed (a cross-site request
        would have to know the secret). What password means depends on the invite's
        has_password (see describeInvite):

        - false, a new account: it is the password being chosen, at least 12 characters.
        - true, an existing account: it is that account's **current** password, verified and never
          changed. Whoever holds the link is not necessarily the account holder (the inviting
          owner receives it), so the link alone cannot take the account over. A wrong password is
          401 AUTH_INVALID_CREDENTIALS and counts towards the sign-in lockout (423 AUTH_LOCKED
          with Retry-After); the invitation stays pending.

        Accepting activates the membership, records staff.accepted, activates an ONBOARDING clinic
        when the new member is its owner (I1), and sets the session cookies — the invitee is
        signed in.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InviteToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '404':
          $ref: '#/components/responses/InviteError'
        '410':
          $ref: '#/components/responses/InviteError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '423':
          description: The existing account is locked (AUTH_LOCKED)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the lock ends
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ops/clinics:
    post:
      tags: [ops]
      operationId: createClinic
      summary: Create a clinic
      description: |
        FR-ORG-01, FR-OPS-01. Ops only. The clinic starts in ONBOARDING and becomes ACTIVE
        when its first owner accepts their invitation (I1). The slug is unique platform-wide
        because it appears in public links from M7 (409 CLN_SLUG_TAKEN). Records
        clinic.created and starts the onboarding checklist. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClinic'
      responses:
        '201':
          description: The new clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
    get:
      tags: [ops]
      operationId: listClinics
      summary: Every clinic with its onboarding state
      description: |
        FR-OPS-01, FR-OPS-04. Ops only. Newest first, each with its checklist timestamps so
        the time from "clinic created" to "owner accepted" is visible (goal G4). Unpaginated
        at pilot scale.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Clinics with their onboarding state
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsClinicList'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
  /api/v1/ops/clinics/{clinic_id}:
    get:
      tags: [ops]
      operationId: getOpsClinic
      summary: One clinic with its checklist, staff and doctor count
      description: 'FR-OPS-01/04. Ops only. No clinical content.'
