          description: The new clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
    get:
      tags: [ops]
      operationId: listClinics
      summary: Every clinic with its onboarding state
      description: |
        FR-OPS-01, FR-OPS-04. Ops only. Newest first, each with its checklist timestamps so
        the time from "clinic created" to "owner accepted" is visible (goal G4). Unpaginated
        at pilot scale.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Clinics with their onboarding state
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsClinicList'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
  /api/v1/ops/clinics/{clinic_id}:
    get:
      tags: [ops]
