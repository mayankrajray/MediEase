  /api/v1/patients/{patient_id}/reminders:
    get:
      tags: [reminders]
      operationId: listPatientReminders
      summary: A patient's follow-up reminders, latest due first
      description: |
        FR-REM-05; M5-P4 decision 3A. At most 50. `status` is the message's status once the
        reminder was sent (SENT, DELIVERED, READ, FAILED), else the reminder's own (SCHEDULED,
        CANCELLED, SKIPPED_NO_CONSENT, FAILED). Permission REMINDERS_SCHEDULE.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
      responses:
        '200':
          description: The patient's reminders
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    post:
      tags: [reminders]
      operationId: scheduleReminder
      summary: Schedule a follow-up reminder for a patient
      description: |
        FR-REM-02; spec R3; M5-P4 decision 5A. Due at 09:00 clinic time the day before
        `follow_up_date` (now if that has passed), never 21:00-08:00 (FR-REM-04). Records
        reminder.scheduled. Permission REMINDERS_SCHEDULE. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReminder'
      responses:
        '201':
          description: The reminder
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ReminderError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ReminderError'
  /api/v1/reminders/{reminder_id}:
    patch:
      tags: [reminders]
      operationId: changeReminder
      summary: Move or cancel a scheduled reminder
      description: |
        FR-REM-02. Exactly one of `follow_up_date` (a new date, due by the same rule) or
        `cancel: true`. Only a SCHEDULED reminder (else 409 REM_NOT_SCHEDULED). Records
        reminder.rescheduled or reminder.cancelled. Permission REMINDERS_SCHEDULE. Needs
        X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/ReminderPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderChange'
      responses:
        '200':
          description: The reminder
          headers:
