              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ReminderError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ReminderError'
  /api/v1/patients/{patient_id}/messages:
    get:
      tags: [reminders]
      operationId: listPatientMessages
      summary: The patient's messages, status only
      description: |
        FR-MSG-04; spec R16; M5-P6 decision 1A. Newest first, at most 50: what each message was
        about (`source_type`, `source_id`), its channel, status, error code and times. Never its
        variables or the number it went to. Permission REMINDERS_SCHEDULE.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
      responses:
        '200':
          description: The patient's messages
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMessageList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/follow-ups/pending:
    get:
      tags: [reminders]
      operationId: listPendingFollowUps
      summary: Patients whose follow-up date passed without a completed visit since
      description: |
        FR-REM-07; spec R17. One row per patient (their latest overdue follow-up), oldest
        follow-up date first. `reminder_status` is that chain's latest reminder's visible status.
        Permission REMINDERS_SCHEDULE. M6a-P6: doctor_id keeps one doctor's follow-ups (the
        Doctor workspace's "My follow-ups").
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: doctor_id
          in: query
          required: false
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Pending follow-ups
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingFollowUpList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/dashboard/today:
    get:
      tags: [dashboard]
      operationId: getDashboardToday
      summary: How today is going, for the caller's role
      description: |
        M6-P1 decisions 5A and 6A. Computed in the clinic's zone; today's sessions are generated
        first, as GET /queue does, so the two always agree. Permission CLINIC_VIEW (every role).
        A doctor with a doctor profile gets scope DOCTOR: their own sessions, next patients and
        counts, and messages_failed null. Front desk and owners get scope CLINIC. week (the last 7
        days, oldest first, ending today) needs USAGE_METRICS_VIEW and is null without it; in
        scope DOCTOR its messages_sent are null. follow_ups_pending is the clinic's, as
        GET /follow-ups/pending lists them. Counts exclude cancelled appointments. Like the
        queue, the 200 carries a strong ETag and an unchanged answer is a bodiless 304.
        M6a-P6 (decision 4A): view=doctor asks for the caller's own doctor's day, the Doctor
        workspace of a practising owner (an OWNER with a doctor profile); without a doctor
        profile, or as front desk, it is 409 CLN_NO_DOCTOR_PROFILE. view=clinic, or no view,
        keeps the role's default. A DOCTOR with a profile always gets scope DOCTOR.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: view
          in: query
          required: false
          schema: {type: string, enum: [clinic, doctor]}
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the answer the screen already has
          schema:
            type: string
      responses:
        '200':
          description: Today's counts
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardToday'
        '304':
          description: Unchanged since the ETag sent; no body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/my-patients:
    get:
      tags: [patients]
      operationId: listMyPatients
      summary: The patients the caller has seen as a doctor
      description: |
        M6a-P6 (FR-UX-02, FR-UX-06; decision 5A). Patients with at least one visit by the
        caller's own doctor profile in this clinic, most recent visit first. q narrows them by
        the lookup box's rules (phone, then code, then name prefix). Permission CLINICAL_VIEW
        (doctors and owners; front desk 403); a caller with no doctor profile here is 409
        CLN_NO_DOCTOR_PROFILE. No clinical content; not audited, like the lookup.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: q
          in: query
          required: false
          schema: {type: string, maxLength: 100}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: My patients
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPatientList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: The clinic's audit log, newest first
      description: |
        M6a-P8 (FR-AUD-03, decision 8A). from and to are the clinic's calendar days, both
        included (default the last 7 days; at most 92, else 422 AUD_RANGE_TOO_LONG). 50 a page;
        pass next_cursor as cursor for the next. Reading is not audited. AUDIT_VIEW (owners).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditCategory'
        - {name: actor_user_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 200}}
      responses:
        '200':
          description: One page of the log
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/audit-events/export:
    get:
      tags: [audit]
      operationId: exportAuditEvents
      summary: Export the clinic's audit log as CSV
      description: |
        M6a-P8 (FR-AUD-03, FR-AUD-01 "data exports"). Every entry of the range (rules as for the
        list), at most 20,000 rows (else 422 AUD_RANGE_TOO_LONG). Columns: Time (clinic time),
        Person, Role, Category, Action, Record type, Record ID, Patient code, Details. A cell
        starting with = + - @ is prefixed with '. Records audit.exported. AUDIT_VIEW (owners).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
      responses:
        '200':
          description: The CSV file
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              description: attachment; filename="audit-<clinic>-<from>-<to>.csv"
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: My notifications in this clinic, newest first
      description: |
        M6a-P7 (FR-NTF-05, ADR-0017). The caller's own in-app notifications, newest first.
        Titles come from a typed, non-clinical catalogue (FR-NTF-06). Permission CLINIC_VIEW.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 50, default: 30}
      responses:
        '200':
          description: My notifications
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/notifications/summary:
    get:
      tags: [notifications]
      operationId: getNotificationSummary
      summary: My unread count, for the bell
      description: |
        M6a-P7. Polled by the bell every 15 s with If-None-Match: an unchanged answer is a
        bodiless 304. latest_id changes when a notification arrives. Permission CLINIC_VIEW.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Unread count
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSummary'
        '304':
          description: Unchanged since the ETag sent; no body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
  /api/v1/notifications/{notification_id}/read:
    post:
      tags: [notifications]
      operationId: readNotification
      summary: Mark one of my notifications read
      description: |
        M6a-P7. Reading twice keeps the first time. Another member's or another clinic's is 404
        REQ_NOT_FOUND. Not audited (decision 8A). No body. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The notification, read
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/notifications/read-all:
    post:
      tags: [notifications]
      operationId: readAllNotifications
      summary: Mark all my notifications read
      description: M6a-P7. No body. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: How many were marked read
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [updated]
                properties:
                  updated: {type: integer, minimum: 0}
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
  /api/v1/notifications/preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: My notification choices
      description: |
        M6a-P7 (FR-NTF-03, decision 5A). Every kind with its in-app choice; on unless turned off.
        Patients' WhatsApp and SMS preference is their consent (M2-P3), not stored here.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: My choices
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
    put:
      tags: [notifications]
      operationId: setNotificationPreferences
      summary: Change my notification choices
      description: |
        M6a-P7. Only IN_APP may be chosen in M6a; another channel is 409 CLN_INVALID_TRANSITION.
        A real change records notification.preferences_changed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferencesUpdate'
      responses:
        '200':
          description: My choices after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: me_access
      description: |
        Access token set by sign-in and refresh (HttpOnly, path /api). Checked on every
        request together with the session's liveness, the user's status and their
        membership, so nothing is cached beyond the request (spec R7).
    patientSessionCookie:
      type: apiKey
      in: cookie
      name: me_pt_access
      description: |
        Portal access token (M6a-P3, ADR-0015), HttpOnly, path /api/v1/portal, audience
        mediease-portal. Refused on every staff route, as the staff token is on portal routes.
  parameters:
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID. Generated by the API when absent and always echoed back.
      schema:
        type: string
        maxLength: 64
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Copy of the me_csrf cookie; required when session cookies are sent.
      schema:
        type: string
    ClinicId:
      name: X-Clinic-ID
      in: header
      required: false
      description: |
        Which clinic the request is for. Optional for a user with a single membership;
        required when they have more than one (otherwise 400 PERM_CLINIC_REQUIRED). A
        value that is not one of the caller's clinics gets the same 400, never a 404.
      schema:
        type: string
        format: uuid
    PatientPath:
      name: patient_id
      in: path
      required: true
      description: A patient of the request's clinic.
      schema:
        type: string
        format: uuid
    ClinicPath:
      name: clinic_id
      in: path
      required: true
      description: The clinic an ops request is about (ops users have no membership to infer).
      schema:
        type: string
        format: uuid
    DoctorPath:
      name: doctor_id
      in: path
      required: true
      description: A doctor of the request's clinic.
      schema:
        type: string
        format: uuid
    AppointmentPath:
      name: appointment_id
      in: path
      required: true
      description: An appointment of the request's clinic.
      schema:
        type: string
        format: uuid
    VisitPath:
      name: visit_id
      in: path
      required: true
      description: A visit of the request's clinic.
      schema:
        type: string
        format: uuid
    PrescriptionPath:
      name: rx_id
      in: path
      required: true
      description: A prescription version of the request's clinic.
      schema:
        type: string
        format: uuid
    FavouritePath:
      name: favourite_id
      in: path
      required: true
      description: One of the caller's favourites.
      schema:
        type: string
        format: uuid
    TemplatePath:
      name: template_id
      in: path
      required: true
      description: One of the caller's templates.
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      description: The single-use invitation secret from the acceptance link.
      schema:
        type: string
        maxLength: 128
    LinkToken:
      name: token
      in: path
      required: true
      description: The patient link token (spec R9); never logged.
      schema:
        type: string
        maxLength: 200
    PortalLinkPath:
      name: link_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PortalInviteToken:
      name: token
      in: path
      required: true
      description: The single-use secret of a clinic's patient-app invite (M6b-P1); never logged.
      schema:
        type: string
        maxLength: 128
    ReminderPath:
      name: reminder_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Accepted:
      description: Accepted for sending; the same answer whether or not an email goes out
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Accepted'
    PatientSessionStarted:
      description: Portal session started or renewed; me_pt_access, me_pt_refresh and me_pt_csrf are set
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PatientSession'
    PortalError:
      description: |
        PRT_INVALID_CREDENTIALS, AUTH_SESSION_EXPIRED, AUTH_REFRESH_REUSED (401);
        AUTH_ACCOUNT_DISABLED, AUTH_CSRF_INVALID (403); AUTH_TOKEN_INVALID (404);
        PRT_EMAIL_TAKEN (409); AUTH_TOKEN_EXPIRED (410);
        REQ_UNSUPPORTED_MEDIA_TYPE (415); REQ_VALIDATION_FAILED (422); AUTH_LOCKED (423);
        AUTH_RATE_LIMITED (429, with Retry-After)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds to wait (423 and 429 only)
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GoogleRedirect:
      description: |
        A redirect: to Google (or the callback with the fake provider), to next after a
        sign-in, or to /sign-in or /portal/sign-in with a reason. Sets or clears me_oidc and,
        after a sign-in, the staff or the portal session cookies.
      headers:
        Location:
          required: true
          schema:
            type: string
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
    SessionStarted:
      description: Session started or renewed; me_access, me_refresh and me_csrf are set
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    AuthError:
      description: |
        AUTH_INVALID_CREDENTIALS, AUTH_SESSION_EXPIRED, AUTH_REFRESH_REUSED (401);
        AUTH_ACCOUNT_DISABLED, AUTH_CSRF_INVALID (403); REQ_UNSUPPORTED_MEDIA_TYPE (415);
        REQ_VALIDATION_FAILED (422)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionError:
      description: |
        PERM_CLINIC_REQUIRED (400, choose a clinic); PERM_DENIED (403, the role lacks the
        permission, or an ops user on a clinic route); CLN_SUSPENDED (403); REQ_NOT_FOUND
        (404, unknown id — or another clinic's resource, which is never distinguishable)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: |
        The change conflicts with a clinic rule: CLN_LAST_OWNER (a clinic needs at least one
        active owner), CLN_INVALID_TRANSITION (the entity's state does not allow it),
        CLN_SLUG_TAKEN (that clinic URL is in use), CLN_MEMBER_EXISTS (already a member here),
        CLN_NO_DOCTOR_PROFILE (a doctor's view without a doctor profile, M6a-P6)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ApplicationDetail:
      description: The application as the reviewer sees it
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpsApplicationDetail'
    ApplicationError:
      description: |
        M6c-P1. ONB_CONFIRM_INVALID (404: unknown, used or expired link); REQ_REQUEST_ENTITY_TOO_LARGE
        (413: over 30 MB); REQ_UNSUPPORTED_MEDIA_TYPE (415); REQ_VALIDATION_FAILED (422, the field
        named with doctor positions from 1); ONB_FILE_REJECTED (422: details.position and
        details.reason type, size or missing); ONB_RATE_LIMITED (429, with Retry-After);
        ONB_UPLOAD_FAILED (503: nothing was kept); ONB_ALREADY_TAKEN, ONB_NOT_UNDER_REVIEW
        (409, the review); REQ_NOT_FOUND (404, an unknown or unconfirmed application)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds to wait (429 only)
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InviteRateLimited:
      description: |
        CLN_INVITE_RATE_LIMITED (M6a-P5): more than 10 invitations in an hour for this clinic, or
        more than 3 resends in an hour for one member. Retry-After gives the seconds.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until the hour's limit resets
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ScheduleError:
      description: |
        SCH_INVALID_BLOCK (422: a block's times, length, slot length or capacity cannot be
        scheduled); SCH_OVERLAP (409: two blocks overlap, also across midnight and the week);
        SCH_LEAVE_EXISTS (409: leave on that date already); REQ_VALIDATION_FAILED (422)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AppointmentError:
      description: |
        APT_SLOT_TAKEN, APT_SESSION_FULL (409: no place, also when a parallel booking won);
        APT_SLOT_HELD (409: an online request holds the time; send override_hold to book anyway,
        details.held_until, details.first_name);
        APT_SESSION_CLOSED (409: leave, a changed block or an inactive doctor); APT_ALREADY_BOOKED
        (409: the patient is already in this session, details.appointment_id); APT_NOT_MODIFIABLE
        (409: the status or the session's end forbids it); APT_OUTSIDE_SCHEDULE (422: not one of
        the session's slots); APT_IN_PAST (422); REQ_VALIDATION_FAILED (422)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    QueueError:
      description: |
        QUE_INVALID_TRANSITION (409: not allowed from the current status, or the screen saw
        another one; details.from is the real status, details.to the one asked); QUE_WRONG_TIME
        (409: details.reason not_today or not_started); QUE_NO_SESSION (409: no session left
        today); and the booking codes of AppointmentError for a walk-in
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VisitError:
      description: |
        VIS_ALREADY_EXISTS (409, details.visit_id); VIS_NOT_STARTABLE (409, details.status: start
        the consultation on the queue first); VIS_STALE (409, details.revision: another tab saved
        first); VIS_LOCKED (409, details.locked_at: add an addendum); VIS_NOT_COMPLETED (409);
        REQ_VALIDATION_FAILED (422, the field and the rule, never the value)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PrescriptionError:
      description: |
        RX_NOT_DRAFT (409, details.status: issued versions never change, revise instead);
        RX_STALE (409, details.revision); RX_ALREADY_EXISTS (409, details.prescription_id: the
        visit's chain); RX_DRAFT_EXISTS (409, details.prescription_id); RX_NOT_LATEST (409,
        details.latest_id); VIS_LOCKED (409: version 1 after the visit's lock); RX_EMPTY (422);
        RX_DOCTOR_INCOMPLETE (422, details.fields); REQ_VALIDATION_FAILED (422, field and rule);
        RX_NOT_ISSUED (409, details.status: a draft is never printed, M4-P4);
        LINK_NOT_LOCKED (409: resetting a link that is not locked, M4-P5)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    LinkError:
      description: |
        LINK_INVALID (404: not one of our tokens); LINK_EXPIRED, LINK_REVOKED (410: ask the
        clinic for a new link); LINK_CHALLENGE_FAILED (401, details.attempts_left);
        LINK_CHALLENGE_REQUIRED (401: verify first, or the view ended); LINK_LOCKED (423: five
        wrong answers; the clinic can reset it)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PortalLinkingError:
      description: |
        M6b-P1. PRT_UNVERIFIED_ACCOUNT (403: verify the email first); REQ_NOT_FOUND (404: not
        one of this account's records, never distinguishable); PRT_INVITE_INVALID (404: unknown,
        used, superseded or expired); PRT_ALREADY_LINKED (409: the record has another account, or
        this account already has a record in that clinic)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    LinkRateLimited:
      description: LINK_RATE_LIMITED (too many requests for this link this minute)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds until the next minute
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BookingRequestError:
      description: |
        The public page and booking requests (M6b-P4): REQ_NOT_FOUND (404: an unknown slug, a
        clinic that is not active, or a session that cannot be requested); APT_SLOT_TAKEN,
        APT_SESSION_FULL, APT_SLOT_HELD, APT_SESSION_CLOSED, PRT_REQUEST_EXISTS,
        BKG_ALREADY_ANSWERED (M6b-P5: answered, or past its deadline), PRT_ALREADY_LINKED,
        PRT_TOO_MANY_REQUESTS (409); APT_OUTSIDE_SCHEDULE, REQ_VALIDATION_FAILED (422);
        PRT_RATE_LIMITED (429, with Retry-After)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Seconds to wait (429 only)
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    LibraryError:
      description: |
        RX_NAME_TAKEN (409: the caller already has one with that name, ignoring case and spaces);
        RX_LIBRARY_FULL (409, details.limit); RX_STALE (409, details.revision);
        REQ_VALIDATION_FAILED (422, field and rule)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    VisitPermissionError:
      description: |
        PERM_DENIED (403: front desk, or an owner who is not a doctor writing); VIS_NOT_YOURS (403:
        a doctor writing another doctor's visit); CLN_SUSPENDED (403)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ScheduleChanged:
      description: The schedule after the change, with any booked sessions it kept
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScheduleChange'
    ScheduleExceptionChanged:
      description: The exception, with any booked sessions it kept
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ScheduleExceptionChange'
    PatientChanged:
      description: The patient after the change
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Patient'
    ConsentConflict:
      description: |
        PAT_OPTED_OUT (the patient asked not to be messaged: opt them back in to record consent);
        PAT_NOT_OPTED_OUT (opt-in needs an opt-out: record consent instead)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PhoneExistsError:
      description: |
        PAT_PHONE_EXISTS (409): the clinic already has patients on this phone number.
        details.candidates lists up to 10 of them (id, code, name, age) for the signed-in staff member;
        send confirm_new: true to register another person on the number.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PhoneExistsEnvelope'
    InviteError:
      description: |
        CLN_INVITE_INVALID (404, unknown or malformed secret); CLN_INVITE_EXPIRED,
        CLN_INVITE_USED (410 — ask the clinic for a new invitation, or sign in)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StaffInvited:
      description: The invited member and the acceptance URL (the secret appears only here)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StaffInvitation'
    TeamInvited:
      description: |
        The invited member and how the invitation travels (M6a-P5): emailed (accept_url is
        null) or a link shown once (phone only)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TeamInvitation'
    ReminderError:
      description: |
        REM_NO_CONSENT (409: the patient has not agreed to WhatsApp or opted out);
        REM_CLINIC_PHONE_MISSING (409: add the clinic's phone first); REM_NOT_SCHEDULED (409: the
        reminder was sent, cancelled or skipped); REM_IN_PAST (422: the date is not after today);
        REQ_VALIDATION_FAILED (422)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  headers:
    ETag:
      description: Strong entity tag of the body (a quoted hash), for If-None-Match
      schema:
        type: string
    RequestId:
      description: Correlation ID for this request; quote it when reporting a problem.
      schema:
        type: string
    NoStore:
      description: Always "no-store" — identity, permissions and clinic data are never cached.
      schema:
        type: string
  schemas:
    ReminderStatus:
      type: string
      description: FR-REM-05 (the message's status once sent, decision 3A)
      enum: [SCHEDULED, SENT, DELIVERED, READ, FAILED, CANCELLED, SKIPPED_NO_CONSENT]
    Reminder:
      type: object
      additionalProperties: false
      required: [id, patient_id, doctor_id, kind, source, prescription_id, appointment_id,
                 follow_up_date, due_at, status, error_code, revision, created_at, cancelled_at]
      properties:
        id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
        doctor_id: {type: string, format: uuid}
        kind:
          type: string
          enum: [FOLLOW_UP, APPOINTMENT]
          description: M6a-P8 APPOINTMENT reminds of a booked visit; it follows its appointment
        source: {type: string, enum: [PRESCRIPTION, MANUAL, APPOINTMENT]}
        prescription_id:
          description: The prescription chain (its version 1) for an automatic reminder
          type: [string, 'null']
          format: uuid
        appointment_id:
          description: The appointment an APPOINTMENT reminder is for (M6a-P8)
          type: [string, 'null']
          format: uuid
        follow_up_date:
          type: string
          format: date
          description: The follow-up date, or the visit's date for an APPOINTMENT reminder
        due_at: {type: string, format: date-time}
        status:
          $ref: '#/components/schemas/ReminderStatus'
        error_code:
          description: |
            Why it failed (MSG_* or REM_CLINIC_PHONE_MISSING), or why the system cancelled an
            appointment reminder (REM_APPOINTMENT_CHANGED, REM_TOO_LATE); else null
          type: [string, 'null']
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
    ReminderList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
    NewReminder:
      type: object
      additionalProperties: false
      required: [doctor_id, follow_up_date]
      properties:
        doctor_id: {type: string, format: uuid}
        follow_up_date: {type: string, format: date}
    ReminderChange:
      type: object
      additionalProperties: false
      description: Exactly one of the two
      properties:
        follow_up_date: {type: [string, 'null'], format: date}
        cancel: {type: boolean, default: false}
    PendingFollowUp:
      type: object
      additionalProperties: false
      required: [patient_id, patient_code, patient_name, doctor_id, prescription_id, visit_id,
                 follow_up_date, reminder_status]
      properties:
        patient_id: {type: string, format: uuid}
        patient_code: {type: string}
        patient_name: {type: string}
        doctor_id: {type: string, format: uuid}
        prescription_id: {type: string, format: uuid}
        visit_id: {type: string, format: uuid}
        follow_up_date: {type: string, format: date}
        reminder_status:
          oneOf:
            - $ref: '#/components/schemas/ReminderStatus'
            - type: 'null'
    PendingFollowUpList:
      type: object
      additionalProperties: false
      required: [items, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingFollowUp'
        limit: {type: integer}
        offset: {type: integer}
    PatientMessage:
      type: object
      additionalProperties: false
      description: M5-P6. Status only; never the variables or the number.
      required: [id, template_key, source_type, source_id, channel, status, error_code,
                 created_at, sent_at, delivered_at, read_at, failed_at]
      properties:
        id: {type: string, format: uuid}
        template_key:
          type: string
          description: booking_confirmed, rx_ready, rx_updated, follow_up_due or opt_out_confirmed
        source_type: {type: string, enum: [APPOINTMENT, PRESCRIPTION, REMINDER, OPT_OUT]}
        source_id: {type: string, format: uuid}
        channel: {type: string, enum: [WHATSAPP, SMS, CONSOLE]}
        status: {type: string, enum: [QUEUED, SENT, DELIVERED, READ, FAILED]}
        error_code:
          description: MSG_* when it failed or a send was refused, else null
          type: [string, 'null']
        created_at: {type: string, format: date-time}
        sent_at: {type: [string, 'null'], format: date-time}
        delivered_at: {type: [string, 'null'], format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
        failed_at: {type: [string, 'null'], format: date-time}
    PatientMessageList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PatientMessage'
    LibraryItem:
      description: A line's body without its identity (the fields of PrescriptionItemOutput)
      type: object
      required: [medicine_name]
      additionalProperties: true
      properties:
        medicine_name: {type: string}
    Favourite:
      type: object
      required: [id, name, item, revision, use_count, last_used_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        item:
          $ref: '#/components/schemas/LibraryItem'
        revision: {type: integer, minimum: 1}
        use_count: {type: integer, minimum: 0}
        last_used_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    FavouriteInput:
      type: object
      additionalProperties: false
      required: [name, item]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        item:
          $ref: '#/components/schemas/PrescriptionItemInput'
        revision:
          type: [integer, 'null']
          minimum: 1
          description: Required to replace (409 RX_STALE otherwise)
    FavouriteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Favourite'
    RxTemplate:
      type: object
      required: [id, name, items, advice, follow_up_days, revision, use_count, last_used_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryItem'
        advice:
          $ref: '#/components/schemas/Advice'
        follow_up_days: {type: [integer, 'null']}
        revision: {type: integer, minimum: 1}
        use_count: {type: integer, minimum: 0}
        last_used_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    RxTemplateInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        items:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/PrescriptionItemInput'
        advice:
          $ref: '#/components/schemas/AdviceInput'
        follow_up_days: {type: [integer, 'null'], minimum: 1, maximum: 365}
        revision: {type: [integer, 'null'], minimum: 1}
    RxTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RxTemplate'
    MedicineSuggestions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required: [name, source, uses, favourite_id]
            properties:
              name: {type: string}
              source:
                type: string
                enum: [FAVOURITE, HISTORY]
              uses:
                type: integer
                description: A favourite's use count, or the distinct visits it was issued in
              favourite_id: {type: [string, 'null'], format: uuid}
    Frequency:
      type: string
      pattern: '^([01](-[01]){2,3}|SOS|ONCE|CUSTOM)$'
      description: |
        M6b-P3 (prescriptions R21): a 0/1 pattern read against the slot set for its length
        (GET /rx-vocabulary): 3 = morning-afternoon-night, 4 = morning-afternoon-evening-night,
        with at least one 1; or SOS, ONCE, CUSTOM (CUSTOM needs frequency_text). Saved in the
        canonical dashed form.
    FrequencyInput:
      type: string
      maxLength: 100
      description: |
        As Frequency; the digits may also be sent without dashes or with spaces (101, 1 0 1).
        Anything else (all zeros, 2-0-2, other lengths) is 422 REQ_VALIDATION_FAILED on
        items.N.frequency: write it as CUSTOM with the doctor's words.
    Slot:
      type: string
      enum: [MORNING, AFTERNOON, EVENING, NIGHT]
    DurationKind:
      type: string
      enum: [DAYS, UNTIL_REVIEW, ONGOING]
      description: |
        M6b-P3 (prescriptions R23): DAYS needs duration_days; null = not stated ("Duration not
        stated - ask your clinic"). A line saved with duration_days alone is DAYS.
    LineWarning:
      type: string
      enum: [BEDTIME_WITHOUT_NIGHT, BEDTIME_WITH_OTHER_SLOTS, BEDTIME_UNTIMED]
      description: Non-blocking notes for the doctor (prescriptions R22); issuing is never refused
    Timing:
      type: string
      enum: [BEFORE_FOOD, AFTER_FOOD, WITH_FOOD, EMPTY_STOMACH, BEDTIME, ANY]
    PreparationPhrase:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [SHAKE_WELL, DILUTE_IN_WATER, DISSOLVE, CHEW, DO_NOT_CRUSH, WITH_WATER, WITH_WARM_WATER, WITH_MILK, CUSTOM]
        text:
          type: [string, 'null']
          maxLength: 100
          description: The amount for DILUTE_IN_WATER, the doctor's words for CUSTOM; else absent
    StoragePhrase:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [ROOM_TEMP, REFRIGERATE, AWAY_FROM_LIGHT, DISCARD_AFTER_DAYS]
        days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          description: Only for DISCARD_AFTER_DAYS
    PrescriptionItemInput:
      type: object
      additionalProperties: false
      required: [medicine_name]
      properties:
        medicine_name: {type: string, minLength: 1, maxLength: 200}
        form: {type: [string, 'null'], maxLength: 100}
        strength: {type: [string, 'null'], maxLength: 100}
        dose: {type: [string, 'null'], maxLength: 100}
        frequency:
          oneOf:
            - $ref: '#/components/schemas/FrequencyInput'
            - type: 'null'
        frequency_text: {type: [string, 'null'], maxLength: 100}
        timing:
          oneOf:
            - $ref: '#/components/schemas/Timing'
            - type: 'null'
        duration_days: {type: [integer, 'null'], minimum: 1, maximum: 365}
        duration_kind:
          oneOf:
            - $ref: '#/components/schemas/DurationKind'
            - type: 'null'
        quantity: {type: [string, 'null'], maxLength: 100}
        preparation:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PreparationPhrase'
        storage:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/StoragePhrase'
        warnings: {type: [string, 'null'], maxLength: 500}
        notes: {type: [string, 'null'], maxLength: 1000}
        favourite_id:
          type: [string, 'null']
          format: uuid
          description: The favourite this line came from (M4-P3, counted at issue)
    PrescriptionItemOutput:
      type: object
      required:
        - id
        - position
        - medicine_name
        - form
        - strength
        - dose
        - frequency
        - frequency_text
        - timing
        - duration_days
        - duration_kind
        - slots
        - line_warnings
        - quantity
        - preparation
        - storage
        - warnings
        - notes
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, minimum: 1}
        medicine_name: {type: string}
        form: {type: [string, 'null']}
        strength: {type: [string, 'null']}
        dose: {type: [string, 'null']}
        frequency:
          oneOf:
            - $ref: '#/components/schemas/Frequency'
            - type: 'null'
        frequency_text: {type: [string, 'null']}
        timing:
          oneOf:
            - $ref: '#/components/schemas/Timing'
            - type: 'null'
        duration_days: {type: [integer, 'null']}
        duration_kind:
          oneOf:
            - $ref: '#/components/schemas/DurationKind'
            - type: 'null'
        slots:
          type: array
          description: The slots the frequency marks, from the engine (empty for SOS, ONCE, CUSTOM)
          items:
            $ref: '#/components/schemas/Slot'
        line_warnings:
          type: array
          items:
            $ref: '#/components/schemas/LineWarning'
        quantity: {type: [string, 'null']}
        preparation:
          type: array
          items:
            type: object
            required: [code, text]
            properties:
              code: {type: string}
              text: {type: [string, 'null']}
        storage:
          type: array
          items:
            type: object
            required: [code, days]
            properties:
              code: {type: string}
              days: {type: [integer, 'null']}
        warnings: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        favourite_id: {type: [string, 'null'], format: uuid}
    AdviceInput:
      type: object
      additionalProperties: false
      properties:
        diet: {type: array, maxItems: 10, items: {type: string, maxLength: 300}}
        activity: {type: array, maxItems: 10, items: {type: string, maxLength: 300}}
        return_if:
          type: array
          maxItems: 10
          description: When to come back immediately
          items: {type: string, maxLength: 300}
        notes: {type: [string, 'null'], maxLength: 2000}
    Advice:
      type: object
      required: [diet, activity, return_if, notes]
      properties:
        diet: {type: array, items: {type: string}}
        activity: {type: array, items: {type: string}}
        return_if: {type: array, items: {type: string}}
        notes: {type: [string, 'null']}
    PrescriptionDraft:
      type: object
      additionalProperties: false
      required: [revision]
      description: The whole draft; what is not sent is emptied (decision 3A)
      properties:
        revision:
          type: integer
          minimum: 1
          description: The revision the screen shows (409 RX_STALE otherwise)
        items:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/PrescriptionItemInput'
        advice:
          $ref: '#/components/schemas/AdviceInput'
        follow_up_date:
          type: [string, 'null']
          format: date
          description: After today and within a year
        template_id:
          type: [string, 'null']
          format: uuid
          description: The template the body came from (M4-P3, counted at issue)
        starts_on:
          type: [string, 'null']
          format: date
          description: |
            M6b-P3 (prescriptions R24): the first day of the course, within 30 days of today
            (and of the issue day); null = the issue day
    PrescriptionIssue:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {type: integer, minimum: 1}
    PrescriptionStatus:
      type: string
      enum: [DRAFT, ISSUED, SUPERSEDED]
    LinkDelivery:
      type: string
      enum: [PENDING, NOT_CONSENTED, SUPERSEDED, SENT, EXPIRED]
      description: |
        The patient link's delivery (spec R14, R15): PENDING until M5 sends it (only within 24
        hours of issue), NOT_CONSENTED when the patient allows no messages, SUPERSEDED when a newer
        version replaced it first. SENT and EXPIRED are written by M5.
    DoctorSnapshot:
      type: object
      required: [doctor_id, display_name, qualification, registration_number, registration_council, specialty]
      properties:
        doctor_id: {type: string, format: uuid}
        display_name: {type: string}
        qualification: {type: string}
        registration_number: {type: string}
        registration_council: {type: string}
        specialty: {type: [string, 'null']}
    ClinicSnapshot:
      type: object
      required: [name, address_line, city, state, pincode, phone_e164]
      properties:
        name: {type: string}
        address_line: {type: [string, 'null']}
        city: {type: [string, 'null']}
        state: {type: [string, 'null']}
        pincode: {type: [string, 'null']}
        phone_e164: {type: [string, 'null']}
    PrescriptionVersion:
      type: object
      required: [id, version, status, issued_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status:
          $ref: '#/components/schemas/PrescriptionStatus'
        issued_at: {type: [string, 'null'], format: date-time}
    Prescription:
      type: object
      description: Clinical content (C3). Never cached, never logged.
      required:
        - id
        - visit_id
        - patient_id
        - doctor_id
        - version
        - supersedes_id
        - status
        - revision
        - items
        - advice
        - follow_up_date
        - language
        - issued_at
        - doctor_snapshot
        - clinic_snapshot
        - link_delivery
        - versions
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        visit_id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
        doctor_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        supersedes_id: {type: [string, 'null'], format: uuid}
        status:
          $ref: '#/components/schemas/PrescriptionStatus'
        revision: {type: integer, minimum: 1}
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionItemOutput'
        advice:
          $ref: '#/components/schemas/Advice'
        follow_up_date: {type: [string, 'null'], format: date}
        starts_on:
          type: [string, 'null']
          format: date
          description: M6b-P3 (R24) the first day of the course; null = the issue day
        previous_starts_on:
          type: [string, 'null']
          format: date
          description: A revision's draft only - the first day of the version it revises (a hint)
        language:
          type: [string, 'null']
          enum: [en, hi, null]
          description: The patient's language at issue; the PDF uses it (R20)
        issued_at: {type: [string, 'null'], format: date-time}
        doctor_snapshot:
          oneOf:
            - $ref: '#/components/schemas/DoctorSnapshot'
            - type: 'null'
        clinic_snapshot:
          oneOf:
            - $ref: '#/components/schemas/ClinicSnapshot'
            - type: 'null'
        link_delivery:
          oneOf:
            - $ref: '#/components/schemas/LinkDelivery'
            - type: 'null'
        template_id: {type: [string, 'null'], format: uuid}
        versions:
          type: array
          description: The chain by version, when the response includes it (else empty)
          items:
            $ref: '#/components/schemas/PrescriptionVersion'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PrescriptionSummary:
      type: object
      required: [id, version, issued_at, items]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer}
        issued_at: {type: [string, 'null'], format: date-time}
        items:
          type: array
          items:
            type: object
            required: [medicine_name, dose, frequency, frequency_text, timing, duration_days]
            properties:
              medicine_name: {type: string}
              dose: {type: [string, 'null']}
              frequency:
                oneOf:
                  - $ref: '#/components/schemas/Frequency'
                  - type: 'null'
              frequency_text: {type: [string, 'null']}
              timing:
                oneOf:
                  - $ref: '#/components/schemas/Timing'
                  - type: 'null'
              duration_days: {type: [integer, 'null']}
              duration_kind:
                oneOf:
                  - $ref: '#/components/schemas/DurationKind'
                  - type: 'null'
    NewVisit:
      type: object
      additionalProperties: false
      required: [appointment_id]
      properties:
        appointment_id:
          type: string
          format: uuid
    Vitals:
      type: object
      additionalProperties: false
      description: |
        Optional numbers; the unit is fixed by the key. Bounds only catch typing errors and are not
        clinical ranges. Whole numbers for blood pressure, pulse, SpO2 and respiratory rate.
      properties:
        bp_systolic: {type: [number, 'null'], minimum: 40, maximum: 300, description: mmHg}
        bp_diastolic: {type: [number, 'null'], minimum: 20, maximum: 200, description: mmHg}
        pulse: {type: [number, 'null'], minimum: 20, maximum: 250, description: per minute}
        temp_c: {type: [number, 'null'], minimum: 25, maximum: 45, description: degrees Celsius}
        weight_kg: {type: [number, 'null'], minimum: 0.3, maximum: 400}
        height_cm: {type: [number, 'null'], minimum: 20, maximum: 260}
        spo2: {type: [number, 'null'], minimum: 50, maximum: 100, description: percent}
        resp_rate: {type: [number, 'null'], minimum: 4, maximum: 80, description: per minute}
    VisitChange:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
          description: The revision the screen shows (409 VIS_STALE otherwise)
        chief_complaint: {type: [string, 'null'], maxLength: 500}
        findings: {type: [string, 'null'], maxLength: 5000}
        diagnosis: {type: [string, 'null'], maxLength: 1000}
        notes: {type: [string, 'null'], maxLength: 5000}
        vitals:
          oneOf:
            - $ref: '#/components/schemas/Vitals'
            - type: 'null'
    NewVisitAddendum:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
    VisitAddendum:
      type: object
      required: [id, visit_id, author_user_id, body, created_at]
      properties:
        id: {type: string, format: uuid}
        visit_id: {type: string, format: uuid}
        author_user_id: {type: string, format: uuid}
        body: {type: string}
        created_at: {type: string, format: date-time}
    VisitStatus:
      type: string
      enum: [OPEN, COMPLETED]
    Visit:
      type: object
      description: Clinical content (C3). Never cached, never logged.
      required:
        - id
        - patient_id
        - doctor_id
        - appointment_id
        - status
        - chief_complaint
        - findings
        - diagnosis
        - notes
        - vitals
        - revision
        - started_at
        - completed_at
        - locked_at
        - is_locked
        - addenda
        - created_at
        - updated_at
      properties:
        id: {type: string, format: uuid}
        patient_id: {type: string, format: uuid}
        doctor_id: {type: string, format: uuid}
        appointment_id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/VisitStatus'
        chief_complaint: {type: [string, 'null']}
        findings: {type: [string, 'null']}
        diagnosis: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        vitals:
          type: object
          description: The recorded vitals only (see Vitals for the keys)
          additionalProperties: {type: number}
        revision: {type: integer, minimum: 1}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        locked_at:
          type: [string, 'null']
          format: date-time
          description: completed_at + 24 h; from then on only addenda
        is_locked:
          type: boolean
          description: Whether the visit was locked when this response was made
        addenda:
          type: array
          description: Oldest first
          items:
            $ref: '#/components/schemas/VisitAddendum'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    VisitSummary:
      type: object
      required:
        [id, doctor_id, appointment_id, status, started_at, completed_at, chief_complaint, diagnosis, prescription]
      properties:
        id: {type: string, format: uuid}
        doctor_id: {type: string, format: uuid}
        appointment_id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/VisitStatus'
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        chief_complaint: {type: [string, 'null']}
        diagnosis: {type: [string, 'null']}
        prescription:
          description: The visit's latest issued prescription (medicines only), if any
          oneOf:
            - $ref: '#/components/schemas/PrescriptionSummary'
            - type: 'null'
    Consultation:
      type: object
      required: [visit, patient, history, prescriptions]
      properties:
        visit:
          $ref: '#/components/schemas/Visit'
        patient:
          $ref: '#/components/schemas/Patient'
        history:
          type: array
          description: The patient's previous visits (at most 10), newest first
          items:
            $ref: '#/components/schemas/VisitSummary'
        prescriptions:
          type: array
          description: This visit's prescription chain, by version (M4-P2)
          items:
            $ref: '#/components/schemas/Prescription'
    VisitPage:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VisitSummary'
        next_before:
          type: [string, 'null']
          format: uuid
          description: Pass as before for the next page; null on the last page
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              const: ok
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    SignInRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: Email address or phone number
          examples: [owner@sample-clinic.example, '9000000001']
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
    PatientSignUpRequest:
      type: object
      additionalProperties: false
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          minLength: 3
          maxLength: 254
          examples: [patient@example.test]
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: At least 12 characters (the staff policy); checked by the API
        language:
          description: |
            M6b-P2: the new account's portal language; absent, the me_pt_lang cookie, else en
          $ref: '#/components/schemas/Language'
    PatientSignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
    SignInMethod:
      type: string
      description: How the patient account was created and signs in (M6a-P3)
      enum: [PASSWORD, GOOGLE]
    PatientAccount:
      type: object
      additionalProperties: false
      required: [id, full_name, email, sign_in_method, email_verified, language, slot_times]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
        sign_in_method:
          $ref: '#/components/schemas/SignInMethod'
        email_verified:
          type: boolean
          description: Google accounts are verified; password accounts from M6a-P4
        language:
          description: The portal's language (M6b-P2), en or hi
          $ref: '#/components/schemas/Language'
        slot_times:
          $ref: '#/components/schemas/SlotTimes'
    ClockTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      description: HH:MM on the clinic's clock, 05:00-23:30
    SlotTimes:
      type: object
      additionalProperties: false
      required: [morning, afternoon, evening, night]
      description: |
        M6b-P3 (patient portal R34): the person's times of day for the medicine plan (defaults
        08:00, 14:00, 18:00, 21:00); each 05:00-23:30 and later than the one before (else 422 on
        slot_times). They place the plan on a clock and never change a prescription.
      properties:
        morning: {$ref: '#/components/schemas/ClockTime'}
        afternoon: {$ref: '#/components/schemas/ClockTime'}
        evening: {$ref: '#/components/schemas/ClockTime'}
        night: {$ref: '#/components/schemas/ClockTime'}
    PortalAccountUpdate:
      type: object
      additionalProperties: false
      description: At least one of language and slot_times (else 422)
      properties:
        language:
          $ref: '#/components/schemas/Language'
        slot_times:
          $ref: '#/components/schemas/SlotTimes'
    PatientSession:
      type: object
      required: [account, session]
      properties:
        account:
          $ref: '#/components/schemas/PatientAccount'
        session:
          type: object
          required: [access_expires_at, refresh_expires_at]
          properties:
            access_expires_at:
              type: string
              format: date-time
            refresh_expires_at:
              type: string
              format: date-time
    PatientMe:
      type: object
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/PatientAccount'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
    PasswordResetCompletion:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          description: From the emailed link; never logged
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: At least 12 characters; checked by the API
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
    Accepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
    Session:
      type: object
      required: [user, memberships, session]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        memberships:
          type: array
          description: Active clinic memberships, ordered by clinic name
          items:
            $ref: '#/components/schemas/Membership'
        session:
          type: object
          required: [access_expires_at, refresh_expires_at]
          properties:
            access_expires_at:
              type: string
              format: date-time
            refresh_expires_at:
              type: string
              format: date-time
    Identity:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        memberships:
          type: array
          description: Active clinic memberships, ordered by clinic name
          items:
            $ref: '#/components/schemas/Membership'
    SearchOptions:
      type: object
      required: [specialties, languages]
      properties:
        specialties:
          type: array
          items: {type: string}
        languages:
          type: array
          items: {type: string}
    ClinicSearchHit:
      type: object
      description: M6c-P6 - what a clinic publishes, and nothing else (a test fails on any extra key)
      required: [slug, name, address_line, city, state, pincode, specialties, doctors, next_available]
      properties:
        slug: {type: string}
        name: {type: string}
        address_line: {type: [string, 'null']}
        city: {type: [string, 'null']}
        state: {type: [string, 'null']}
        pincode: {type: [string, 'null']}
        specialties:
          type: array
          items: {type: string}
        doctors:
          type: array
          items:
            type: object
            required: [id, display_name, specialty]
            properties:
              id: {type: string, format: uuid}
              display_name: {type: string}
              specialty: {type: [string, 'null']}
        next_available:
          type: [string, 'null']
          format: date
          description: The first day in the next 7 with a free time (clinic-local), or null
    DoctorSearchHit:
      type: object
      description: M6c-P6 - a public doctor and their clinic's published place
      required: [id, display_name, qualification, specialty, languages, fee_paise, next_available,
                 clinic]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        qualification: {type: string}
        specialty: {type: [string, 'null']}
        languages:
          type: array
          items: {type: string}
        fee_paise: {type: [integer, 'null']}
        next_available: {type: [string, 'null'], format: date}
        clinic:
          type: object
          required: [slug, name, city, state, pincode]
          properties:
            slug: {type: string}
            name: {type: string}
            city: {type: [string, 'null']}
            state: {type: [string, 'null']}
            pincode: {type: [string, 'null']}
    ClinicListing:
      type: object
      description: |
        M6c-P4, spec clinic-onboarding R50-R55. The listing, whether the clinic is discoverable,
        what stands in the way, and each doctor's state, so the screen never computes a rule.
      required: [listed, listed_at, verified, discoverable, search_indexing, language_options,
                 problems, doctors]
      properties:
        search_indexing: {type: boolean}
        language_options:
          type: array
          items: {type: string}
          description: M6c-P5 - the languages a doctor's profile may name
        listed: {type: boolean}
        listed_at: {type: [string, 'null'], format: date-time}
        verified: {type: boolean}
        discoverable:
          type: boolean
          description: Listed and nothing in problems (the one discoverability rule, R55)
        problems:
          type: array
          items:
            type: string
            enum: [NOT_ACTIVE, NOT_VERIFIED, ADDRESS_MISSING, NO_BOOKABLE_DOCTOR]
        doctors:
          type: array
          items:
            type: object
            required: [id, display_name, is_active, verified, visible, has_schedule,
                       can_be_visible, languages, fee_paise, problems]
            properties:
              languages:
                type: array
                items: {type: string}
              fee_paise: {type: [integer, 'null']}
              id: {type: string, format: uuid}
              display_name: {type: string}
              is_active: {type: boolean}
              verified: {type: boolean}
              visible: {type: boolean}
              has_schedule: {type: boolean}
              can_be_visible:
                type: boolean
                description: R53 - active and verified by MediEase
              problems:
                type: array
                items:
                  type: string
                  enum: [INACTIVE, NOT_VERIFIED, NO_SCHEDULE, HIDDEN]
    SuspendReason:
      type: string
      enum: [VERIFICATION_PROBLEM, CLINIC_REQUEST, TERMS_BREACH, PAYMENT, OTHER]
      description: M6c-P4 (R56). Audited; never shown to patients
    SessionUser:
      type: object
      required: [id, full_name, email, phone_e164, is_platform_ops, ops_roles]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: [string, 'null']
        phone_e164:
          type: [string, 'null']
        is_platform_ops:
          type: boolean
        ops_roles:
          type: array
          description: M6c-P2. OPS_ADMIN (clinics, imports, costs), OPS_REVIEWER (applications); empty for clinic staff
          items:
            type: string
            enum: [OPS_ADMIN, OPS_REVIEWER]
    Membership:
      type: object
      required: [membership_id, clinic_id, clinic_name, clinic_status, role, permissions,
                 doctor_id]
      properties:
        membership_id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        clinic_name:
          type: string
        clinic_status:
          $ref: '#/components/schemas/ClinicStatus'
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: What this role may do at this clinic (PRD §8.1), sorted
          items:
            $ref: '#/components/schemas/Permission'
        doctor_id:
          description: |
            M6a-P6: the member's active doctor profile at this clinic, or null. A role OWNER with
            one is a practising owner and gets the Owner / Doctor switch (FR-UX-06).
          type: [string, 'null']
          format: uuid
    Role:
      type: string
      enum: [OWNER, DOCTOR, FRONT_DESK]
    ClinicStatus:
      type: string
      enum: [ONBOARDING, ACTIVE, SUSPENDED]
    MembershipStatus:
      type: string
      enum: [INVITED, ACTIVE, DEACTIVATED]
    Permission:
      type: string
      enum:
        - CLINIC_VIEW
        - CLINIC_MANAGE
        - DOCTORS_VIEW
        - STAFF_MANAGE
        - PATIENTS_MANAGE
        - APPOINTMENTS_MANAGE
        - SCHEDULES_MANAGE
        - QUEUE_MOVE
        - REMINDERS_SCHEDULE
        - CLINICAL_VIEW
        - CLINICAL_WRITE
        - USAGE_METRICS_VIEW
        - RX_PRINT
        - AUDIT_VIEW
    Clinic:
      type: object
      required:
        - id
        - name
        - slug
        - timezone
        - status
        - phone_e164
        - address_line
        - city
        - state
        - pincode
        - specialties
        - patient_code_prefix
        - booking_mode
        - rx_paper_size
        - reminder_evening_before
        - reminder_hours_before
        - request_hold_minutes
        - request_requires_age_sex
      properties:
        request_hold_minutes:
          type: integer
          minimum: 30
          maximum: 480
          description: M6b-P4 how long an online request holds its slot (default 120)
        request_requires_age_sex:
          type: boolean
          description: M6b-P4 whether the request form must ask age and sex
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Lower-case URL segment, used in public links from M7
        timezone:
          type: string
          description: IANA time zone name, e.g. Asia/Kolkata
        status:
          $ref: '#/components/schemas/ClinicStatus'
        phone_e164:
          type: [string, 'null']
        address_line:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        pincode:
          type: [string, 'null']
        specialties:
          type: array
          items:
            type: string
        patient_code_prefix:
          type: string
          pattern: '^[A-Z]{2,4}$'
          description: Prefix of this clinic's patient codes, e.g. ME for ME-0142
        booking_mode:
          $ref: '#/components/schemas/BookingMode'
        rx_paper_size:
          $ref: '#/components/schemas/PaperSize'
        reminder_evening_before:
          type: boolean
          description: M6a-P8 appointment reminder at 19:00 clinic time the day before
        reminder_hours_before:
          type: integer
          minimum: 0
          maximum: 6
          description: M6a-P8 appointment reminder this many hours before the visit; 0 is off
        verified_at:
          type: [string, 'null']
          format: date-time
          description: M6c-P3 when MediEase verified the clinic; null until then (no public page)
        verification_source:
          type: [string, 'null']
          enum: [APPLICATION, OPS_CHECK, null]
        listed:
          type: boolean
          description: M6c-P4 the owner's choice to appear in the directory (only when verified)
        search_indexing:
          type: boolean
          description: M6c-P5 whether search engines may index the public pages
    PublicHours:
      type: object
      required: [weekday, start, end]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 is Monday
        start: {type: string, description: 'Clinic-local HH:MM'}
        end: {type: string, description: 'Clinic-local HH:MM'}
    PublicDoctor:
      type: object
      description: M6c-P5 (R59) - only active doctors verified by MediEase and shown by the owner
      required: [id, display_name, qualification, specialty, hours, languages, fee_paise]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
        qualification: {type: [string, 'null']}
        specialty: {type: [string, 'null']}
        hours:
          type: array
          items:
            $ref: '#/components/schemas/PublicHours'
        languages:
          type: array
          items: {type: string}
          description: M6c-P5 (R61)
        fee_paise:
          type: [integer, 'null']
          description: M6c-P5 (R61) - the consultation fee in paise, if the clinic publishes one
    PublicClinic:
      type: object
      description: What a clinic publishes, and nothing else (NFR-17; a test fails on any extra field)
      required:
        - name
        - slug
        - address_line
        - city
        - state
        - pincode
        - phone_e164
        - timezone
        - booking_mode
        - map_url
        - requires_age_sex
        - doctors
        - specialties
        - indexable
      properties:
        specialties:
          type: array
          items: {type: string}
        indexable:
          type: boolean
          description: |
            M6c-P5 (R62, FR-DIS-06): search engines may index the page - discoverable and not
            opted out. Otherwise the page is noindex.
        name: {type: string}
        slug: {type: string}
        address_line: {type: [string, 'null']}
        city: {type: [string, 'null']}
        state: {type: [string, 'null']}
        pincode: {type: [string, 'null']}
        phone_e164: {type: [string, 'null']}
        timezone: {type: string}
        booking_mode:
          $ref: '#/components/schemas/BookingMode'
        map_url:
          type: [string, 'null']
          description: A map search link built from the address; null without one
        requires_age_sex:
          type: boolean
          description: Whether the request form must ask age and sex
        doctors:
          type: array
          items:
            $ref: '#/components/schemas/PublicDoctor'
    PublicOfferedSlot:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    PublicOfferedSession:
      type: object
      required: [starts_at, ends_at, mode, places_left, slots]
      properties:
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        mode:
          $ref: '#/components/schemas/BookingMode'
        places_left: {type: integer, minimum: 0}
        slots:
          type: array
          description: Slot mode only; empty in token mode
          items:
            $ref: '#/components/schemas/PublicOfferedSlot'
    PublicAvailabilityDay:
      type: object
      required: [date, sessions]
      properties:
        date: {type: string, format: date}
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/PublicOfferedSession'
    PublicAvailability:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/PublicAvailabilityDay'
    NewBookingRequest:
      type: object
      additionalProperties: false
      required: [clinic_slug, doctor_id, session_start, contact_phone, not_emergency_ack]
      properties:
        clinic_slug: {type: string, minLength: 3, maxLength: 63}
        doctor_id: {type: string, format: uuid}
        session_start:
          type: string
          format: date-time
          description: The session's start as offered (the session may not exist yet)
        slot_start:
          type: [string, 'null']
          format: date-time
          description: Slot mode only
        contact_phone: {type: string, minLength: 1, maxLength: 20}
        age_years: {type: [integer, 'null'], minimum: 0, maximum: 120}
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        reason:
          type: [string, 'null']
          maxLength: 200
          description: Optional; clinical text, never logged or notified
        not_emergency_ack:
          type: boolean
          description: Must be true (the patient confirms this is not an emergency)
    PortalBookingRequest:
      type: object
      required:
        - id
        - status
        - original_starts_at
        - decline_reason
        - respond_by
        - clinic_id
        - clinic_name
        - clinic_slug
        - clinic_phone_e164
        - timezone
        - doctor_name
        - mode
        - starts_at
        - created_at
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [REQUESTED, PROPOSED, DECLINED, EXPIRED]
          description: M6b-P5 (R48); PROPOSED shows the clinic's suggested time as starts_at
        clinic_id: {type: string, format: uuid}
        clinic_name: {type: string}
        clinic_slug: {type: string}
        clinic_phone_e164: {type: [string, 'null']}
        timezone: {type: string}
        doctor_name: {type: string}
        mode:
          $ref: '#/components/schemas/BookingMode'
        starts_at:
          type: string
          format: date-time
          description: The slot's start, or the session's in token mode
        created_at: {type: string, format: date-time}
        original_starts_at:
          type: [string, 'null']
          format: date-time
          description: The time first asked for, when the clinic proposed another
        decline_reason:
          oneOf:
            - $ref: '#/components/schemas/DeclineReason'
            - type: 'null'
        respond_by:
          type: [string, 'null']
          format: date-time
          description: While open, when the request (or proposal) ends unanswered
    PortalBookingRequestList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalBookingRequest'
    StaffBookingRequest:
      type: object
      required:
        - id
        - full_name
        - age_years
        - sex
        - phone_e164
        - reason
        - doctor_name
        - mode
        - starts_at
        - created_at
        - hold_expires_at
        - holding
        - hold_overridden
        - respond_by
        - status
        - doctor_id
        - session_id
        - original_starts_at
        - patient_id
        - patient_code
        - appointment_id
        - answered_at
        - answered_by_name
        - decided_at
        - decided_by
        - decline_reason
        - decline_note
      properties:
        status:
          $ref: '#/components/schemas/BookingRequestStatus'
        doctor_id: {type: [string, 'null'], format: uuid}
        session_id: {type: [string, 'null'], format: uuid}
        original_starts_at:
          type: [string, 'null']
          format: date-time
          description: A proposal's original time (R40)
        patient_id: {type: [string, 'null'], format: uuid}
        patient_code: {type: [string, 'null']}
        appointment_id: {type: [string, 'null'], format: uuid}
        answered_at: {type: [string, 'null'], format: date-time}
        answered_by_name: {type: [string, 'null']}
        decided_at: {type: [string, 'null'], format: date-time}
        decided_by:
          type: [string, 'null']
          enum: [STAFF, PATIENT, SYSTEM, null]
        decline_reason:
          oneOf:
            - $ref: '#/components/schemas/DeclineReason'
            - type: 'null'
        decline_note: {type: [string, 'null'], description: Staff only}
        id: {type: string, format: uuid}
        full_name: {type: string}
        age_years: {type: [integer, 'null']}
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        phone_e164: {type: string}
        reason: {type: [string, 'null']}
        doctor_name: {type: string}
        mode:
          $ref: '#/components/schemas/BookingMode'
        starts_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        hold_expires_at: {type: string, format: date-time}
        holding:
          type: boolean
          description: True while the request still holds its slot (ADR-0018)
        hold_overridden:
          type: boolean
          description: True when staff booked over the hold (R18a)
        respond_by:
          type: string
          format: date-time
          description: After this the request expires (M6b-P5)
    StaffBookingRequestList:
      type: object
      required: [items, open_count, expired_7d]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffBookingRequest'
        open_count: {type: integer, minimum: 0, description: Open requests now (R45)}
        expired_7d:
          type: integer
          minimum: 0
          description: Requests that expired unanswered in the last 7 days
    BookingRequestStatus:
      type: string
      enum: [PENDING, PROPOSED, ACCEPTED, DECLINED, EXPIRED]
      description: M6b-P5 (R31). PENDING and PROPOSED are open; an open request past its deadline reads EXPIRED
    DeclineReason:
      type: string
      enum: [TIME_UNAVAILABLE, DOCTOR_UNAVAILABLE, PLEASE_CALL, NOT_ONLINE, DUPLICATE, OTHER,
             PATIENT_DECLINED, CLINIC_UNAVAILABLE]
      description: |
        R39; PATIENT_DECLINED is the patient's No thanks to a proposal, never a staff choice.
        CLINIC_UNAVAILABLE (M6c-P4): withdrawn by the system when MediEase suspended the clinic.
    NewRequestRecord:
      type: object
      additionalProperties: false
      description: |
        R37: a new clinic record from the request. The name defaults to the account's; sex is
        required when the patient gave none; an age (default the request's) or a date of birth.
      properties:
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        age_years: {type: [integer, 'null'], minimum: 0, maximum: 120}
        date_of_birth: {type: [string, 'null'], format: date}
        full_name: {type: [string, 'null'], minLength: 1, maxLength: 200}
    RequestRecordChoice:
      type: object
      additionalProperties: false
      description: Exactly one of patient_id (this clinic's record) and new_patient (R36-R38)
      properties:
        patient_id: {type: [string, 'null'], format: uuid}
        new_patient:
          oneOf:
            - $ref: '#/components/schemas/NewRequestRecord'
            - type: 'null'
    RequestDecline:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [TIME_UNAVAILABLE, DOCTOR_UNAVAILABLE, PLEASE_CALL, NOT_ONLINE, DUPLICATE, OTHER]
        note:
          type: [string, 'null']
          maxLength: 200
          description: For staff only; never shown to the patient, logged or notified
    RequestProposal:
      type: object
      additionalProperties: false
      required: [session_id]
      description: R40. Another session (and slot, in slot mode) of the same doctor, plus the record
      properties:
        session_id: {type: string, format: uuid}
        slot_start: {type: [string, 'null'], format: date-time}
        patient_id: {type: [string, 'null'], format: uuid}
        new_patient:
          oneOf:
            - $ref: '#/components/schemas/NewRequestRecord'
            - type: 'null'
    RequestAnswer:
      type: object
      required: [id, status, patient_id, appointment_id]
      properties:
        id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/BookingRequestStatus'
        patient_id: {type: [string, 'null'], format: uuid}
        appointment_id: {type: [string, 'null'], format: uuid}
    RequestCandidate:
      type: object
      required: [id, code, full_name, age_years, no_shows]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        full_name: {type: string}
        age_years: {type: integer}
        no_shows:
          type: integer
          minimum: 0
          description: NO_SHOW appointments in the last 12 months (R47); staff only, decides nothing
    RequestCandidateList:
      type: object
      required: [linked, items, suggested]
      properties:
        linked:
          type: boolean
          description: The account already has this clinic's record (the only item); accept must use it
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequestCandidate'
        suggested:
          type: object
          required: [full_name, age_years, sex]
          properties:
            full_name: {type: string}
            age_years: {type: [integer, 'null']}
            sex:
              oneOf:
                - $ref: '#/components/schemas/Sex'
                - type: 'null'
    PortalProposalAnswer:
      type: object
      required: [id, status]
      properties:
        id: {type: string, format: uuid}
        status:
          $ref: '#/components/schemas/BookingRequestStatus'
    HeldPlace:
      type: object
      description: A slot (or, in token mode, a place) held by an online request (ADR-0018)
      required: [slot_start, until]
      properties:
        slot_start: {type: [string, 'null'], format: date-time}
        until: {type: string, format: date-time}
    PatientNotificationKind:
      type: string
      enum: [booking.accepted, booking.declined, booking.proposed, booking.expired,
             appointment.confirmed, appointment.moved, appointment.cancelled,
             prescription.ready, medicine.due]
      description: M6b-P6 (R57)
    PortalNotification:
      type: object
      required: [id, kind, title, link, created_at, read_at]
      properties:
        id: {type: string, format: uuid}
        kind:
          $ref: '#/components/schemas/PatientNotificationKind'
        title:
          type: string
          description: In the account's language; no diagnosis, medicine, reason text, note or phone
        link: {type: string, description: A portal path}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
    PortalNotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalNotification'
    PortalNotificationSummary:
      type: object
      required: [unread, latest_id]
      properties:
        unread: {type: integer, minimum: 0}
        latest_id: {type: [string, 'null'], format: uuid}
    PortalNotificationsMarked:
      type: object
      required: [marked]
      properties:
        marked: {type: integer, minimum: 0}
    PortalNotificationPreference:
      type: object
      required: [kind, in_app, email]
      properties:
        kind:
          $ref: '#/components/schemas/PatientNotificationKind'
        in_app: {type: boolean}
        email:
          type: [boolean, 'null']
          description: Null where email is not offered (only the four booking answers)
    PortalNotificationPreferenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalNotificationPreference'
    PortalNotificationPreferenceChange:
      type: object
      additionalProperties: false
      required: [kind, channel, enabled]
      properties:
        kind:
          $ref: '#/components/schemas/PatientNotificationKind'
        channel: {type: string, enum: [IN_APP, EMAIL]}
        enabled: {type: boolean}
    ApplicationRejectReason:
      type: string
      enum: [REGISTRATION_NOT_FOUND, CERTIFICATE_UNCLEAR, DETAILS_DO_NOT_MATCH, NOT_ELIGIBLE, DUPLICATE, OTHER]
    ApplicationStatus:
      type: string
      enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED]
    OpsApplicationDoctor:
      type: object
      required: [id, position, name, qualification, council, registration_number, is_owner, certificate, check]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, minimum: 1, maximum: 10}
        name: {type: string}
        qualification: {type: string}
        council: {type: string}
        registration_number: {type: string}
        is_owner: {type: boolean}
        certificate:
          type: object
          required: [content_type, size]
          properties:
            content_type: {type: string}
            size: {type: integer}
        check:
          oneOf:
            - type: 'null'
            - type: object
              required: [register_checked, certificate_matches, result, note, checked_at, checked_by]
              properties:
                register_checked: {type: boolean}
                certificate_matches: {type: boolean}
                result: {type: string, enum: [VERIFIED, NOT_VERIFIED]}
                note: {type: [string, 'null']}
                checked_at: {type: string, format: date-time}
                checked_by: {type: string, format: uuid}
    OpsApplicationDetail:
      type: object
      description: M6c-P2 (R26). For OPS_REVIEWER only.
      required:
        - id
        - reference
        - kind
        - status
        - clinic_name
        - address_line
        - city
        - state
        - pincode
        - clinic_phone_e164
        - specialties
        - owner_name
        - owner_phone_e164
        - owner_email
        - owner_practises
        - submitted_at
        - email_verified_at
        - taken_by
        - taken_at
        - decided_at
        - decision_reason
        - decision_message
        - duplicate_of
        - clinic_id
        - all_verified
        - doctors
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        kind: {type: string, enum: [CLINIC, SOLO_DOCTOR]}
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        clinic_name: {type: string}
        address_line: {type: string}
        city: {type: string}
        state: {type: string}
        pincode: {type: string}
        clinic_phone_e164: {type: string}
        specialties:
          type: array
          items: {type: string}
        owner_name: {type: string}
        owner_phone_e164: {type: string}
        owner_email: {type: string}
        owner_practises: {type: boolean}
        submitted_at: {type: string, format: date-time}
        email_verified_at: {type: [string, 'null'], format: date-time}
        taken_by: {type: [string, 'null'], format: uuid}
        taken_at: {type: [string, 'null'], format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
        decision_reason:
          oneOf:
            - $ref: '#/components/schemas/ApplicationRejectReason'
            - type: 'null'
        decision_message: {type: [string, 'null']}
        duplicate_of:
          type: array
          items: {type: string}
        clinic_id: {type: [string, 'null'], format: uuid}
        all_verified: {type: boolean}
        doctors:
          type: array
          items:
            $ref: '#/components/schemas/OpsApplicationDoctor'
    ClinicApplicationInput:
      type: object
      additionalProperties: false
      description: M6c-P1 (spec R2-R5). The `application` part of POST /public/applications
      required:
        - kind
        - clinic_name
        - address_line
        - city
        - state
        - pincode
        - clinic_phone
        - specialties
        - owner_name
        - owner_phone
        - owner_email
        - owner_practises
        - doctors
      properties:
        kind: {type: string, enum: [CLINIC, SOLO_DOCTOR]}
        clinic_name: {type: string, maxLength: 200}
        address_line: {type: string, maxLength: 300}
        city: {type: string, maxLength: 100}
        state: {type: string, maxLength: 100}
        pincode: {type: string, pattern: '^[1-9][0-9]{5}$'}
        clinic_phone: {type: string, maxLength: 20}
        specialties:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string}
        owner_name: {type: string, maxLength: 200}
        owner_phone: {type: string, maxLength: 20, description: An Indian mobile number}
        owner_email: {type: string, maxLength: 254}
        owner_practises: {type: boolean}
        doctors:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ClinicApplicationDoctor'
        website:
          type: string
          maxLength: 200
          description: Left empty by people; a filled value is answered like a success and dropped
    ClinicApplicationDoctor:
      type: object
      additionalProperties: false
      required: [name, qualification, council, registration_number]
      properties:
        name: {type: string, maxLength: 200}
        qualification: {type: string, maxLength: 200}
        council:
          type: string
          maxLength: 200
          description: The National Medical Commission or a state medical council, as published
        registration_number: {type: string, maxLength: 80}
        is_owner: {type: boolean, default: false}
    ApplicationReceipt:
      type: object
      required: [reference, email_masked]
      properties:
        reference: {type: string, description: 'MA-<year>-NNNN'}
        email_masked: {type: string}
    OpsApplicationSummary:
      type: object
      required:
        - id
        - reference
        - kind
        - clinic_name
        - city
        - doctors
        - submitted_at
        - email_verified_at
        - possible_duplicate
        - status
        - taken_at
        - decided_at
      properties:
        id: {type: string, format: uuid}
        reference: {type: string}
        kind: {type: string, enum: [CLINIC, SOLO_DOCTOR]}
        clinic_name: {type: string}
        city: {type: string}
        doctors: {type: integer, minimum: 1, maximum: 10}
        submitted_at: {type: string, format: date-time}
        email_verified_at: {type: string, format: date-time}
        possible_duplicate: {type: boolean}
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        taken_at: {type: [string, 'null'], format: date-time}
        decided_at: {type: [string, 'null'], format: date-time}
    LiveLink:
      type: object
      required: [url, expires_at]
      properties:
        url: {type: string, description: 'PUBLIC_BASE_URL/q/<token>'}
        expires_at: {type: string, format: date-time}
    LiveQueue:
      type: object
      additionalProperties: false
      description: R70; the only fields the public page may carry (a test fails on any other)
      required:
        - clinic_name
        - doctor_name
        - timezone
        - mode
        - state
        - token_number
        - slot_start
        - ahead
        - now_seeing_token
        - now_seeing_slot
        - session_starts_at
      properties:
        clinic_name: {type: string}
        doctor_name: {type: string}
        timezone: {type: string}
        mode:
          $ref: '#/components/schemas/BookingMode'
        state:
          type: string
          enum: [NOT_STARTED, WAITING, YOUR_TURN, DONE, CANCELLED]
        token_number: {type: [integer, 'null']}
        slot_start: {type: [string, 'null'], format: date-time}
        ahead:
          type: integer
          minimum: 0
          description: Only BOOKED or ARRIVED entries before this one in queue order
        now_seeing_token: {type: [integer, 'null']}
        now_seeing_slot: {type: [string, 'null'], format: date-time}
        session_starts_at: {type: string, format: date-time}
    LinkMethod:
      type: string
      enum: [INVITE, RX_LINK]
      description: How a patient account was linked to a record (M6b-P1; BOOKING from P5)
    PortalClinic:
      type: object
      required: [id, name, phone_e164, address_line, city, timezone]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        phone_e164: {type: [string, 'null']}
        address_line: {type: [string, 'null']}
        city: {type: [string, 'null']}
        timezone:
          type: string
          description: The clinic's IANA time zone; times are shown on its clock (M6b-P2)
          examples: [Asia/Kolkata]
    PortalLink:
      type: object
      description: One linked clinic (spec R10)
      required: [id, clinic, patient_first_name, patient_code, method, linked_at]
      properties:
        id: {type: string, format: uuid}
        clinic:
          $ref: '#/components/schemas/PortalClinic'
        patient_first_name: {type: string}
        patient_code: {type: string, examples: [SC-0004]}
        method:
          $ref: '#/components/schemas/LinkMethod'
        linked_at: {type: string, format: date-time}
    PortalLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalLink'
    PortalLinked:
      type: object
      description: A link just made
      required: [id, clinic_id, clinic_name, patient_first_name, patient_code, method, linked_at]
      properties:
        id: {type: string, format: uuid}
        clinic_id: {type: string, format: uuid}
        clinic_name: {type: string}
        patient_first_name: {type: string}
        patient_code: {type: string}
        method:
          $ref: '#/components/schemas/LinkMethod'
        linked_at: {type: string, format: date-time}
    PortalUnlinked:
      type: object
      required: [id, revoked_at]
      properties:
        id: {type: string, format: uuid}
        revoked_at: {type: string, format: date-time}
    PortalPrescriptionLinkRequest:
      type: object
      additionalProperties: false
      required: [token, phone_last4]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: The token of the prescription link (the part after /p/)
        phone_last4:
          type: string
          pattern: '^[0-9]{4}$'
    PortalInvite:
      type: object
      description: Who an invite is for (spec R2)
      required: [clinic_name, patient_first_name, patient_code]
      properties:
        clinic_name: {type: string}
        patient_first_name: {type: string}
        patient_code: {type: string}
    PortalInvitation:
      type: object
      description: A new invite; the URL appears here once and is never stored (spec R1)
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: PUBLIC_BASE_URL/portal/link/{token}
        expires_at: {type: string, format: date-time}
    PortalStatus:
      type: string
      enum: [NOT_LINKED, INVITED, LINKED]
    PatientPortalStatus:
      type: object
      description: A record's portal status for staff (spec R14); never the account's details
      required: [status, method, linked_at, invite_expires_at]
      properties:
        status:
          $ref: '#/components/schemas/PortalStatus'
        method:
          oneOf:
            - $ref: '#/components/schemas/LinkMethod'
            - type: 'null'
        linked_at: {type: [string, 'null'], format: date-time}
        invite_expires_at: {type: [string, 'null'], format: date-time}
    PortalAppointment:
      type: object
      description: An appointment as the patient sees it (spec R11); no reason, no notes
      required:
        - id
        - doctor_name
        - on_date
        - starts_at
        - session_starts_at
        - session_ends_at
        - mode
        - slot_start
        - token_number
        - status
      properties:
        id: {type: string, format: uuid}
        doctor_name: {type: string}
        on_date: {type: string, format: date}
        starts_at:
          type: string
          format: date-time
          description: The slot's start, or the session's in token mode
        session_starts_at: {type: string, format: date-time}
        session_ends_at: {type: string, format: date-time}
        mode:
          $ref: '#/components/schemas/BookingMode'
        slot_start: {type: [string, 'null'], format: date-time}
        token_number: {type: [integer, 'null']}
        status:
          $ref: '#/components/schemas/AppointmentStatus'
    PortalAppointmentGroup:
      type: object
      required: [clinic_id, clinic_name, timezone, phone_e164, appointments]
      properties:
        clinic_id: {type: string, format: uuid}
        clinic_name: {type: string}
        timezone: {type: string, description: The clinic's IANA time zone (M6b-P2)}
        phone_e164: {type: [string, 'null'], description: The clinic's phone for a call button}
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/PortalAppointment'
    PortalAppointmentGroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalAppointmentGroup'
    PortalPrescription:
      type: object
      description: A chain's latest issued version, without content (spec R12)
      required: [id, clinic_id, clinic_name, doctor_name, version, issued_at]
      properties:
        id: {type: string, format: uuid}
        clinic_id: {type: string, format: uuid}
        clinic_name: {type: string}
        doctor_name: {type: string}
        version: {type: integer, minimum: 1}
        issued_at: {type: string, format: date-time}
    PortalPrescriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalPrescription'
    PortalReminder:
      type: object
      description: A reminder with its visible status (spec R13, FR-REM-05)
      required: [id, clinic_id, clinic_name, kind, follow_up_date, due_at, status]
      properties:
        id: {type: string, format: uuid}
        clinic_id: {type: string, format: uuid}
        clinic_name: {type: string}
        kind: {type: string, enum: [FOLLOW_UP, APPOINTMENT]}
        follow_up_date: {type: string, format: date}
        due_at: {type: string, format: date-time}
        status:
          $ref: '#/components/schemas/ReminderStatus'
    PortalReminderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortalReminder'
    MedicineReminder:
      type: object
      additionalProperties: false
      required: [enabled, remind_at]
      description: R38 - off by default; remind_at null = the slot's own time
      properties:
        enabled: {type: boolean}
        remind_at:
          oneOf:
            - $ref: '#/components/schemas/ClockTime'
            - type: 'null'
    MedicineReminderInput:
      type: object
      additionalProperties: false
      required: [prescription_id, item_id, slot, enabled]
      properties:
        prescription_id: {type: string, format: uuid}
        item_id: {type: string, format: uuid}
        slot:
          $ref: '#/components/schemas/Slot'
        enabled: {type: boolean}
        remind_at:
          oneOf:
            - $ref: '#/components/schemas/ClockTime'
            - type: 'null'
    MedicineLine:
      type: object
      description: |
        One prescribed line and where it comes from (R36). Words in the account's language;
        medicine_name, form_strength and dose as the doctor wrote them.
      required: [prescription_id, version, clinic_id, clinic_name, clinic_phone_e164, doctor_name,
        starts_on, timezone, item_id, medicine_name, form_strength, dose, as_written, timing, how,
        duration]
      properties:
        prescription_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        clinic_id: {type: string, format: uuid}
        clinic_name: {type: string}
        clinic_phone_e164: {type: [string, 'null']}
        doctor_name: {type: string}
        starts_on: {type: string, format: date}
        timezone: {type: string, description: "The clinic's zone, for times marked (M6b-P3b)"}
        item_id: {type: string, format: uuid}
        medicine_name: {type: string}
        form_strength: {type: [string, 'null']}
        dose: {type: [string, 'null']}
        as_written:
          type: [string, 'null']
          description: SOS, ONCE, CUSTOM or no frequency - the words, instead of a slot
        timing: {type: [string, 'null'], description: Food timing words}
        how: {type: [string, 'null'], description: How to give (preparation) words}
        duration: {type: string, description: Duration words (never an invented end)}
    MedicinePlanEntry:
      allOf:
        - $ref: '#/components/schemas/MedicineLine'
        - type: object
          required: [day, days_total, reminder, mark]
          properties:
            mark:
              description: M6b-P3b - the patient's mark, timed entries only (dose is the doctor's)
              oneOf:
                - $ref: '#/components/schemas/MedicineDose'
                - type: 'null'
            day: {type: integer, minimum: 1, description: Day N of the course}
            days_total: {type: [integer, 'null'], description: M for a number of days; else null}
            reminder:
              description: Timed entries only
              oneOf:
                - $ref: '#/components/schemas/MedicineReminder'
                - type: 'null'
    DoseStatus:
      type: string
      enum: [TAKEN, SKIPPED, NOT_RECORDED, UPCOMING]
      description: |
        M6b-P3b (R45-R47): what the patient marked; NOT_RECORDED (its time has passed with no
        mark) and UPCOMING are derived, never stored, and never mean "missed"
    MedicineDose:
      type: object
      additionalProperties: false
      required: [status, marked_at, markable]
      properties:
        status:
          $ref: '#/components/schemas/DoseStatus'
        marked_at: {type: [string, 'null'], format: date-time}
        markable:
          type: boolean
          description: Within the window - from 00:00 of its day to 48 hours after its time
    DoseInput:
      type: object
      additionalProperties: false
      required: [prescription_id, item_id, on_date, slot, state]
      properties:
        prescription_id: {type: string, format: uuid}
        item_id: {type: string, format: uuid}
        on_date: {type: string, format: date}
        slot:
          $ref: '#/components/schemas/Slot'
        state: {type: string, enum: [TAKEN, SKIPPED]}
    DoseHistory:
      type: object
      additionalProperties: false
      required: [prescription_id, version, clinic_name, clinic_phone_e164, timezone, starts_on,
        counts, days, versions]
      properties:
        prescription_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        clinic_name: {type: string}
        clinic_phone_e164: {type: [string, 'null']}
        timezone: {type: string}
        starts_on: {type: string, format: date}
        counts:
          type: object
          description: Doses per state over the days shown (no score or percentage)
          additionalProperties: {type: integer, minimum: 0}
        days:
          type: array
          description: Newest first, from the course start (at most 60 days back) to today or its end
          items:
            type: object
            additionalProperties: false
            required: [date, doses]
            properties:
              date: {type: string, format: date}
              doses:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [item_id, medicine_name, dose, slot, status, marked_at]
                  properties:
                    item_id: {type: string, format: uuid}
                    medicine_name: {type: string}
                    dose: {type: [string, 'null']}
                    slot:
                      $ref: '#/components/schemas/Slot'
                    status:
                      $ref: '#/components/schemas/DoseStatus'
                    marked_at: {type: [string, 'null'], format: date-time}
        versions:
          type: array
          description: The chain's issued and superseded versions, newest first (R49)
          items:
            type: object
            additionalProperties: false
            required: [prescription_id, version, status]
            properties:
              prescription_id: {type: string, format: uuid}
              version: {type: integer, minimum: 1}
              status: {type: string, enum: [ISSUED, SUPERSEDED]}
    MedicinePlan:
      type: object
      additionalProperties: false
      required: [date, today, language, has_prescriptions, slots, as_written]
      properties:
        date: {type: string, format: date}
        today: {type: string, format: date}
        language:
          $ref: '#/components/schemas/Language'
        has_prescriptions:
          type: boolean
          description: R44 - false when no linked record has a current version
        slots:
          type: array
          description: Only the slots with an entry, morning to night
          items:
            type: object
            additionalProperties: false
            required: [slot, label, time, entries]
            properties:
              slot:
                $ref: '#/components/schemas/Slot'
              label: {type: string}
              time:
                $ref: '#/components/schemas/ClockTime'
              entries:
                type: array
                items:
                  $ref: '#/components/schemas/MedicinePlanEntry'
        as_written:
          type: array
          items:
            $ref: '#/components/schemas/MedicinePlanEntry'
    MedicineCourse:
      type: object
      required: [prescription_id, version, clinic_id, clinic_name, clinic_phone_e164, doctor_name,
        starts_on, revised, reminders_set, ends_on, lines]
      properties:
        prescription_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        clinic_id: {type: string, format: uuid}
        clinic_name: {type: string}
        clinic_phone_e164: {type: [string, 'null']}
        doctor_name: {type: string}
        starts_on: {type: string, format: date}
        revised:
          type: boolean
          description: R39 - a version after the first (reminders are set again)
        reminders_set: {type: boolean}
        ends_on:
          type: [string, 'null']
          format: date
          description: When every line has a number of days; else null
        lines:
          type: array
          items:
            type: object
            required: [item_id, medicine_name, form_strength, dose, as_written, timing, how,
              duration, ends_on, slots]
            properties:
              item_id: {type: string, format: uuid}
              medicine_name: {type: string}
              form_strength: {type: [string, 'null']}
              dose: {type: [string, 'null']}
              as_written: {type: [string, 'null']}
              timing: {type: [string, 'null']}
              how: {type: [string, 'null']}
              duration: {type: string}
              ends_on: {type: [string, 'null'], format: date}
              slots:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [slot, label, time, reminder]
                  properties:
                    slot:
                      $ref: '#/components/schemas/Slot'
                    label: {type: string}
                    time:
                      $ref: '#/components/schemas/ClockTime'
                    reminder:
                      $ref: '#/components/schemas/MedicineReminder'
    MedicineCourseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MedicineCourse'
    RxVocabulary:
      type: object
      additionalProperties: false
      required: [slot_sets, special_frequencies, timings, preparations, storage, duration_kinds,
        line_warnings, duration_max_days, start_window_days]
      properties:
        slot_sets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [length, slots]
            properties:
              length: {type: integer}
              slots:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        special_frequencies:
          type: array
          items: {type: string, enum: [SOS, ONCE, CUSTOM]}
        timings:
          type: array
          items:
            $ref: '#/components/schemas/Timing'
        preparations:
          type: array
          items: {type: string}
        storage:
          type: array
          items: {type: string}
        duration_kinds:
          type: array
          items:
            $ref: '#/components/schemas/DurationKind'
        line_warnings:
          type: array
          items:
            $ref: '#/components/schemas/LineWarning'
        duration_max_days: {type: integer}
        start_window_days: {type: integer}
    PatientLinkInfo:
      type: object
      additionalProperties: false
      description: What the clinic sees about a patient link (M4-P5 decision 6A); no content.
      required: [id, url, expires_at, locked, open_count, last_opened_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: PUBLIC_BASE_URL/p/<token>, for the QR code and copy button
        expires_at:
          type: string
          format: date-time
        locked:
          type: boolean
        open_count:
          type: integer
          minimum: 0
        last_opened_at:
          type: [string, 'null']
          format: date-time
    PatientLinkSummary:
      type: object
      additionalProperties: false
      required: [clinic_name, language, locked, challenge_required]
      properties:
        clinic_name:
          type: string
        language:
          $ref: '#/components/schemas/Language'
        locked:
          type: boolean
        challenge_required:
          type: boolean
    PatientLinkChallenge:
      type: object
      additionalProperties: false
      required: [phone_last4]
      properties:
        phone_last4:
          type: string
          pattern: '^[0-9]{4}$'
    PatientLinkView:
      type: object
      additionalProperties: false
      required: [view_token, view_expires_at]
      properties:
        view_token:
          type: string
          maxLength: 200
        view_expires_at:
          type: string
          format: date-time
    PageField:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
    PatientPrescriptionPage:
      type: object
      additionalProperties: false
      description: |
        The patient page (spec §6, R11, R20): every string final; labels in the page's language,
        the doctor's text as written. No patient details.
      required: [language, version, clinic_name, clinic_phone_e164, call_label, doctor_name,
        doctor_lines, issued_on, updated_note, medicines_heading, medicines, advice_heading,
        advice, advice_notes, follow_up, schedule_heading, schedule_columns, schedule_as_written,
        schedule]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        version:
          type: integer
          minimum: 1
        clinic_name:
          type: string
        clinic_phone_e164:
          type: [string, 'null']
        call_label:
          type: string
        doctor_name:
          type: string
        doctor_lines:
          type: array
          items:
            type: string
        issued_on:
          $ref: '#/components/schemas/PageField'
        updated_note:
          type: [string, 'null']
        medicines_heading:
          type: string
        medicines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [number, name, form_strength, fields]
            properties:
              number:
                type: integer
              name:
                type: string
              form_strength:
                type: [string, 'null']
              fields:
                type: array
                items:
                  $ref: '#/components/schemas/PageField'
        advice_heading:
          type: string
        advice:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [heading, entries]
            properties:
              heading:
                type: string
              entries:
                type: array
                items:
                  type: string
        advice_notes:
          oneOf:
            - $ref: '#/components/schemas/PageField'
            - type: 'null'
        follow_up:
          oneOf:
            - $ref: '#/components/schemas/PageField'
            - type: 'null'
        schedule_heading:
          type: string
        schedule_columns:
          type: array
          description: The four times of day, in the page's language (morning to night)
          items:
            type: string
        schedule_as_written:
          type: string
        schedule:
          type: array
          description: |
            M6b-P3 (prescriptions R25): the Medicine schedule from the one engine; empty for a
            version issued before layout 2. marks has one entry per schedule column.
          items:
            $ref: '#/components/schemas/ScheduleRow'
    ScheduleRow:
      type: object
      additionalProperties: false
      required: [number, name, dose, marks, as_written, timing, how, duration]
      properties:
        number: {type: integer}
        name: {type: string}
        dose: {type: [string, 'null']}
        marks:
          type: array
          minItems: 4
          maxItems: 4
          items: {type: boolean}
        as_written:
          type: [string, 'null']
          description: SOS, ONCE, CUSTOM or no frequency - the words instead of marks
        timing: {type: [string, 'null']}
        how: {type: [string, 'null']}
        duration: {type: string}
    PaperSize:
      type: string
      enum: [A5, A4]
      description: |
        The clinic's prescription paper (M4-P4 decision 3A). Applied when a version is first
        rendered and then fixed in its stored PDF; a change never alters a printed prescription.
    PrintablePrescription:
      type: object
      additionalProperties: false
      description: What front desk may print (M4-P4 decision 2A). No clinical content.
      required: [id, visit_id, version, issued_at, doctor_display_name]
      properties:
        id:
          type: string
          format: uuid
        visit_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        issued_at:
          type: string
          format: date-time
        doctor_display_name:
          type: string
    PrintablePrescriptionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PrintablePrescription'
    Sex:
      type: string
      enum: [FEMALE, MALE, OTHER, UNDISCLOSED]
    Language:
      type: string
      enum: [en, hi]
      description: Language of messages to the patient (English and Hindi at MVP)
    Patient:
      type: object
      description: |
        A patient as staff see them. Personal data: never cached, never logged. The phone is the
        contact of record (the guardian's for a patient under 18).
      required:
        - id
        - code
        - full_name
        - phone_e164
        - sex
        - date_of_birth
        - age_years
        - age_is_estimated
        - is_minor
        - guardian_name
        - language
        - whatsapp_consent
        - sms_consent
        - opted_out
        - opted_out_at
        - whatsapp_allowed
        - sms_allowed
        - consent_recorded_at
        - consent_recorded_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z]{2,4}-[0-9]{4,}$'
          description: Clinic-scoped, human-readable, never reused or edited
        full_name:
          type: string
        phone_e164:
          type: string
        sex:
          $ref: '#/components/schemas/Sex'
        date_of_birth:
          type: [string, 'null']
          format: date
        age_years:
          type: integer
          description: Whole years on the clinic's today (its own time zone)
        age_is_estimated:
          type: boolean
          description: True when only an age was recorded, not a date of birth
        is_minor:
          type: boolean
        guardian_name:
          type: [string, 'null']
        language:
          $ref: '#/components/schemas/Language'
        whatsapp_consent:
          type: boolean
        sms_consent:
          type: boolean
        opted_out:
          type: boolean
          description: An opt-out overrides consent until an explicit opt-in
        opted_out_at:
          type: [string, 'null']
          format: date-time
        whatsapp_allowed:
          type: boolean
          description: WhatsApp consent given and not opted out - the one rule every sender uses
        sms_allowed:
          type: boolean
          description: SMS consent given and not opted out
        consent_recorded_at:
          type: [string, 'null']
          format: date-time
          description: Null means never asked; set (with both flags false) means asked and declined
        consent_recorded_by:
          type: [string, 'null']
          format: uuid
          description: The staff member who recorded the current consent
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewPatient:
      type: object
      additionalProperties: false
      required: [full_name, phone, sex]
      description: Give exactly one of date_of_birth and age_years (I1).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          minLength: 1
          maxLength: 20
          description: Any usual Indian format; normalised to E.164. The guardian's for a minor.
        sex:
          $ref: '#/components/schemas/Sex'
        date_of_birth:
          type: [string, 'null']
          format: date
        age_years:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
        guardian_name:
          type: [string, 'null']
          maxLength: 200
          description: Required when the patient is under 18
        language:
          $ref: '#/components/schemas/Language'
        confirm_new:
          type: boolean
          default: false
          description: Register another person on a phone number the clinic already has
    PatientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent are changed. The code is not editable.
      properties:
        full_name:
          type: [string, 'null']
          maxLength: 200
        phone:
          type: [string, 'null']
          maxLength: 20
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        date_of_birth:
          type: [string, 'null']
          format: date
        age_years:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
        guardian_name:
          type: [string, 'null']
          maxLength: 200
          description: Blank clears it (refused for a minor)
        language:
          oneOf:
            - $ref: '#/components/schemas/Language'
            - type: 'null'
    PatientConsent:
      type: object
      additionalProperties: false
      required: [whatsapp, sms]
      description: The answer to "may we message you on WhatsApp, on SMS?" (the guardian's for a minor)
      properties:
        whatsapp:
          type: boolean
        sms:
          type: boolean
    PatientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Patient'
    BookingToMove:
      type: object
      additionalProperties: false
      required: [id, status, doctor_id, session_id, on_date, starts_at, slot_start, token_number,
                 reason, patient]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [BOOKED, ARRIVED]}
        doctor_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        on_date: {type: string, format: date}
        starts_at:
          type: string
          format: date-time
          description: The slot's start, or the session's in token mode
        slot_start: {type: [string, 'null'], format: date-time}
        token_number: {type: [integer, 'null']}
        reason: {type: string, enum: [LEAVE, SCHEDULE_CHANGED]}
        patient:
          type: object
          additionalProperties: false
          required: [id, code, first_name, phone_masked]
          properties:
            id: {type: string, format: uuid}
            code: {type: string}
            first_name: {type: string}
            phone_masked: {type: string, description: e.g. +91******0101}
    BookingToMoveList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingToMove'
    AuditCategory:
      type: string
      enum: [SIGN_IN, TEAM, PATIENTS, APPOINTMENTS, CLINICAL, PRESCRIPTIONS, MESSAGES, SCHEDULE,
             SETTINGS]
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, action, action_label, category, actor, entity_type, entity_id,
                 patient_code, metadata]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        action: {type: string, description: The stable action name, e.g. appointment.cancelled}
        action_label: {type: string, description: What happened, in words}
        category:
          $ref: '#/components/schemas/AuditCategory'
        actor:
          type: object
          additionalProperties: false
          required: [type, user_id, label, role]
          properties:
            type: {type: string, enum: [STAFF, OPS, PATIENT_LINK, SYSTEM, PATIENT]}
            user_id: {type: [string, 'null'], format: uuid}
            label:
              type: string
              description: The member's current name, or MediEase support, System, a patient
            role: {type: [string, 'null'], enum: [OWNER, DOCTOR, FRONT_DESK, null]}
        entity_type: {type: [string, 'null']}
        entity_id: {type: [string, 'null'], format: uuid}
        patient_code: {type: [string, 'null'], description: Set when the record is a patient}
        metadata:
          type: object
          description: IDs, codes and enums only (never names, phones or clinical text)
          additionalProperties: {type: string}
    AuditPage:
      type: object
      additionalProperties: false
      required: [from, to, timezone, items, next_cursor, categories]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        timezone: {type: string}
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor: {type: [string, 'null']}
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [value, label]
            properties:
              value:
                $ref: '#/components/schemas/AuditCategory'
              label: {type: string}
    NotificationKind:
      type: string
      enum: [appointment.booked, appointment.rescheduled, appointment.cancelled,
             appointment.arrived, message.failed, staff.joined, schedule.bookings_to_move,
             booking.requested]
    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, title, link, entity_type, entity_id, created_at, read_at]
      properties:
        id: {type: string, format: uuid}
        kind:
          $ref: '#/components/schemas/NotificationKind'
        title:
          description: From a typed, non-clinical catalogue (at most 160 characters)
          type: string
          maxLength: 160
        link:
          description: A path inside the web app (the queue's day, the patient, the Team page)
          type: string
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
    NotificationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Notification'
    NotificationSummary:
      type: object
      additionalProperties: false
      required: [unread, latest_id]
      properties:
        unread: {type: integer, minimum: 0}
        latest_id: {type: [string, 'null'], format: uuid}
    NotificationChannel:
      type: string
      enum: [IN_APP, WHATSAPP, EMAIL, SMS]
    NotificationPreferences:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, label, channel, enabled]
            properties:
              kind:
                $ref: '#/components/schemas/NotificationKind'
              label: {type: string}
              channel:
                $ref: '#/components/schemas/NotificationChannel'
              enabled: {type: boolean}
    NotificationPreferencesUpdate:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 24
          items:
            type: object
            additionalProperties: false
            required: [kind, enabled]
            properties:
              kind:
                $ref: '#/components/schemas/NotificationKind'
              channel:
                $ref: '#/components/schemas/NotificationChannel'
              enabled: {type: boolean}
    MyPatient:
      type: object
      additionalProperties: false
      description: A patient the caller has seen as a doctor (M6a-P6). Who and when, never what.
      required: [id, code, full_name, sex, age_years, age_is_estimated, last_visit_at, visits]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        full_name: {type: string}
        sex:
          $ref: '#/components/schemas/Sex'
        age_years: {type: integer, minimum: 0}
        age_is_estimated: {type: boolean}
        last_visit_at:
          description: When the latest visit with this doctor started
          type: string
          format: date-time
        visits:
          description: Visits with this doctor, any status
          type: integer
          minimum: 1
    MyPatientList:
      type: object
      required: [items, limit, offset]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MyPatient'
        limit: {type: integer}
        offset: {type: integer}
    PatientCandidate:
      type: object
      required: [id, code, full_name, age_years]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        full_name:
          type: string
        age_years:
          type: integer
    PhoneExistsEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              const: PAT_PHONE_EXISTS
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              required: [candidates]
              properties:
                candidates:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/PatientCandidate'
    DoctorList:
      type: object
      required: [items]
      description: Unpaginated by design; a clinic has one to four doctors
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'
    Doctor:
      type: object
      required:
        - id
        - user_id
        - display_name
        - qualification
        - registration_number
        - registration_council
        - specialty
        - is_active
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: [string, 'null']
          description: The staff account that signs in as this doctor, if any
        display_name:
          type: string
        qualification:
          type: string
        registration_number:
          type: string
          description: Printed on every prescription (FR-RX-04)
        registration_council:
          type: string
        specialty:
          type: [string, 'null']
        is_active:
          type: boolean
        verified_at:
          type: [string, 'null']
          format: date-time
          description: M6c-P3 when MediEase verified the registration; cleared when it changes
        verification_source:
          type: [string, 'null']
          enum: [APPLICATION, OPS_CHECK, null]
        visible:
          type: boolean
          description: M6c-P4 shown on the public page and in the directory
        languages:
          type: array
          items: {type: string}
          description: M6c-P5 languages spoken (from a fixed list)
        fee_paise:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000000
          description: M6c-P5 consultation fee in paise, if published
    StaffList:
      type: object
      required: [items]
      description: Unpaginated by design; a clinic has a handful of staff
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffMember'
    StaffMember:
      type: object
      required: [membership_id, user_id, full_name, role, status, email, phone_e164,
                 invite_expires_at, has_doctor_profile]
      properties:
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        email:
          description: The member's sign-in email, if they have one (M6a-P5)
          type: [string, 'null']
        phone_e164:
          description: The member's sign-in phone, if they have one (M6a-P5)
          type: [string, 'null']
        invite_expires_at:
          description: |
            INVITED only: when the current invitation link stops working. Null while an emailed
            invitation is still being sent, and for every other status.
          type: [string, 'null']
          format: date-time
        has_doctor_profile:
          description: An active doctor profile at this clinic is linked to the member
          type: boolean
    StaffMembershipUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Send a role, a status, or both. status accepts DEACTIVATED only (M1).
      properties:
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          const: DEACTIVATED
    StaffInvitation:
      allOf:
        - $ref: '#/components/schemas/StaffMember'
        - type: object
          required: [accept_url]
          properties:
            accept_url:
              type: string
              format: uri
              description: |
                Where the invitee sets their password. Contains the single-use secret, which
                is never stored in clear and never shown again.
    TeamInvitation:
      allOf:
        - $ref: '#/components/schemas/StaffMember'
        - type: object
          required: [delivery, email_masked, accept_url]
          properties:
            delivery:
              type: string
              enum: [email, link]
              description: |
                email: the worker sends it (the secret is made at send time, ADR-0016). link: a
                phone-only member; accept_url is the only copy of the secret.
            email_masked:
              description: Where an emailed invitation goes (a***@example.com); null for a link
              type: [string, 'null']
            accept_url:
              description: The link for a phone-only invitation, shown once; null when emailed
              type: [string, 'null']
              format: uri
    NewStaffInvite:
      type: object
      additionalProperties: false
      required: [full_name, role]
      description: An email address or a phone number is required (it is how they sign in).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: [string, 'null']
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 20
          description: Indian 10-digit input accepted; normalised to E.164
        doctor_id:
          description: |
            M6a-P6 (FR-ORG-03, FR-ONB-08). Role OWNER only: the owner also practises here as this
            active, unlinked doctor profile ("Doctor 1"). It is linked to the invitee in the same
            request and grants CLINICAL_WRITE once the invitation is accepted. Unknown, inactive,
            linked to someone else, or sent with another role: 422 on doctor_id.
          type: [string, 'null']
          format: uuid
    Invite:
      type: object
      required: [clinic_name, full_name, role, expires_at, has_password]
      properties:
        clinic_name:
          type: string
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expires_at:
          type: [string, 'null']
          format: date-time
        has_password:
          type: boolean
          description: True when the person already has an account; the page can offer sign-in
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: |
            For a new account (the invite's has_password is false): the password to set, at least
            12 characters (the domain's policy). For an existing account (has_password is true):
            its current password, which is checked and never changed.
    NewClinic:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 3
          maxLength: 63
          description: Lower-case words joined by single hyphens; unique platform-wide
        timezone:
          type: [string, 'null']
          description: IANA name; defaults to Asia/Kolkata
        phone:
          type: [string, 'null']
          maxLength: 20
        address_line:
          type: [string, 'null']
          maxLength: 300
        city:
          type: [string, 'null']
          maxLength: 100
        state:
          type: [string, 'null']
          maxLength: 100
        pincode:
          type: [string, 'null']
          maxLength: 6
        specialties:
          type: array
          maxItems: 20
          items:
            type: string
        patient_code_prefix:
          type: [string, 'null']
          maxLength: 4
          description: 2-4 upper-case letters for patient codes (ME-0142); derived from the name when omitted. Fixed once the clinic has patients.
        booking_mode:
          allOf:
            - $ref: '#/components/schemas/BookingMode'
          description: Defaults to TOKENS
        rx_paper_size:
          allOf:
            - $ref: '#/components/schemas/PaperSize'
          description: Defaults to A5
    ClinicUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent are changed. The slug and status are not editable here.
      properties:
        name:
          type: [string, 'null']
          maxLength: 200
        timezone:
          type: [string, 'null']
        phone:
          type: [string, 'null']
          maxLength: 20
        address_line:
          type: [string, 'null']
          maxLength: 300
        city:
          type: [string, 'null']
          maxLength: 100
        state:
          type: [string, 'null']
          maxLength: 100
        pincode:
          type: [string, 'null']
          maxLength: 6
        specialties:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
        booking_mode:
          description: |
            Refused with 409 SCH_MODE_INCOMPATIBLE while a current block or upcoming extra lacks
            what the new mode needs (spec R19); unbooked future sessions follow the new mode.
          oneOf:
            - $ref: '#/components/schemas/BookingMode'
            - type: 'null'
        rx_paper_size:
          description: Applies to versions first rendered after the change (M4-P4).
          oneOf:
            - $ref: '#/components/schemas/PaperSize'
            - type: 'null'
        reminder_evening_before:
          description: M6a-P8. Applies to bookings made or moved after the change.
          type: [boolean, 'null']
        reminder_hours_before:
          description: M6a-P8. 0 (off) to 6; applies to bookings made or moved after the change.
          type: [integer, 'null']
        request_hold_minutes:
          description: M6b-P4. 30 to 480; applies to requests made after the change.
          type: [integer, 'null']
        request_requires_age_sex:
          description: M6b-P4. Whether the public request form must ask age and sex.
          type: [boolean, 'null']
          minimum: 0
          maximum: 6
    NewDoctor:
      type: object
      additionalProperties: false
      required: [display_name, qualification, registration_number, registration_council]
      description: I3 — every prescription prints the qualification and registration details.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        qualification:
          type: string
          minLength: 1
          maxLength: 200
        registration_number:
          type: string
          minLength: 1
          maxLength: 50
        registration_council:
          type: string
          minLength: 1
          maxLength: 200
        specialty:
          type: [string, 'null']
          maxLength: 100
        user_id:
          type: [string, 'null']
          format: uuid
          description: An active member of this clinic who has no doctor profile yet
    DoctorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent are changed; the required ones cannot be emptied (I3).
      properties:
        display_name:
          type: [string, 'null']
          maxLength: 200
        qualification:
          type: [string, 'null']
          maxLength: 200
        registration_number:
          type: [string, 'null']
          maxLength: 50
        registration_council:
          type: [string, 'null']
          maxLength: 200
        specialty:
          type: [string, 'null']
          maxLength: 100
        user_id:
          type: [string, 'null']
          format: uuid
        is_active:
          type: [boolean, 'null']
          description: false deactivates the doctor; history keeps referring to them
    OnboardingChecklist:
      type: object
      description: When each onboarding step first happened (FR-OPS-04, R12)
      required:
        - started_at
        - clinic_created_at
        - doctors_added_at
        - staff_invited_at
        - patients_imported_at
        - first_appointment_at
        - first_prescription_at
      properties:
        started_at:
          type: string
          format: date-time
        clinic_created_at:
          type: [string, 'null']
          format: date-time
        doctors_added_at:
          type: [string, 'null']
          format: date-time
        staff_invited_at:
          type: [string, 'null']
          format: date-time
        patients_imported_at:
          type: [string, 'null']
          format: date-time
          description: Written from M2
        first_appointment_at:
          type: [string, 'null']
          format: date-time
          description: Written from M3
        first_prescription_at:
          type: [string, 'null']
          format: date-time
          description: Written from M4
    OpsClinicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Clinic'
              - type: object
                required: [onboarding]
                properties:
                  onboarding:
                    oneOf:
                      - $ref: '#/components/schemas/OnboardingChecklist'
                      - type: 'null'
    OpsMessagingCosts:
      type: object
      description: M5-P5 (R18). Money in paise, excluding GST.
      required: [month, clinics, cost_paise]
      additionalProperties: false
      properties:
        month:
          type: string
          example: '2026-10'
        clinics:
          type: array
          items:
            $ref: '#/components/schemas/OpsClinicMessagingCost'
        cost_paise:
          type: integer
          minimum: 0
          description: Every clinic's cost in the month
    OpsClinicMessagingCost:
      type: object
      required: [clinic_id, clinic_name, messages, unpriced, cost_paise, channels]
      additionalProperties: false
      properties:
        clinic_id:
          type: string
          format: uuid
        clinic_name:
          type: string
        messages:
          type: integer
          minimum: 0
        unpriced:
          type: integer
          minimum: 0
          description: Messages whose cost is not known yet (not counted in cost_paise)
        cost_paise:
          type: integer
          minimum: 0
        channels:
          type: array
          items:
            $ref: '#/components/schemas/OpsChannelCost'
    OpsChannelCost:
      type: object
      required: [channel, messages, priced, unpriced, cost_paise]
      additionalProperties: false
      properties:
        channel:
          type: string
          enum: [WHATSAPP, SMS, CONSOLE]
        messages:
          type: integer
          minimum: 0
        priced:
          type: integer
          minimum: 0
        unpriced:
          type: integer
          minimum: 0
        cost_paise:
          type: integer
          minimum: 0
    OpsClinicDetail:
      allOf:
        - $ref: '#/components/schemas/Clinic'
        - type: object
          required: [onboarding, doctor_count, staff]
          properties:
            onboarding:
              oneOf:
                - $ref: '#/components/schemas/OnboardingChecklist'
                - type: 'null'
            doctor_count:
              type: integer
            staff:
              type: array
              items:
                $ref: '#/components/schemas/StaffMember'
    PatientImportReport:
      type: object
      additionalProperties: false
      required:
        - dry_run
        - rows
        - valid
        - invalid
        - possible_duplicates
        - already_registered
        - imported
        - codes
        - errors
        - duplicates
        - errors_truncated
        - duplicates_truncated
      properties:
        dry_run:
          type: boolean
        rows:
          type: integer
          description: Non-blank data rows in the file
        valid:
          type: integer
        invalid:
          type: integer
        possible_duplicates:
          type: integer
          description: Importable rows whose phone is already in the clinic or on an earlier row
        already_registered:
          type: integer
          description: Rows skipped because phone and name match an existing patient or an earlier row
        imported:
          type: integer
          description: Patients created (always 0 on a dry run)
        codes:
          type: array
          description: The codes of the patients this import created, in file order
          items:
            type: string
        errors:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/PatientImportRowError'
        duplicates:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/PatientImportDuplicate'
        errors_truncated:
          type: boolean
          description: More errors than listed; the count is in invalid
        duplicates_truncated:
          type: boolean
    PatientImportRowError:
      type: object
      additionalProperties: false
      required: [row, field, reason]
      properties:
        row:
          type: integer
          description: Spreadsheet row number; the header is row 1
        field:
          type: string
          description: The column at fault, or "row" for a row with cells beyond the header
          enum: [name, phone, sex, dob_or_age, guardian_name, language, row]
        reason:
          type: string
          description: A fixed sentence; never the cell's value
    PatientImportDuplicate:
      type: object
      additionalProperties: false
      required: [row, kind]
      properties:
        row:
          type: integer
        kind:
          type: string
          enum: [existing_patient, earlier_row, already_registered]
        matches:
          type: integer
          description: How many of the clinic's patients share the phone (never who)
        same_as_row:
          type: integer
          description: The first row in the file with the same phone (or phone and name)
    BookingMode:
      type: string
      enum: [SLOTS, TOKENS]
      description: Fixed time slots, or numbered tokens per session (FR-APT-02)
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9](:00)?$'
      description: Clinic wall-clock time, HH:MM
    ScheduleBlockInput:
      type: object
      additionalProperties: false
      required: [weekday, start_time, end_time]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Monday ... 6 = Sunday
        start_time:
          $ref: '#/components/schemas/LocalTime'
        end_time:
          allOf:
            - $ref: '#/components/schemas/LocalTime'
          description: At or before start_time means the next day; a block lasts at most 12 hours
        slot_minutes:
          type: [integer, 'null']
          minimum: 5
          maximum: 120
          description: Needed in slot mode; must divide the block
        capacity:
          type: [integer, 'null']
          minimum: 1
          maximum: 500
          description: Needed in token mode
    ScheduleReplace:
      type: object
      additionalProperties: false
      required: [blocks]
      properties:
        blocks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ScheduleBlockInput'
    ScheduleBlock:
      type: object
      required: [id, weekday, start_time, end_time, overnight, slot_minutes, capacity]
      properties:
        id:
          type: string
          format: uuid
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        start_time:
          type: string
        end_time:
          type: string
        overnight:
          type: boolean
          description: True when the block ends the next day
        slot_minutes:
          type: [integer, 'null']
        capacity:
          type: [integer, 'null']
    ScheduleExceptionKind:
      type: string
      enum: [LEAVE, EXTRA]
    ScheduleException:
      type: object
      required:
        - id
        - doctor_id
        - on_date
        - kind
        - note
        - start_time
        - end_time
        - overnight
        - slot_minutes
        - capacity
      properties:
        id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
        on_date:
          type: string
          format: date
        kind:
          $ref: '#/components/schemas/ScheduleExceptionKind'
        note:
          type: [string, 'null']
        start_time:
          type: [string, 'null']
        end_time:
          type: [string, 'null']
        overnight:
          type: boolean
        slot_minutes:
          type: [integer, 'null']
        capacity:
          type: [integer, 'null']
    NewScheduleException:
      type: object
      additionalProperties: false
      required: [kind, on_date]
      description: LEAVE takes no times; EXTRA needs start_time and end_time.
      properties:
        kind:
          $ref: '#/components/schemas/ScheduleExceptionKind'
        on_date:
          type: string
          format: date
        start_time:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        end_time:
          oneOf:
            - $ref: '#/components/schemas/LocalTime'
            - type: 'null'
        slot_minutes:
          type: [integer, 'null']
          minimum: 5
          maximum: 120
        capacity:
          type: [integer, 'null']
          minimum: 1
          maximum: 500
        note:
          type: [string, 'null']
          maxLength: 200
    Schedule:
      type: object
      required: [doctor_id, booking_mode, blocks, exceptions]
      properties:
        doctor_id:
          type: string
          format: uuid
        booking_mode:
          $ref: '#/components/schemas/BookingMode'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleBlock'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleException'
    ScheduleChange:
      allOf:
        - $ref: '#/components/schemas/Schedule'
        - type: object
          required: [kept_sessions]
          properties:
            kept_sessions:
              type: array
              description: Booked sessions the change did not touch, for the owner to reschedule
              items:
                $ref: '#/components/schemas/DoctorSession'
    ScheduleExceptionChange:
      type: object
      required: [exception, kept_sessions]
      properties:
        exception:
          $ref: '#/components/schemas/ScheduleException'
        kept_sessions:
          type: array
          items:
            $ref: '#/components/schemas/DoctorSession'
    SessionSlot:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        available:
          type: boolean
          description: |
            In the session list only (M3-P2): false while an active appointment holds the slot.
    DoctorSession:
      type: object
      description: One doctor's bookable block on one clinic-local date (not the sign-in session)
      required:
        - id
        - doctor_id
        - on_date
        - starts_at
        - ends_at
        - mode
        - status
        - slot_minutes
        - capacity
        - booked_count
        - available
        - next_token
        - slots
        - held
      properties:
        held:
          type: array
          description: Online requests holding a slot or place now (M6b-P4, ADR-0018)
          items:
            $ref: '#/components/schemas/HeldPlace'
        id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
        on_date:
          type: string
          format: date
          description: The clinic-local date the session starts on
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/BookingMode'
        status:
          type: string
          enum: [OPEN, CLOSED, CANCELLED]
        slot_minutes:
          type: [integer, 'null']
        capacity:
          type: integer
        booked_count:
          type: integer
        available:
          type: integer
        next_token:
          type: [integer, 'null']
          description: Token mode only
        slots:
          type: array
          description: Slot mode only; empty in token mode
          items:
            $ref: '#/components/schemas/SessionSlot'
    DoctorSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DoctorSession'
    AppointmentStatus:
      type: string
      enum: [BOOKED, ARRIVED, IN_CONSULTATION, COMPLETED, NO_SHOW, CANCELLED]
    AppointmentSource:
      type: string
      enum: [FRONT_DESK, PHONE, WHATSAPP, PUBLIC_PAGE, WALK_IN]
    CancelReason:
      type: string
      enum: [PATIENT_REQUEST, CLINIC_REQUEST, DOCTOR_UNAVAILABLE, DUPLICATE, OTHER, RESCHEDULED]
    NewAppointment:
      type: object
      additionalProperties: false
      required: [session_id, patient_id]
      properties:
        session_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        slot_start:
          type: string
          format: date-time
          description: Slot mode only
        source:
          type: string
          enum: [FRONT_DESK, PHONE, WHATSAPP]
          default: FRONT_DESK
        reason:
          type: [string, 'null']
          maxLength: 120
          description: Short and non-clinical ("follow-up")
        override_hold:
          type: boolean
          description: |
            M6b-P4 (R18a): book over a patient's online request. Without it a held time is 409
            APT_SLOT_HELD. Ends the hold, keeps the request pending and records
            appointment.hold_overridden.
    AppointmentCancel:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [PATIENT_REQUEST, CLINIC_REQUEST, DOCTOR_UNAVAILABLE, DUPLICATE, OTHER]
        note:
          type: [string, 'null']
          maxLength: 200
          description: Required for OTHER
    AppointmentReschedule:
      type: object
      additionalProperties: false
      required: [session_id]
      properties:
        override_hold:
          type: boolean
          description: Move onto a held time anyway (M6b-P4, R18a); see NewAppointment
        session_id:
          type: string
          format: uuid
        slot_start:
          type: string
          format: date-time
          description: Slot mode only
    Appointment:
      type: object
      required:
        - id
        - session_id
        - doctor_id
        - patient_id
        - on_date
        - session_starts_at
        - session_ends_at
        - mode
        - slot_start
        - token_number
        - status
        - source
        - reason
        - cancel_reason
        - cancel_note
        - cancelled_at
        - rescheduled_from_id
        - arrived_at
        - started_at
        - completed_at
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        doctor_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        on_date:
          type: string
          format: date
        session_starts_at:
          type: string
          format: date-time
        session_ends_at:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/BookingMode'
        slot_start:
          type: [string, 'null']
          format: date-time
        token_number:
          type: [integer, 'null']
        status:
          $ref: '#/components/schemas/AppointmentStatus'
        source:
          $ref: '#/components/schemas/AppointmentSource'
        reason:
          type: [string, 'null']
        cancel_reason:
          oneOf:
            - $ref: '#/components/schemas/CancelReason'
            - type: 'null'
        cancel_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        rescheduled_from_id:
          type: [string, 'null']
          format: uuid
        arrived_at:
          type: [string, 'null']
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        created_by:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppointmentStatusChange:
      type: object
      required: [from_status, to_status, changed_by, changed_at]
      properties:
        from_status:
          oneOf:
            - $ref: '#/components/schemas/AppointmentStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/AppointmentStatus'
        changed_by:
          type: [string, 'null']
          format: uuid
        changed_at:
          type: string
          format: date-time
    AppointmentDetail:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          required: [history]
          properties:
            history:
              type: array
              description: Oldest first
              items:
                $ref: '#/components/schemas/AppointmentStatusChange'
    AppointmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
    AppointmentTransition:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          $ref: '#/components/schemas/AppointmentStatus'
        to:
          $ref: '#/components/schemas/AppointmentStatus'
    NewWalkIn:
      type: object
      additionalProperties: false
      required: [doctor_id, patient_id]
      properties:
        doctor_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        session_id:
          type: [string, 'null']
          format: uuid
        slot_start:
          type: [string, 'null']
          format: date-time
        reason:
          type: [string, 'null']
          maxLength: 120
    QueuePatient:
      type: object
      required: [id, code, full_name, age_years, sex]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        full_name:
          type: string
        age_years:
          type: integer
        sex:
          type: string
    QueueEntry:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          required: [patient, wait_minutes, visit_id, prescription]
          properties:
            patient:
              $ref: '#/components/schemas/QueuePatient'
            wait_minutes:
              type: [integer, 'null']
              description: Since arrival while ARRIVED; arrival to start once started
            visit_id:
              type: [string, 'null']
              format: uuid
              description: The appointment's visit, once the doctor started it (M4-P6)
            prescription:
              description: |
                The visit's current issued prescription, IDs and time only (M4-P6 decision 4A),
                so front desk can print from the row; null while there is none.
              oneOf:
                - $ref: '#/components/schemas/IssuedPrescriptionRef'
                - type: 'null'
    IssuedPrescriptionRef:
      type: object
      additionalProperties: false
      required: [id, version, issued_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        issued_at:
          type: string
          format: date-time
    QueueSession:
      allOf:
        - $ref: '#/components/schemas/DoctorSession'
        - type: object
          required: [appointments]
          properties:
            appointments:
              type: array
              items:
                $ref: '#/components/schemas/QueueEntry'
    Queue:
      type: object
      required: [on_date, sessions]
      properties:
        on_date:
          type: string
          format: date
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/QueueSession'
    DashboardCounts:
      type: object
      description: Active appointments by status; cancelled ones are not counted
      required: [total, not_arrived, waiting, in_consultation, completed, no_show]
      properties:
        total: {type: integer, minimum: 0}
        not_arrived:
          type: integer
          minimum: 0
          description: Booked and not yet arrived
        waiting:
          type: integer
          minimum: 0
          description: Arrived and waiting to be seen
        in_consultation: {type: integer, minimum: 0}
        completed: {type: integer, minimum: 0}
        no_show: {type: integer, minimum: 0}
    DashboardSession:
      type: object
      required: [id, doctor_id, doctor_name, starts_at, ends_at, status, mode, capacity, counts]
      properties:
        id: {type: string, format: uuid}
        doctor_id: {type: string, format: uuid}
        doctor_name: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        status:
          type: string
          enum: [OPEN, CLOSED, CANCELLED]
        mode:
          $ref: '#/components/schemas/BookingMode'
        capacity: {type: integer, minimum: 0}
        counts:
          $ref: '#/components/schemas/DashboardCounts'
    DashboardNextPatient:
      type: object
      description: |
        Someone still to be seen: those waiting first, then those not yet arrived, by slot or
        session start and token. The patient's code and first name only.
      required:
        - appointment_id
        - session_id
        - doctor_id
        - status
        - token_number
        - slot_start
        - patient_code
        - patient_first_name
      properties:
        appointment_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        doctor_id: {type: string, format: uuid}
        status:
          type: string
          enum: [BOOKED, ARRIVED]
        token_number: {type: ['integer', 'null'], minimum: 1}
        slot_start: {type: ['string', 'null'], format: date-time}
        patient_code: {type: string, examples: [ME-0142]}
        patient_first_name: {type: string}
    DashboardDay:
      type: object
      required: [on_date, appointments, completed, no_show, messages_sent]
      properties:
        on_date: {type: string, format: date}
        appointments:
          type: integer
          minimum: 0
          description: Active appointments in that date's sessions
        completed: {type: integer, minimum: 0}
        no_show: {type: integer, minimum: 0}
        messages_sent:
          type: ['integer', 'null']
          minimum: 0
          description: Messages the provider accepted that day; null in scope DOCTOR
    DashboardToday:
      type: object
      required:
        - on_date
        - scope
        - doctor_id
        - counts
        - sessions
        - next_patients
        - follow_ups_pending
        - bookings_to_move
        - messages_failed
        - week
        - booking_requests_open
        - requests_answered_30d
        - requests_expired_30d
      properties:
        on_date: {type: string, format: date}
        scope:
          type: string
          enum: [CLINIC, DOCTOR]
        doctor_id:
          type: ['string', 'null']
          format: uuid
          description: The caller's doctor profile in scope DOCTOR; null in scope CLINIC
        counts:
          $ref: '#/components/schemas/DashboardCounts'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSession'
        next_patients:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/DashboardNextPatient'
        follow_ups_pending: {type: integer, minimum: 0}
        bookings_to_move:
          type: ['integer', 'null']
          minimum: 0
          description: M6a-P8 live bookings in closed sessions from today on; null in scope DOCTOR
        messages_failed:
          type: ['integer', 'null']
          minimum: 0
          description: Messages that failed today; null in scope DOCTOR
        booking_requests_open:
          type: ['integer', 'null']
          minimum: 0
          description: M6b-P5 (R45) open online booking requests; null in scope DOCTOR
        requests_answered_30d:
          type: ['integer', 'null']
          minimum: 0
          description: R46 requests answered by staff in 30 days; scope CLINIC with USAGE_METRICS_VIEW
        requests_expired_30d:
          type: ['integer', 'null']
          minimum: 0
          description: R46 requests that expired unanswered in 30 days; as requests_answered_30d
        week:
          type: ['array', 'null']
          description: The last 7 days ending today; null without USAGE_METRICS_VIEW
          items:
            $ref: '#/components/schemas/DashboardDay'
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable error code from docs/ERRORS.md
          examples: [READY_DB_UNAVAILABLE]
        message:
          type: string
          description: Human-readable, safe to show to clinic staff
        request_id:
          type: string
        details:
          type: object
          description: Structured, non-clinical context for the error
          additionalProperties: true
