openapi: 3.1.0
info:
  title: MediEase API
  version: 0.41.0
  description: |
    Source of truth for the MediEase HTTP contract (ADR-0008).
    Endpoints are added here in the same change that implements them.
    Planned surface: docs/API.md. Error codes: docs/ERRORS.md.
servers:
  - url: http://localhost:8000
    description: Local API (direct)
  - url: http://localhost:3000
    description: Local web origin (browser path, proxied to the API)
tags:
  - name: patient-links
    description: |
      Public patient prescription links (M4-P5, FR-RX-07, FR-RX-08). No session: the
      token and the last 4 digits of the patient's phone are the authority.
  - name: platform
    description: Liveness and readiness (M0)
  - name: auth
    description: |
      Sign-in, refresh rotation and sign-out (M1-P2, ADR-0006). Tokens travel only in
      HttpOnly cookies (me_access, me_refresh) and never in a body. Unsafe requests that
      carry a session cookie must send X-CSRF-Token equal to the me_csrf cookie.
  - name: identity
    description: |
      Who the caller is and what they may do (M1-P3, FR-AUTH-03). Every request is
      re-checked: the session must still be live and the user still active, so signing out
      or deactivating a member takes effect on their next request.
  - name: clinic
    description: |
      Clinic settings, doctors and staff (M1-P3 reads, M1-P4 the role change, M1-P5 the rest).
      The clinic is never a parameter: it is the caller's only membership, or the one named in
      X-Clinic-ID. Another clinic's resource is 404, never 403 (NFR-08).
  - name: ops
    description: |
      The internal ops console (M1-P5, FR-OPS-01/04). Platform staff only: clinic staff are
      refused even as owners (spec R10). Ops users have no membership, so the clinic is named
      in the path. No clinical content is ever returned here. The CSV patient import (M2-P4)
      reports row numbers and counts, never a patient's name or phone.
  - name: patients
    description: |
      Register, look up, read and correct patients (M2-P2, FR-PAT-01..04). Every role in a clinic
      holds PATIENTS_MANAGE; ops users are refused (spec identity-and-tenancy R10). The clinic is the
      request's (X-Clinic-ID when the user has several), and another clinic's patient is 404 (NFR-08).
      Responses carry personal data and are never cached.
  - name: scheduling
    description: Doctor schedules, leave and extra sessions, and the sessions they generate (M3)
  - name: appointments
    description: |
      Book, read, cancel and reschedule (M3-P2, FR-APT-03..05, FR-APT-07). Every clinic role holds
      APPOINTMENTS_MANAGE. A session row lock serialises bookings, and the database refuses a
      double booking whatever the code does (FR-APT-04). `reason` is a short non-clinical note;
      it is never logged, audited or messaged.
  - name: queue
    description: |
      The daily queue (M3-P3, FR-QUE-01/02/04): status transitions, walk-ins and the day's read.
      Every clinic role holds QUEUE_MOVE. A transition names the status the screen showed, so a
      stale tab cannot move a patient who has already moved. Live refresh (ETag, 304) is M3-P4.
  - name: visits
    description: |
      Visits (M4-P1, FR-VIS-01..03, 05): the clinical record of one consultation. Reads need
      CLINICAL_VIEW (doctors, owners), writes CLINICAL_WRITE and being the visit's doctor; front
      desk gets 403 PERM_DENIED. Read-only 24 hours after completion, then addenda. Every read
      that returns clinical content records one audit row for the whole view (spec R16).
      Responses are never cached.
  - name: prescriptions
    description: |
      Prescriptions (M4-P2, FR-RX-01..03, 06, 09): one chain of versions per visit. A draft is
      saved whole with its revision; issuing freezes it with the doctor and clinic as printed, the
      patient's language and the pending-delivery marker. An issued version never changes (409
      RX_NOT_DRAFT, also refused by the database); revise it for a new version. Same permissions,
      audit and caching rules as visits. Nothing validates a medicine or a dose.
  - name: rx-library
    description: |
      A doctor's own favourites and templates and medicine-name suggestions (M4-P3, FR-RX-05,
      FR-RX-10). CLINICAL_WRITE and a doctor profile: another doctor's items are 404. Suggestions
      come from the caller's favourites and this clinic's issued prescriptions only; nothing else
      is ever suggested, and no dose or drug data exists. Use is counted when a prescription built
      from them is issued.
  - name: invites
    description: |
      Accepting a staff invitation (M1-P5). Public, because the invitee has no session yet: the
      authority is the single-use secret in the URL, which is also why these paths need no
      X-CSRF-Token. Accepting sets a password, activates the membership and signs the person in.
  - name: reminders
    description: |
      Follow-up reminders (M5-P4; FR-REM-01, 02, 04, 05, 07). A prescription's follow-up date
      schedules one automatically; staff schedule, move and cancel them; pending follow-ups. Every
      role holds REMINDERS_SCHEDULE.
  - name: notifications
    description: |
      The notification centre (M6a-P7, ADR-0017; FR-NTF-03, 05, 06). Each member's own in-app
      notifications in the request's clinic, and their choices. Titles never carry clinical text.
  - name: audit
    description: |
      The owner's audit log (M6a-P8, FR-AUD-03). AUDIT_VIEW, owners only. The clinic's own
      entries, newest first; the export is CSV and is itself audited. Never cached.
  - name: dashboard
    description: |
      The role dashboards (M6-P1). Today: counts for the first screen of every clinic role,
      shaped by role. Counts, codes, first names, times and statuses only; never clinical text.
  - name: google
    description: |
      Google sign-in for staff and patients (M6a-P3, FR-AUTH-07, ADR-0015), run by the API as
      an OpenID Connect code flow with PKCE. Browser navigations answered with redirects.
  - name: portal
  - name: public
  - name: booking-requests
    description: |
      Patient portal accounts (M6a-P3, FR-PRT-01, ADR-0015). Apart from staff: portal cookies
      me_pt_access (path /api/v1/portal), me_pt_refresh (path /api/v1/portal/auth) and
      me_pt_csrf, audience mediease-portal. Unsafe requests that carry a portal session cookie
      must send X-CSRF-Token equal to me_pt_csrf. No clinic data until a clinic links the
      account (M6b).
paths:
  /api/v1/auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      summary: Sign in with an email or phone number and a password
      description: |
        FR-AUTH-01, FR-AUTH-04. Phone numbers are normalised to E.164 (Indian 10-digit input
        accepted). Five consecutive wrong passwords lock the account for 15 minutes.
        Sets me_access, me_refresh and me_csrf. Exempt from the CSRF header.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '423':
          description: Account locked (AUTH_LOCKED)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the lock ends
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        FR-AUTH-02. Reads me_refresh. Presenting an already-rotated token revokes the whole
        session (AUTH_REFRESH_REUSED). On any 401/403 from the session itself the cookies are
        cleared.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: End the session (revokes its refresh-token family)
      description: Idempotent. Always clears the session cookies.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The signed-in user, their clinics and their permissions
      description: |
        FR-AUTH-03. Needs a session but no clinic: the response lists every active
        membership with the clinic's status, the role and the permissions that role holds
        (PRD §8.1), which is what the web app needs to render a clinic switcher and a
        role's screens. Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The current user and their memberships
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/google/start:
    get:
      tags: [google]
      operationId: startGoogleSignIn
      summary: Start a Google sign-in (a browser navigation, not an API call)
      description: |
        M6a-P3, FR-AUTH-07, ADR-0015 decision 3. Seals state, nonce, the PKCE verifier, the
        intent and next into the me_oidc cookie (10 minutes, HttpOnly, path
        /api/v1/auth/google) and redirects to Google, or with the local-only fake provider
        straight to the callback. A bad intent or too many attempts redirects to the sign-in
        page with a reason instead.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: intent
          in: query
          required: true
          schema: {type: string, enum: [staff, patient]}
        - name: next
          in: query
          required: false
          description: |
            A same-origin path to land on: outside /portal for staff (default /today), inside
            it for patients (default /portal). Anything else is replaced by the default.
          schema: {type: string, maxLength: 512}
        - name: login_hint
          in: query
          required: false
          description: An email to pre-select at Google; the fake provider signs this email in.
          schema: {type: string, maxLength: 254}
      responses:
        '302':
          $ref: '#/components/responses/GoogleRedirect'
  /api/v1/auth/google/callback:
    get:
      tags: [google]
      operationId: completeGoogleSignIn
      summary: Finish a Google sign-in and redirect
      description: |
        ADR-0015 decisions 3, 4. Checks state against me_oidc, exchanges the code, verifies the
        ID token (signature, iss, aud, exp, nonce, email_verified) and redirects to next with
        the staff cookies (an existing active staff user: linked by sub, or on first use by
        Google's verified email; never created; ops users refused) or the portal cookies (a
        patient account, created on first use). Failures redirect to /sign-in or
        /portal/sign-in with reason google_failed, google_cancelled, google_no_account,
        account_disabled or too_many_attempts. me_oidc is always cleared.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: state
          in: query
          required: false
          schema: {type: string, maxLength: 512}
        - name: code
          in: query
          required: false
          schema: {type: string, maxLength: 4096}
        - name: error
          in: query
          required: false
          schema: {type: string, maxLength: 256}
      responses:
        '302':
          $ref: '#/components/responses/GoogleRedirect'
  /api/v1/portal/auth/sign-up:
    post:
      tags: [portal]
      operationId: portalSignUp
      summary: Create a patient account with an email and a password, and sign in
      description: |
        M6a-P3, FR-PRT-01, ADR-0015 decision 5. The staff password policy (12 characters
        minimum). The email is stored unverified until M6a-P4. 409 PRT_EMAIL_TAKEN when a
        password account already uses it (accepted and rate limited, decision 7). Sets
        me_pt_access, me_pt_refresh and me_pt_csrf. Exempt from the CSRF header. Rate limited
        per caller (429 AUTH_RATE_LIMITED with Retry-After).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSignUpRequest'
      responses:
        '201':
          $ref: '#/components/responses/PatientSessionStarted'
        '409':
          $ref: '#/components/responses/PortalError'
        '415':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
        '429':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/auth/sign-in:
    post:
      tags: [portal]
      operationId: portalSignIn
      summary: Sign a patient in with an email and a password
      description: |
        M6a-P3. 401 PRT_INVALID_CREDENTIALS for an unknown email, a Google-only account or a
        wrong password (one message for all). Five wrong passwords lock for 15 minutes (423
        AUTH_LOCKED). Sets the portal cookies. Exempt from the CSRF header. Rate limited.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSignInRequest'
      responses:
        '200':
          $ref: '#/components/responses/PatientSessionStarted'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '415':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
        '423':
          $ref: '#/components/responses/PortalError'
        '429':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/auth/refresh:
    post:
      tags: [portal]
      operationId: portalRefresh
      summary: Rotate the portal refresh token
      description: |
        Reads me_pt_refresh. Reuse of a rotated token revokes the session
        (AUTH_REFRESH_REUSED). On any 401/403 from the session itself the portal cookies are
        cleared. Needs X-CSRF-Token equal to me_pt_csrf.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/PatientSessionStarted'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/auth/sign-out:
    post:
      tags: [portal]
      operationId: portalSignOut
      summary: End the portal session
      description: Idempotent; clears the portal cookies. Needs X-CSRF-Token equal to me_pt_csrf.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/auth/password-reset:
    post:
      tags: [auth]
      operationId: requestStaffPasswordReset
      summary: Email a password-reset link to a staff member
      description: |
        M6a-P4, FR-AUTH-05, ADR-0016 decision 7. Always 202 with the same body, whether or not
        the address belongs to an active staff user with a password (ops users and phone-only
        users get nothing). The worker sends a single-use link that lasts 30 minutes. Exempt
        from the CSRF header. Rate limited per caller (429) and, silently, per account (3 an hour).
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '415':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
        '429':
          $ref: '#/components/responses/PortalError'
  /api/v1/auth/password-reset/complete:
    post:
      tags: [auth]
      operationId: completeStaffPasswordReset
      summary: Choose a new password with the emailed link's token
      description: |
        The password policy applies (12 characters). Clears the lockout, ends every session of
        the account and emails "your password was changed". Does not sign in. 404
        AUTH_TOKEN_INVALID for an unknown, used or superseded link, or one for another address;
        410 AUTH_TOKEN_EXPIRED. Exempt from the CSRF header.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompletion'
      responses:
        '204':
          description: Password changed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/PortalError'
        '410':
          $ref: '#/components/responses/PortalError'
        '415':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
        '429':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/auth/password-reset:
    post:
      tags: [portal]
      operationId: requestPatientPasswordReset
      summary: Email a password-reset link to a patient
      description: |
        As the staff route. A Google-only account gets a "you sign in with Google" email instead
        of a link.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '415':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
        '429':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/auth/password-reset/complete:
    post:
      tags: [portal]
      operationId: completePatientPasswordReset
      summary: Choose a new password with the emailed link's token
      description: As the staff route; it also marks the email verified, which the link just proved.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompletion'
      responses:
        '204':
          description: Password changed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/PortalError'
        '410':
          $ref: '#/components/responses/PortalError'
        '415':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
        '429':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/auth/verify-email:
    post:
      tags: [portal]
      operationId: verifyPatientEmail
      summary: Confirm a patient password account's email with the emailed token
      description: |
        M6a-P4, FR-AUTH-08. The emailed link opens a page that POSTs here, so a scanner that
        pre-fetches the link verifies nothing. 404 AUTH_TOKEN_INVALID, 410 AUTH_TOKEN_EXPIRED.
        Exempt from the CSRF header.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/PortalError'
        '410':
          $ref: '#/components/responses/PortalError'
        '415':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
        '429':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/auth/verify-email/resend:
    post:
      tags: [portal]
      operationId: resendPatientVerification
      summary: Send a new verification link to the signed-in patient
      description: |
        @patient. `accepted` is false when there is nothing to verify (already verified, or a
        Google account). At most 3 an hour per account (429 AUTH_RATE_LIMITED). Needs
        X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '429':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/me:
    get:
      tags: [portal]
      operationId: getPortalMe
      summary: The signed-in patient account
      description: |
        @patient: only a portal session (audience mediease-portal); a staff session is 401.
        The account holds no clinic data; linked records are under /portal/links (M6b-P1).
        Cache-Control: no-store.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The account
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
    patch:
      tags: [portal]
      operationId: updatePortalMe
      summary: Change the account's portal language or slot times
      description: |
        M6b-P2 (spec R21, decision 2A). @patient. The language every portal screen uses, kept
        across devices; the prescription page in the portal opens in it. M6b-P3 (R34): the
        medicine plan's times of day. Logged, not audited. Needs X-CSRF-Token equal to
        me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalAccountUpdate'
      responses:
        '200':
          description: The account
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientMe'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/links:
    get:
      tags: [portal]
      operationId: listPortalLinks
      summary: The clinics whose records this account is linked to
      description: |
        M6b-P1 (FR-PRT-02, spec R10). @patient. The account's active links, oldest first: the
        clinic (name, phone, address, city), the record's first name and code, how it was linked
        and since when. A suspended clinic is left out until it is active again. Not audited.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The linked clinics
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalLinkList'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/links/{link_id}:
    delete:
      tags: [portal]
      operationId: unlinkPortalLink
      summary: End one of this account's links
      description: |
        Spec R8. @patient. The record is unchanged; the clinic's data is hidden from the next
        request on. Another account's link, or one already ended, is 404 REQ_NOT_FOUND. Records
        patient.portal_unlinked (PATIENT). Needs X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PortalLinkPath'
      responses:
        '200':
          description: The link ended
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUnlinked'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalLinkingError'
  /api/v1/portal/links/prescription:
    post:
      tags: [portal]
      operationId: linkPortalByPrescription
      summary: Link the record a prescription link names, after the last-4 check
      description: |
        FR-PRT-06 (c), spec R5, R6. @patient with a verified account (Google, or a verified
        email), else 403 PRT_UNVERIFIED_ACCOUNT before any check. The same check as the
        prescription page: the same counter and five-try lockout (a wrong answer here counts for
        the page too). The link is RX_LINK. 409 PRT_ALREADY_LINKED when the record or this
        account is already linked in that clinic. Records patient.portal_linked (PATIENT); a
        wrong answer patient_link.challenge_failed. Needs X-CSRF-Token.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalPrescriptionLinkRequest'
      responses:
        '201':
          description: Linked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalLinked'
        '401':
          $ref: '#/components/responses/LinkError'
        '403':
          $ref: '#/components/responses/PortalLinkingError'
        '404':
          $ref: '#/components/responses/LinkError'
        '409':
          $ref: '#/components/responses/PortalLinkingError'
        '410':
          $ref: '#/components/responses/LinkError'
        '422':
          $ref: '#/components/responses/PortalError'
        '423':
          $ref: '#/components/responses/LinkError'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
  /api/v1/portal/invites/{token}:
    get:
      tags: [portal]
      operationId: describePortalInvite
      summary: Who a clinic's invite is for, before accepting it
      description: |
        Spec R2. @patient. The clinic's name and the record's first name and code. An unknown,
        used, superseded or expired invite is 404 PRT_INVITE_INVALID, the same answer for each.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/PortalInviteToken'
      responses:
        '200':
          description: The invite
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalInvite'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalLinkingError'
  /api/v1/portal/invites/{token}/accept:
    post:
      tags: [portal]
      operationId: acceptPortalInvite
      summary: Link the invited record to this account
      description: |
        FR-PRT-06 (b), spec R3, R4. @patient; no email verification needed (the clinic handed
        over the invite). One transaction under a lock on the invite: an INVITE link, the invite
        used. A second accept is 404 PRT_INVITE_INVALID; 409 PRT_ALREADY_LINKED leaves the invite
        usable. Records patient.portal_linked (PATIENT). Needs X-CSRF-Token.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PortalInviteToken'
      responses:
        '201':
          description: Linked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalLinked'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalLinkingError'
        '409':
          $ref: '#/components/responses/PortalLinkingError'
  /api/v1/portal/appointments:
    get:
      tags: [portal]
      operationId: listPortalAppointments
      summary: The linked records' appointments, grouped by clinic
      description: |
        FR-PRT-03, spec R11. @patient. Per linked clinic, at most 50: every status, upcoming
        first (soonest first), then past (newest first). The doctor, date, slot time or token and
        status; never the reason or a staff note. Not audited.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The appointments by clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalAppointmentGroupList'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/booking-requests:
    post:
      tags: [portal]
      operationId: createBookingRequest
      summary: Ask a clinic for a time
      description: |
        M6b-P4, spec R9-R15. @patient, a verified account (403 PRT_UNVERIFIED_ACCOUNT). Holds the
        slot (or a place) for the clinic's hold time under the session's row lock (ADR-0018);
        a taken or held time is 409 APT_SLOT_TAKEN, APT_SESSION_FULL or APT_SLOT_HELD. Age and sex
        are optional unless the clinic requires them. Records booking_request.created (PATIENT).
        Needs X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBookingRequest'
      responses:
        '201':
          description: Requested; the clinic will reply
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalBookingRequest'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/BookingRequestError'
        '409':
          $ref: '#/components/responses/BookingRequestError'
        '422':
          $ref: '#/components/responses/BookingRequestError'
        '429':
          $ref: '#/components/responses/BookingRequestError'
    get:
      tags: [portal]
      operationId: listPortalBookingRequests
      summary: The signed-in account's open booking requests
      description: |
        M6b-P4, spec R23. @patient. Shown as "Requested" in My Appointments, also for clinics the
        account is not linked to. Never the reason or phone. Not audited.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The open requests
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalBookingRequestList'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/booking-requests/{request_id}/accept-proposal:
    post:
      tags: [portal]
      operationId: acceptBookingProposal
      summary: Take the time the clinic proposed
      description: |
        M6b-P5, R42. @patient, the account's own PROPOSED request (else 404). Books and
        links as a staff accept, actor PATIENT. 409 BKG_ALREADY_ANSWERED when it is no
        longer a live proposal. Needs X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: request_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Accepted; the appointment now shows under the clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalProposalAnswer'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/BookingRequestError'
        '409':
          $ref: '#/components/responses/BookingRequestError'
  /api/v1/portal/booking-requests/{request_id}/decline-proposal:
    post:
      tags: [portal]
      operationId: declineBookingProposal
      summary: No thanks to the time the clinic proposed
      description: |
        M6b-P5, R43. PROPOSED -> DECLINED (PATIENT_DECLINED), the proposed hold ended at
        once. Needs X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: request_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Declined
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalProposalAnswer'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/BookingRequestError'
        '409':
          $ref: '#/components/responses/BookingRequestError'
  /api/v1/portal/notifications:
    get:
      tags: [portal]
      operationId: listPortalNotifications
      summary: The account's notifications, newest first
      description: |
        M6b-P6, R55, R60, R68. @patient. The newest 50 of the linked clinics (and the account's
        own booking answers), never a suspended clinic's; titles in the account's language,
        with no diagnosis, medicine, reason text, note or phone (R59). Not audited.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The notifications
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalNotificationList'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/notifications/summary:
    get:
      tags: [portal]
      operationId: getPortalNotificationSummary
      summary: The bell's unread count
      description: |
        M6b-P6, R67. @patient. Strong ETag; If-None-Match answers 304 with no body while it
        is unchanged. The portal polls it every 30 seconds while the tab is visible.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: The count
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalNotificationSummary'
        '304':
          description: Unchanged since the ETag sent
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/notifications/{notification_id}/read:
    post:
      tags: [portal]
      operationId: readPortalNotification
      summary: Mark one notification read
      description: |
        M6b-P6, R68. @patient. Another account's (or a hidden) ID is 404 REQ_NOT_FOUND.
        Needs X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: notification_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Read
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          $ref: '#/components/responses/PortalLinkingError'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/notifications/read-all:
    post:
      tags: [portal]
      operationId: readAllPortalNotifications
      summary: Mark every visible notification read
      description: |
        M6b-P6, R68. @patient. Needs X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: How many were marked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalNotificationsMarked'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/notification-preferences:
    get:
      tags: [portal]
      operationId: listPortalNotificationPreferences
      summary: The account's notification switches
      description: |
        M6b-P6, R62, R63. @patient. Every kind with its in-app switch (on by default) and,
        for the four booking answers only, its email switch (null where email is not offered).
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The switches
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalNotificationPreferenceList'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
    put:
      tags: [portal]
      operationId: setPortalNotificationPreference
      summary: Turn one switch on or off
      description: |
        M6b-P6, R62, R63. @patient. EMAIL for a kind other than the booking answers is 422.
        Returns every switch. Logged, not audited. Needs X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalNotificationPreferenceChange'
      responses:
        '200':
          description: The switches
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalNotificationPreferenceList'
        '422':
          $ref: '#/components/responses/PortalLinkingError'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/appointments/{appointment_id}/live-link:
    get:
      tags: [portal]
      operationId: getPortalLiveLink
      summary: The live token link of the account's own appointment
      description: |
        M6b-P6, R69, ADR-0019. @patient. Only for an appointment of a record linked to the
        account (else 404). Valid from the start of the session's day until 2 hours after it
        ends; 422 when the appointment is cancelled or has ended.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: appointment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The link
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveLink'
        '404':
          $ref: '#/components/responses/PortalLinkingError'
        '422':
          $ref: '#/components/responses/PortalLinkingError'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/prescriptions:
    get:
      tags: [portal]
      operationId: listPortalPrescriptions
      summary: The linked records' current prescriptions
      description: |
        Spec R12. @patient. Each chain's latest issued version (never a draft or a superseded
        version), newest issue first: the doctor, the date and the version, no content.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The prescriptions
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalPrescriptionList'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/prescriptions/{rx_id}:
    get:
      tags: [portal]
      operationId: getPortalPrescription
      summary: A current prescription as the patient page shows it
      description: |
        Spec R12. @patient. The prescription link's page (labels in the chosen language, the
        doctor's text as written). A draft, a superseded version or another record's ID is 404
        REQ_NOT_FOUND. Never visit notes, vitals, diagnosis or addenda. Not audited.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/PrescriptionPath'
        - name: lang
          in: query
          required: false
          description: en or hi; the account's language when absent (M6b-P2)
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: The page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPrescriptionPage'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalLinkingError'
        '422':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/prescriptions/{rx_id}/pdf:
    get:
      tags: [portal]
      operationId: getPortalPrescriptionPdf
      summary: A current prescription's PDF
      description: |
        Spec R12. @patient. The same file the clinic prints, rendered once (prescriptions R18).
        Not audited (decision 7A). Out of scope is 404 REQ_NOT_FOUND.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '200':
          description: The PDF
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Disposition:
              description: inline; filename="prescription-<id>-v<version>.pdf"
              schema:
                type: string
          content:
            application/pdf:
              schema:
                description: The PDF bytes (OpenAPI 3.1 binary content)
                contentMediaType: application/pdf
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalLinkingError'
        '500':
          description: RX_PDF_FAILED; nothing was stored, so the next download tries again
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: RX_PDF_BUSY; another download is preparing it
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/portal/reminders:
    get:
      tags: [portal]
      operationId: listPortalReminders
      summary: The linked records' reminders
      description: |
        FR-REM-05, spec R13. @patient. At most 50 per linked clinic, soonest due first: the
        kind, date, due time and visible status (the message's once sent).
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The reminders
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalReminderList'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/medicine-plan:
    get:
      tags: [portal]
      operationId: getMedicinePlan
      summary: One day's medicine plan across the linked records
      description: |
        M6b-P3 (FR-REM-03, spec R28-R37, R42, R44). @patient. Laid out by the one engine from
        each linked record's current versions: timed entries by slot (with the account's time
        for it), then "As the doctor wrote" (SOS, ONCE, CUSTOM, no frequency). Words in the
        account's language; medicine names, doses and the doctor's text as written. Never a
        merged, inferred or changed instruction. Not audited.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: date
          in: query
          required: false
          description: Default today on the clinic's calendar; within 30 days of it (else 422)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The day's plan
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicinePlan'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/medicine-plan/courses:
    get:
      tags: [portal]
      operationId: listMedicineCourses
      summary: Each current prescription's course
      description: |
        M6b-P3 (spec R32, R35, R36, R39). @patient. Newest start first; a course whose lines all
        have a number of days and that ended more than 7 days ago is left out. Each line's slots
        carry the person's reminder choice. Not audited.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The courses
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicineCourseList'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/medicine-plan/reminders:
    put:
      tags: [portal]
      operationId: setMedicineReminder
      summary: Turn a reminder on or off for one medicine at one time of day
      description: |
        M6b-P3 (spec R38-R41). @patient. For a line of a current version in one of the slots its
        frequency marks. 422 for an untimed line (item_id) or a slot the line does not have
        (slot); a version outside the account's records, or no longer current, is 404. Stored
        only (delivery is M6b-P6); never changes the prescription; not audited. Needs
        X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedicineReminderInput'
      responses:
        '200':
          description: The saved choice
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicineReminder'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/medicine-plan/doses:
    put:
      tags: [portal]
      operationId: markDose
      summary: Mark a scheduled dose Taken or Skipped
      description: |
        M6b-P3b (spec R45, R46, R51). @patient. A timed line of a current version, a slot its
        frequency marks, a day of its course (else 422 on item_id, slot or on_date), from 00:00 of
        that day to 48 hours after its time (else 409 PRT_DOSE_NOT_MARKABLE). Marking again
        changes it and the time marked. Private to the account; not audited; logs carry IDs and
        a count only. Needs X-CSRF-Token equal to me_pt_csrf.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoseInput'
      responses:
        '200':
          description: The dose
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicineDose'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalError'
        '409':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
    delete:
      tags: [portal]
      operationId: clearDose
      summary: Clear a dose's mark within its window
      description: |
        M6b-P3b (R46). @patient. The same rules as marking; afterwards the dose is Not recorded
        (its time has passed) or Upcoming. Clearing an unmarked dose changes nothing.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: prescription_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: item_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: on_date
          in: query
          required: true
          schema: {type: string, format: date}
        - name: slot
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Slot'
      responses:
        '200':
          description: The dose
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicineDose'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalError'
        '409':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
  /api/v1/portal/medicine-plan/history:
    get:
      tags: [portal]
      operationId: getDoseHistory
      summary: A version's doses by day
      description: |
        M6b-P3b (R47, R49). @patient. An issued or superseded version of a linked record: each
        day and slot as Taken, Skipped, Not recorded or Upcoming, with counts per state. Not
        audited.
      security:
        - patientSessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: prescription_id
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The history
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoseHistory'
        '401':
          $ref: '#/components/responses/PortalError'
        '403':
          $ref: '#/components/responses/PortalError'
        '404':
          $ref: '#/components/responses/PortalError'
        '422':
          $ref: '#/components/responses/PortalError'
  /api/v1/public/applications:
    post:
      tags: [public]
      operationId: submitClinicApplication
      summary: Apply to join MediEase (a clinic or a doctor with their own practice)
      description: |
        M6c-P1, spec clinic-onboarding R1-R10, R13, R16, R17. No sign-in, not CSRF-checked
        (no session gives it authority). multipart/form-data: a part `application` (JSON,
        ClinicApplicationInput) and one file `certificate_<n>` per doctor position n (from 1),
        a PDF, JPEG or PNG of at most 5 MB recognised by its first bytes; at most 30 MB in all.
        Stores the application PENDING with the email unconfirmed and emails a confirmation
        link; creates no clinic, user or doctor. A registration already applied or registered
        is flagged for the reviewer, never told. Never cached, noindex.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [application, certificate_1]
              properties:
                application:
                  type: string
                  description: ClinicApplicationInput as JSON
                certificate_1: {type: string, format: binary}
                certificate_2: {type: string, format: binary}
                certificate_3: {type: string, format: binary}
                certificate_4: {type: string, format: binary}
                certificate_5: {type: string, format: binary}
                certificate_6: {type: string, format: binary}
                certificate_7: {type: string, format: binary}
                certificate_8: {type: string, format: binary}
                certificate_9: {type: string, format: binary}
                certificate_10: {type: string, format: binary}
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Received; the owner must confirm the email to send it for review
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationReceipt'
        '413':
          $ref: '#/components/responses/ApplicationError'
        '415':
          $ref: '#/components/responses/ApplicationError'
        '422':
          $ref: '#/components/responses/ApplicationError'
        '429':
          $ref: '#/components/responses/ApplicationError'
        '503':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/public/applications/confirm:
    post:
      tags: [public]
      operationId: confirmClinicApplication
      summary: Confirm the application's email with the emailed link's token
      description: |
        M6c-P1, spec R11, R12, R16. The token works once, until 48 hours after the application;
        an unknown, used or expired token is the same 404 ONB_CONFIRM_INVALID. The application
        then waits for a reviewer and a "received" email is sent. 20 attempts a minute per
        caller.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 200}
      responses:
        '200':
          description: Confirmed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [reference]
                properties:
                  reference: {type: string}
        '404':
          $ref: '#/components/responses/ApplicationError'
        '415':
          $ref: '#/components/responses/ApplicationError'
        '422':
          $ref: '#/components/responses/ApplicationError'
        '429':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/public/clinics/{slug}:
    get:
      tags: [public]
      operationId: getPublicClinic
      summary: A clinic's public page
      description: |
        M6b-P4, spec booking-requests R1-R4. No sign-in. Only what a clinic publishes (an
        allow-list: name, address, phone, booking mode, doctors with their weekly hours). An
        unknown slug and a clinic that is not active are the same 404 REQ_NOT_FOUND. Never cached
        and marked noindex until M6c. Rate limited per caller (429 with Retry-After).
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 63
      responses:
        '200':
          description: The public page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClinic'
        '404':
          $ref: '#/components/responses/BookingRequestError'
        '429':
          $ref: '#/components/responses/BookingRequestError'
  /api/v1/public/clinics/{slug}/availability:
    get:
      tags: [public]
      operationId: getPublicAvailability
      summary: One doctor's bookable times over the next 14 days
      description: |
        M6b-P4, spec R5-R8. Computed without writing. A slot or session is offered only if it
        starts at least 2 hours from now, and a slot or place under a live hold (ADR-0018) is not
        offered. Days without a session are omitted.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 63
        - name: doctor_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: The offered days
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAvailability'
        '404':
          $ref: '#/components/responses/BookingRequestError'
        '422':
          $ref: '#/components/responses/BookingRequestError'
        '429':
          $ref: '#/components/responses/BookingRequestError'
  /api/v1/booking-requests:
    get:
      tags: [booking-requests]
      operationId: listBookingRequests
      summary: The clinic's inbox of online booking requests
      description: |
        M6b-P4, P5 (spec R22, R44, R45). Permission: APPOINTMENTS_MANAGE. `state=open` (default):
        pending and proposed requests not past their deadline, oldest first; `state=answered`:
        requests made final in the last 7 days and open ones past their deadline (expired), newest
        first; at most 100. With the open count and the requests expired unanswered in 7 days.
        The reason and the staff note are for this clinic's staff only. Not audited.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, answered]
            default: open
      responses:
        '200':
          description: The open requests
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffBookingRequestList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/booking-requests/{request_id}/candidates:
    get:
      tags: [booking-requests]
      operationId: listRequestCandidates
      summary: The clinic's records that may be this request's patient
      description: |
        M6b-P5, R36, R47. Permission: APPOINTMENTS_MANAGE. The records with the request's
        phone (at most 10) with their no-show count, or only the record the account is
        already linked to. Phone only suggests; staff choose. Not audited.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: request_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The candidates
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCandidateList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/booking-requests/{request_id}/accept:
    post:
      tags: [booking-requests]
      operationId: acceptBookingRequest
      summary: "Accept a pending request: book it and link the account"
      description: |
        M6b-P5, R34-R38. Permission: APPOINTMENTS_MANAGE (and PATIENTS_MANAGE for a new
        record). One transaction under the session and request locks: books the request's
        time (source PUBLIC_PAGE; its own hold excluded, other holds counted), links the
        account (method BOOKING), records booking_request.accepted. 409 when answered
        already or expired (BKG_ALREADY_ANSWERED), when the time has gone (APT_SLOT_TAKEN,
        APT_SESSION_FULL, APT_SLOT_HELD) or the record is linked elsewhere
        (PRT_ALREADY_LINKED). Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: request_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestRecordChoice'
      responses:
        '201':
          description: Accepted and booked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAnswer'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/BookingRequestError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/BookingRequestError'
  /api/v1/booking-requests/{request_id}/decline:
    post:
      tags: [booking-requests]
      operationId: declineBookingRequest
      summary: Decline an open request with a reason the patient sees
      description: |
        M6b-P5, R39. Permission: APPOINTMENTS_MANAGE. Ends the hold at once and records
        booking_request.declined with the reason code (never the note). 409
        BKG_ALREADY_ANSWERED when answered already or expired. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: request_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDecline'
      responses:
        '200':
          description: Declined
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAnswer'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/BookingRequestError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/BookingRequestError'
  /api/v1/booking-requests/{request_id}/propose:
    post:
      tags: [booking-requests]
      operationId: proposeBookingTime
      summary: Offer the patient another time with the same doctor
      description: |
        M6b-P5, R40, R41. Permission: APPOINTMENTS_MANAGE (and PATIENTS_MANAGE for a new
        record). Once, for a pending request: the status becomes PROPOSED and the hold
        moves to the new time in one transaction (the clinic's hold time, never past an
        hour before it). The record is chosen now and linked when the patient accepts.
        Records booking_request.proposed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: request_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestProposal'
      responses:
        '200':
          description: Proposed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestAnswer'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/BookingRequestError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/BookingRequestError'
  /api/v1/appointments/{appointment_id}/live-link:
    get:
      tags: [appointments]
      operationId: getStaffLiveLink
      summary: The patient's live token link, to send by hand
      description: |
        M6b-P6, R69, ADR-0019. Permission: APPOINTMENTS_MANAGE. Another clinic's appointment is
        404; a cancelled or ended one is 422. Not audited.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/AppointmentPath'
      responses:
        '200':
          description: The link
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveLink'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/public/queue/{token}:
    get:
      tags: [public]
      operationId: getLiveQueue
      summary: Where an appointment is in the queue (no sign-in)
      description: |
        M6b-P6, R70, R71, ADR-0019. The clinic, the doctor, the patient's own token or slot, how
        many BOOKED or ARRIVED entries are ahead, what is being seen and a state; never a name,
        phone, reason or age, nor anything about other patients. Strong ETag (304 while
        unchanged), never cached, noindex. 404 LINK_INVALID, 410 LINK_EXPIRED (outside the
        session's day until 2 hours after it), 429 LINK_RATE_LIMITED with Retry-After.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: token
          in: path
          required: true
          schema: {type: string, maxLength: 200}
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: The live view
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveQueue'
        '304':
          description: Unchanged since the ETag sent
        '404':
          $ref: '#/components/responses/LinkError'
        '410':
          $ref: '#/components/responses/LinkError'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
  /api/v1/clinic:
    get:
      tags: [clinic]
      operationId: getClinic
      summary: The clinic this request is for
      description: 'Permission: CLINIC_VIEW (every role).'
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: The clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
