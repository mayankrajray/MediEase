          $ref: '#/components/responses/AuthError'
  /api/v1/ops/clinics/{clinic_id}/patient-imports:
    post:
      tags: [ops]
      operationId: importOpsPatients
      summary: Import a clinic's patient list from CSV (dry run by default)
      description: |
        FR-PAT-08, FR-OPS-02, spec patients R8 (M2-P4). Ops only. The body is the raw CSV file
        (UTF-8, an Excel BOM is fine), at most 2 MB and 5,000 data rows, with exactly the
        columns name, phone, sex, dob_or_age, guardian_name, language in any order and case.
        dry_run defaults to true: the report is computed and nothing is written. With
        dry_run=false the same checks run again under the clinic lock, importable rows are
        created in file order with consecutive codes (consent false, not asked), one
        patient.imported audit row each, and the checklist's patients_imported_at the first time.
        Rows matching an existing patient or an earlier row by phone and name are skipped;
        rows sharing only a phone are imported and flagged. The report holds row numbers
        (the header is row 1), counts, column names and the new codes, never a cell's value.
        Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicPath'
        - $ref: '#/components/parameters/CsrfToken'
        - name: dry_run
          in: query
          required: false
          description: true (the default) reports only; false imports
          schema:
            type: string
            enum: ['true', 'false']
            default: 'true'
      requestBody:
        required: true
        description: The CSV file itself (not a form upload), UTF-8, at most 2 MB (2,097,152 bytes)
        content:
          text/csv: {}
      responses:
        '200':
          description: The import report (dry run or committed)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientImportReport'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '413':
          description: The file is over 2 MB (REQ_REQUEST_ENTITY_TOO_LARGE)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          description: |
            PAT_IMPORT_INVALID (the file as a whole cannot be read: header, encoding, CSV
            syntax, no rows or more than 5,000; details.problems lists why) or
            REQ_VALIDATION_FAILED (dry_run is not true or false). Nothing is imported.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ops/applications:
    get:
      tags: [ops]
      operationId: listOpsApplications
      summary: Confirmed clinic applications, oldest first
      description: |
        M6c-P1, P2, spec clinic-onboarding R18, R25. OPS_REVIEWER only. A summary per
        application: no phone, email, registration number or certificate. `queue` waiting
        (PENDING), review (UNDER_REVIEW) or decided; all when absent. Unconfirmed applications
        are never listed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: queue
          in: query
          required: false
          schema: {type: string, enum: [waiting, review, decided]}
      responses:
        '200':
          description: The applications
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsApplicationSummary'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
  /api/v1/ops/applications/{application_id}:
    get:
      tags: [ops]
      operationId: getOpsApplication
      summary: One clinic application for a reviewer (audited)
      description: |
        M6c-P2, spec clinic-onboarding R26. OPS_REVIEWER only. The whole application, each
        doctor's registration and latest check. Opening it is audited (application.viewed).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationDetail'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/ops/applications/{application_id}/doctors/{doctor_id}/certificate:
    get:
      tags: [ops]
      operationId: getOpsApplicationCertificate
      summary: A doctor's registration certificate (audited)
      description: |
        M6c-P2, spec R26. OPS_REVIEWER only. The stored file with its stored type, inline,
        nosniff and a sandboxing CSP; never a public link. Each download is audited.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ApplicationId'
        - name: doctor_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: The certificate
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/pdf:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/ops/applications/{application_id}/take:
    post:
      tags: [ops]
      operationId: takeOpsApplication
      summary: Start reviewing a confirmed application
      description: |
        M6c-P2, spec R27. PENDING -> UNDER_REVIEW with the reviewer and time; 409
        ONB_ALREADY_TAKEN when another reviewer took it first.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationDetail'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/ApplicationError'
        '409':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/ops/applications/{application_id}/doctors/{doctor_id}/check:
    put:
      tags: [ops]
      operationId: checkOpsApplicationDoctor
      summary: Record a doctor's registration check
      description: |
        M6c-P2, spec R29, R30. Only UNDER_REVIEW (409 ONB_NOT_UNDER_REVIEW); VERIFIED needs both
        the register and the certificate checked (422). A new check replaces the earlier one.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ApplicationId'
        - name: doctor_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [register_checked, certificate_matches, result]
              properties:
                register_checked: {type: boolean}
                certificate_matches: {type: boolean}
                result: {type: string, enum: [VERIFIED, NOT_VERIFIED]}
                note: {type: [string, 'null'], maxLength: 500}
      responses:
        '200':
          $ref: '#/components/responses/ApplicationDetail'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/ApplicationError'
        '409':
          $ref: '#/components/responses/ApplicationError'
        '422':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/ops/applications/{application_id}/reject:
    post:
      tags: [ops]
      operationId: rejectOpsApplication
      summary: Reject an application with a reason the applicant reads
      description: |
        M6c-P2, spec R33, R34. UNDER_REVIEW -> REJECTED; OTHER needs a message (1-500). The
        applicant is emailed the reason's words and the message, and may apply again.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/ApplicationRejectReason'
                message: {type: [string, 'null'], maxLength: 500}
      responses:
        '200':
          $ref: '#/components/responses/ApplicationDetail'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/ApplicationError'
        '409':
          $ref: '#/components/responses/ApplicationError'
        '422':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/ops/applications/{application_id}/approve:
    post:
      tags: [ops]
      operationId: approveOpsApplication
      summary: Approve an application, creating its clinic, doctors and owner invitation
      description: |
        M6c-P3, spec clinic-onboarding R41-R44 (FR-ONB-04, FR-ONB-08). UNDER_REVIEW with every
        doctor's check VERIFIED (else 422). In one transaction: the clinic (ONBOARDING, verified
        with source APPLICATION), every doctor (verified), the owner's invitation sent by email
        (the owner linked to their doctor when they practise) and the application APPROVED. The
        reviewer chooses the slug, booking mode and time zone and may correct the clinic's
        details. A slug already used is 409 and nothing is created. The clinic becomes ACTIVE
        when the owner accepts the invitation.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [slug]
              properties:
                slug: {type: string, minLength: 3, maxLength: 63}
                booking_mode:
                  $ref: '#/components/schemas/BookingMode'
                timezone: {type: string, maxLength: 64, default: Asia/Kolkata}
                clinic_name: {type: [string, 'null'], maxLength: 200}
                address_line: {type: [string, 'null'], maxLength: 300}
                city: {type: [string, 'null'], maxLength: 100}
                state: {type: [string, 'null'], maxLength: 100}
                pincode: {type: [string, 'null'], maxLength: 6}
      responses:
        '201':
          description: Approved; the clinic exists and its owner is invited
          content:
            application/json:
              schema:
                type: object
                required: [application, clinic, invitation_delivery]
                properties:
                  application:
                    $ref: '#/components/schemas/OpsApplicationDetail'
                  clinic:
                    $ref: '#/components/schemas/Clinic'
                  invitation_delivery: {type: string, enum: [email, link]}
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/ApplicationError'
        '409':
          $ref: '#/components/responses/ApplicationError'
        '422':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/ops/clinics/{clinic_id}/doctors/{doctor_id}/verify:
    post:
      tags: [ops]
      operationId: verifyOpsClinicDoctor
      summary: Verify an ops-created clinic's doctor
      description: |
        M6c-P3, spec R45 (FR-ONB-06). OPS_REVIEWER only. Both checks must be true (else 422).
        Records the doctor as verified with source OPS_CHECK; idempotent.
      security:
        - sessionCookie: []
      parameters:
