openapi: 3.1.0
info:
  title: MediEase API
  version: 0.7.0
  description: |
    Source of truth for the MediEase HTTP contract (ADR-0008).
    Endpoints are added here in the same change that implements them.
    Planned surface: docs/API.md. Error codes: docs/ERRORS.md.
servers:
  - url: http://localhost:8000
    description: Local API (direct)
  - url: http://localhost:3000
    description: Local web origin (browser path, proxied to the API)
tags:
  - name: platform
    description: Liveness and readiness (M0)
  - name: auth
    description: |
      Sign-in, refresh rotation and sign-out (M1-P2, ADR-0006). Tokens travel only in
      HttpOnly cookies (me_access, me_refresh) and never in a body. Unsafe requests that
      carry a session cookie must send X-CSRF-Token equal to the me_csrf cookie.
  - name: identity
    description: |
      Who the caller is and what they may do (M1-P3, FR-AUTH-03). Every request is
      re-checked: the session must still be live and the user still active, so signing out
      or deactivating a member takes effect on their next request.
  - name: clinic
    description: |
      Clinic settings, doctors and staff (M1-P3 reads, M1-P4 the role change, M1-P5 the rest).
      The clinic is never a parameter: it is the caller's only membership, or the one named in
      X-Clinic-ID. Another clinic's resource is 404, never 403 (NFR-08).
  - name: ops
    description: |
      The internal ops console (M1-P5, FR-OPS-01/04). Platform staff only: clinic staff are
      refused even as owners (spec R10). Ops users have no membership, so the clinic is named
      in the path. No clinical content is ever returned here.
  - name: patients
    description: |
      Register, look up, read and correct patients (M2-P2, FR-PAT-01..04). Every role in a clinic
      holds PATIENTS_MANAGE; ops users are refused (spec identity-and-tenancy R10). The clinic is the
      request's (X-Clinic-ID when the user has several), and another clinic's patient is 404 (NFR-08).
      Responses carry personal data and are never cached.
  - name: invites
    description: |
      Accepting a staff invitation (M1-P5). Public, because the invitee has no session yet: the
      authority is the single-use secret in the URL, which is also why these paths need no
      X-CSRF-Token. Accepting sets a password, activates the membership and signs the person in.
paths:
  /api/v1/auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      summary: Sign in with an email or phone number and a password
      description: |
        FR-AUTH-01, FR-AUTH-04. Phone numbers are normalised to E.164 (Indian 10-digit input
        accepted). Five consecutive wrong passwords lock the account for 15 minutes.
        Sets me_access, me_refresh and me_csrf. Exempt from the CSRF header.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '423':
          description: Account locked (AUTH_LOCKED)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the lock ends
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        FR-AUTH-02. Reads me_refresh. Presenting an already-rotated token revokes the whole
        session (AUTH_REFRESH_REUSED). On any 401/403 from the session itself the cookies are
        cleared.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: End the session (revokes its refresh-token family)
      description: Idempotent. Always clears the session cookies.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The signed-in user, their clinics and their permissions
      description: |
        FR-AUTH-03. Needs a session but no clinic: the response lists every active
        membership with the clinic's status, the role and the permissions that role holds
        (PRD §8.1), which is what the web app needs to render a clinic switcher and a
        role's screens. Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The current user and their memberships
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic:
    get:
      tags: [clinic]
      operationId: getClinic
      summary: The clinic this request is for
      description: 'Permission: CLINIC_VIEW (every role).'
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: The clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [clinic]
      operationId: updateClinic
      summary: Edit the clinic's details
      description: |
        FR-ORG-01. Permission: CLINIC_MANAGE (owners). Only the fields sent are changed; send
        at least one. The slug is not editable (it appears in public links from M7) and the
        status has its own transitions. Records clinic.updated. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicUpdate'
      responses:
        '200':
          description: The clinic after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/doctors:
    get:
      tags: [clinic]
      operationId: listDoctors
      summary: The clinic's doctors
      description: |
        Permission: DOCTORS_VIEW (every role). Unpaginated: a clinic has one to four
        doctors (PRD §2).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: Doctors of this clinic, oldest first
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
    post:
      tags: [clinic]
      operationId: addDoctor
      summary: Add a doctor to this clinic
      description: |
        FR-ORG-02. Permission: CLINIC_MANAGE (owners). Qualification, registration number and
        council are required because every prescription prints them (I3). An optional user_id
        links a staff account that is an active member and has no doctor profile yet (spec §8
        "owner who is also a doctor"). Records doctor.added and the checklist's first doctor.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDoctor'
      responses:
        '201':
          description: The new doctor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/doctors/{doctor_id}:
    get:
      tags: [clinic]
      operationId: getDoctor
      summary: One doctor of this clinic
      description: |
        Permission: DOCTORS_VIEW. A doctor of another clinic returns 404 REQ_NOT_FOUND,
        so the resource's existence is never confirmed (NFR-08, spec R8).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: doctor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The doctor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [clinic]
      operationId: updateDoctor
      summary: Correct a doctor's details or deactivate them
      description: |
        FR-ORG-02. Permission: CLINIC_MANAGE (owners). Only the fields sent are changed; send
        at least one. The required fields can be corrected but not emptied (I3). Setting
        is_active to false stops offering the doctor for new work; history keeps referring to
        them. Records doctor.updated. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: doctor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorUpdate'
      responses:
        '200':
          description: The doctor after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/staff:
    get:
      tags: [clinic]
      operationId: listStaff
      summary: The clinic's members with their roles
      description: |
        Permission: STAFF_MANAGE (owners only; FR-ORG-03). Includes invited and
        deactivated memberships so an owner can see the whole team. Unpaginated.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: Memberships of this clinic, by member name
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
    post:
      tags: [clinic]
      operationId: inviteStaff
      summary: Invite somebody to join this clinic
      description: |
        FR-ORG-04. Permission: STAFF_MANAGE (owners). An email address or a phone number is
        required, because that is how they will sign in (R1). A person who already has a
        MediEase account keeps it and gains a membership; somebody who already belongs to
        this clinic is refused (409 CLN_MEMBER_EXISTS); a still-pending invitation is
        re-issued, which retires the previous link. The response carries accept_url — the one
        place the invitation secret appears. Records staff.invited. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaffInvite'
      responses:
        '201':
          $ref: '#/components/responses/StaffInvited'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/staff/{membership_id}:
    patch:
      tags: [clinic]
      operationId: changeStaffMembership
      summary: Change a member's role, deactivate them, or both
      description: |
        FR-ORG-04, FR-AUD-01. Permission: STAFF_MANAGE (owners only). Send a role, a status,
        or both; each change is written with its own audit event in one transaction, so it is
        never unrecorded (spec R11). status accepts DEACTIVATED only: the lifecycle is
        INVITED → ACTIVE → DEACTIVATED with no way back in M1, so somebody removed by mistake
        is invited again. The last active owner can be neither demoted nor deactivated
        (409 CLN_LAST_OWNER). The member keeps their session, but their next request is
        refused once deactivated, and a new role applies from their next request. Setting the
        role they already hold changes nothing and records nothing. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMembershipUpdate'
      responses:
        '200':
          description: The member after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients:
    post:
      tags: [patients]
      operationId: registerPatient
      summary: Register a patient
      description: |
        FR-PAT-01, 02, 03, 06; spec patients R1-R4, R9, R10. Permission: PATIENTS_MANAGE.
        `phone` is the contact of record: for a patient under 18 it is the guardian's, and
        `guardian_name` is then required (422 PAT_GUARDIAN_REQUIRED). Give a
        date of birth or an age, not both. If the clinic already has patients on that number
        the answer is 409 PAT_PHONE_EXISTS with up to 10 candidates (families share phones);
        send `confirm_new: true` to register another person on it. A refusal takes no code.
        Registration is serialised per clinic, so two simultaneous registrations of one new
        number have exactly one winner. Records patient.created and the checklist's first
        patient. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPatient'
      responses:
        '201':
          description: The new patient
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PhoneExistsError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
    get:
      tags: [patients]
      operationId: lookupPatients
      summary: Look patients up by phone, code or name
      description: |
        FR-PAT-04; spec patients R5. Permission: PATIENTS_MANAGE. `q` is read in order as a phone
        number (7 or more digits, any usual formatting), then a patient code (`ME-0142`, any case,
        hyphen optional), otherwise the start of a name (case-insensitive). At most 20 results,
        ordered by name. Blank text, or phone-shaped text that is not a number, returns an empty
        list. The text is never logged.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Matching patients
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}:
    get:
      tags: [patients]
      operationId: getPatient
      summary: One patient of this clinic
      description: |
        Permission: PATIENTS_MANAGE. A patient of another clinic returns 404 REQ_NOT_FOUND, so
        its existence is never confirmed (NFR-08, AC7).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
      responses:
        '200':
          description: The patient
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [patients]
      operationId: updatePatient
      summary: Correct a patient's demographics
      description: |
        FR-PAT-01; spec patients R3, R7. Permission: PATIENTS_MANAGE. Only the fields sent change;
        send at least one. The code never changes. A date of birth or an age replaces the whole
        age fact. A blank `guardian_name` clears it (refused for a minor). Changing the phone
        does not run the duplicate check. Records one patient.updated listing the changed field
        *names* (never values); an edit that changes nothing records nothing. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
      responses:
        '200':
          description: The patient after the edit
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}/consent:
    put:
      tags: [patients]
      operationId: recordPatientConsent
      summary: Record whether the patient may be messaged on WhatsApp and SMS
      description: |
        FR-PAT-05, FR-PAT-06; spec patients R6. Permission: PATIENTS_MANAGE. Both flags are required:
        this records an answer, with who and when. Both false is "asked and declined", which differs
        from never asked (`consent_recorded_at` null). For a patient under 18 it is the guardian's
        answer. Refused with 409 PAT_OPTED_OUT while the patient is opted out: use opt-in, which
        takes the new consent. Records patient.consent_changed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientConsent'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConsentConflict'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}/opt-out:
    post:
      tags: [patients]
      operationId: optOutPatient
      summary: Stop all messages to the patient
      description: |
        FR-MSG-05; spec patients R6. Permission: PATIENTS_MANAGE. An opt-out overrides consent until
        an explicit opt-in (AC5); the consent record is kept. Idempotent: opting out an opted-out
        patient changes nothing and records nothing. Records patient.opted_out (source staff; M5's
        STOP replies use the same action). No body. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/patients/{patient_id}/opt-in:
    post:
      tags: [patients]
      operationId: optInPatient
      summary: Undo an opt-out, recording the consent given on the way back
      description: |
        FR-PAT-05, FR-MSG-05; spec patients R6, AC5. Permission: PATIENTS_MANAGE. The explicit way
        back from an opt-out: clears it and records consent in one step. 409 PAT_NOT_OPTED_OUT if
        the patient has not opted out (record consent instead). Records patient.opted_in.
        Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientConsent'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConsentConflict'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/invites/{token}:
    get:
      tags: [invites]
      operationId: describeInvite
      summary: What this invitation is for
      description: |
        Public (M1-P5): the invitee has no session yet. Returns the clinic, their name and
        the role, so the page can ask for a password with context. Unknown secrets are 404
        CLN_INVITE_INVALID; one that is expired or already used says which, because the
        person holding the link needs to know whether to ask for a new one.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The pending invitation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '404':
          $ref: '#/components/responses/InviteError'
        '410':
          $ref: '#/components/responses/InviteError'
  /api/v1/auth/invites/{token}/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Join the clinic and sign in (sets a new password, or proves the existing one)
      description: |
        FR-ORG-04, FR-AUTH-01, spec R13. Public: the secret in the URL is needed but is not enough
        for an account that already exists, so no X-CSRF-Token is needed (a cross-site request
        would have to know the secret). What password means depends on the invite's
        has_password (see describeInvite):

        - false, a new account: it is the password being chosen, at least 12 characters.
        - true, an existing account: it is that account's **current** password, verified and never
          changed. Whoever holds the link is not necessarily the account holder (the inviting
          owner receives it), so the link alone cannot take the account over. A wrong password is
          401 AUTH_INVALID_CREDENTIALS and counts towards the sign-in lockout (423 AUTH_LOCKED
          with Retry-After); the invitation stays pending.

        Accepting activates the membership, records staff.accepted, activates an ONBOARDING clinic
        when the new member is its owner (I1), and sets the session cookies — the invitee is
        signed in.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InviteToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '404':
          $ref: '#/components/responses/InviteError'
        '410':
          $ref: '#/components/responses/InviteError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '423':
          description: The existing account is locked (AUTH_LOCKED)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the lock ends
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ops/clinics:
    post:
      tags: [ops]
      operationId: createClinic
      summary: Create a clinic
      description: |
        FR-ORG-01, FR-OPS-01. Ops only. The clinic starts in ONBOARDING and becomes ACTIVE
        when its first owner accepts their invitation (I1). The slug is unique platform-wide
        because it appears in public links from M7 (409 CLN_SLUG_TAKEN). Records
        clinic.created and starts the onboarding checklist. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClinic'
      responses:
        '201':
          description: The new clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
    get:
      tags: [ops]
      operationId: listClinics
      summary: Every clinic with its onboarding state
      description: |
        FR-OPS-01, FR-OPS-04. Ops only. Newest first, each with its checklist timestamps so
        the time from "clinic created" to "owner accepted" is visible (goal G4). Unpaginated
        at pilot scale.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Clinics with their onboarding state
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsClinicList'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
  /api/v1/ops/clinics/{clinic_id}:
    get:
      tags: [ops]
      operationId: getOpsClinic
      summary: One clinic with its checklist, staff and doctor count
      description: 'FR-OPS-01/04. Ops only. No clinical content.'
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicPath'
      responses:
        '200':
          description: The clinic's onboarding detail
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsClinicDetail'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/ops/clinics/{clinic_id}/doctors:
    post:
      tags: [ops]
      operationId: addOpsDoctor
      summary: Add a doctor while onboarding
      description: |
        FR-ORG-02, FR-OPS-01. Ops only; the same body and rules as the clinic's own endpoint.
        Records doctor.added and the checklist's first doctor. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDoctor'
      responses:
        '201':
          description: The new doctor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/ops/clinics/{clinic_id}/staff-invites:
    post:
      tags: [ops]
      operationId: inviteOpsStaff
      summary: Invite the clinic's owner (or any role)
      description: |
        FR-OPS-01, FR-ORG-04. Ops only; the same body and rules as the clinic's own endpoint.
        The response carries accept_url — the one place the invitation secret appears. Records
        staff.invited and the checklist's first invite. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaffInvite'
      responses:
        '201':
          $ref: '#/components/responses/StaffInvited'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Liveness — the process is up
      description: Does not check dependencies. Used by container healthchecks and uptime probes.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /ready:
    get:
      tags: [platform]
      operationId: getReady
      summary: Readiness — the service can handle traffic
      description: Checks the database with a 2-second timeout.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: All dependencies usable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: A dependency is unavailable (READY_DB_UNAVAILABLE, READY_DB_TIMEOUT)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: me_access
      description: |
        Access token set by sign-in and refresh (HttpOnly, path /api). Checked on every
        request together with the session's liveness, the user's status and their
        membership, so nothing is cached beyond the request (spec R7).
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID. Generated by the API when absent and always echoed back.
      schema:
        type: string
        maxLength: 64
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Copy of the me_csrf cookie; required when session cookies are sent.
      schema:
        type: string
    ClinicId:
      name: X-Clinic-ID
      in: header
      required: false
      description: |
        Which clinic the request is for. Optional for a user with a single membership;
        required when they have more than one (otherwise 400 PERM_CLINIC_REQUIRED). A
        value that is not one of the caller's clinics gets the same 400, never a 404.
      schema:
        type: string
        format: uuid
    PatientPath:
      name: patient_id
      in: path
      required: true
      description: A patient of the request's clinic.
      schema:
        type: string
        format: uuid
    ClinicPath:
      name: clinic_id
      in: path
      required: true
      description: The clinic an ops request is about (ops users have no membership to infer).
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      description: The single-use invitation secret from the acceptance link.
      schema:
        type: string
        maxLength: 128
  responses:
    SessionStarted:
      description: Session started or renewed; me_access, me_refresh and me_csrf are set
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    AuthError:
      description: |
        AUTH_INVALID_CREDENTIALS, AUTH_SESSION_EXPIRED, AUTH_REFRESH_REUSED (401);
        AUTH_ACCOUNT_DISABLED, AUTH_CSRF_INVALID (403); REQ_UNSUPPORTED_MEDIA_TYPE (415);
        REQ_VALIDATION_FAILED (422)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PermissionError:
      description: |
        PERM_CLINIC_REQUIRED (400, choose a clinic); PERM_DENIED (403, the role lacks the
        permission, or an ops user on a clinic route); CLN_SUSPENDED (403); REQ_NOT_FOUND
        (404, unknown id — or another clinic's resource, which is never distinguishable)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: |
        The change conflicts with a clinic rule: CLN_LAST_OWNER (a clinic needs at least one
        active owner), CLN_INVALID_TRANSITION (the entity's state does not allow it),
        CLN_SLUG_TAKEN (that clinic URL is in use), CLN_MEMBER_EXISTS (already a member here)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PatientChanged:
      description: The patient after the change
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Patient'
    ConsentConflict:
      description: |
        PAT_OPTED_OUT (the patient asked not to be messaged: opt them back in to record consent);
        PAT_NOT_OPTED_OUT (opt-in needs an opt-out: record consent instead)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PhoneExistsError:
      description: |
        PAT_PHONE_EXISTS (409): the clinic already has patients on this phone number.
        details.candidates lists up to 10 of them (id, code, name, age) for the signed-in staff member;
        send confirm_new: true to register another person on the number.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PhoneExistsEnvelope'
    InviteError:
      description: |
        CLN_INVITE_INVALID (404, unknown or malformed secret); CLN_INVITE_EXPIRED,
        CLN_INVITE_USED (410 — ask the clinic for a new invitation, or sign in)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StaffInvited:
      description: The invited member and the acceptance URL (the secret appears only here)
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StaffInvitation'
  headers:
    RequestId:
      description: Correlation ID for this request; quote it when reporting a problem.
      schema:
        type: string
    NoStore:
      description: Always "no-store" — identity, permissions and clinic data are never cached.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              const: ok
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    SignInRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: Email address or phone number
          examples: [owner@sample-clinic.example, '9000000001']
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
    Session:
      type: object
      required: [user, memberships, session]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        memberships:
          type: array
          description: Active clinic memberships, ordered by clinic name
          items:
            $ref: '#/components/schemas/Membership'
        session:
          type: object
          required: [access_expires_at, refresh_expires_at]
          properties:
            access_expires_at:
              type: string
              format: date-time
            refresh_expires_at:
              type: string
              format: date-time
    Identity:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        memberships:
          type: array
          description: Active clinic memberships, ordered by clinic name
          items:
            $ref: '#/components/schemas/Membership'
    SessionUser:
      type: object
      required: [id, full_name, email, phone_e164, is_platform_ops]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: [string, 'null']
        phone_e164:
          type: [string, 'null']
        is_platform_ops:
          type: boolean
    Membership:
      type: object
      required: [membership_id, clinic_id, clinic_name, clinic_status, role, permissions]
      properties:
        membership_id:
          type: string
          format: uuid
        clinic_id:
          type: string
          format: uuid
        clinic_name:
          type: string
        clinic_status:
          $ref: '#/components/schemas/ClinicStatus'
        role:
          $ref: '#/components/schemas/Role'
        permissions:
          type: array
          description: What this role may do at this clinic (PRD §8.1), sorted
          items:
            $ref: '#/components/schemas/Permission'
    Role:
      type: string
      enum: [OWNER, DOCTOR, FRONT_DESK]
    ClinicStatus:
      type: string
      enum: [ONBOARDING, ACTIVE, SUSPENDED]
    MembershipStatus:
      type: string
      enum: [INVITED, ACTIVE, DEACTIVATED]
    Permission:
      type: string
      enum:
        - CLINIC_VIEW
        - CLINIC_MANAGE
        - DOCTORS_VIEW
        - STAFF_MANAGE
        - PATIENTS_MANAGE
        - APPOINTMENTS_MANAGE
        - QUEUE_MOVE
        - REMINDERS_SCHEDULE
        - CLINICAL_VIEW
        - CLINICAL_WRITE
        - USAGE_METRICS_VIEW
    Clinic:
      type: object
      required:
        - id
        - name
        - slug
        - timezone
        - status
        - phone_e164
        - address_line
        - city
        - state
        - pincode
        - specialties
        - patient_code_prefix
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Lower-case URL segment, used in public links from M7
        timezone:
          type: string
          description: IANA time zone name, e.g. Asia/Kolkata
        status:
          $ref: '#/components/schemas/ClinicStatus'
        phone_e164:
          type: [string, 'null']
        address_line:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        pincode:
          type: [string, 'null']
        specialties:
          type: array
          items:
            type: string
        patient_code_prefix:
          type: string
          pattern: '^[A-Z]{2,4}$'
          description: Prefix of this clinic's patient codes, e.g. ME for ME-0142
    Sex:
      type: string
      enum: [FEMALE, MALE, OTHER, UNDISCLOSED]
    Language:
      type: string
      enum: [en, hi]
      description: Language of messages to the patient (English and Hindi at MVP)
    Patient:
      type: object
      description: |
        A patient as staff see them. Personal data: never cached, never logged. The phone is the
        contact of record (the guardian's for a patient under 18).
      required:
        - id
        - code
        - full_name
        - phone_e164
        - sex
        - date_of_birth
        - age_years
        - age_is_estimated
        - is_minor
        - guardian_name
        - language
        - whatsapp_consent
        - sms_consent
        - opted_out
        - opted_out_at
        - whatsapp_allowed
        - sms_allowed
        - consent_recorded_at
        - consent_recorded_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z]{2,4}-[0-9]{4,}$'
          description: Clinic-scoped, human-readable, never reused or edited
        full_name:
          type: string
        phone_e164:
          type: string
        sex:
          $ref: '#/components/schemas/Sex'
        date_of_birth:
          type: [string, 'null']
          format: date
        age_years:
          type: integer
          description: Whole years on the clinic's today (its own time zone)
        age_is_estimated:
          type: boolean
          description: True when only an age was recorded, not a date of birth
        is_minor:
          type: boolean
        guardian_name:
          type: [string, 'null']
        language:
          $ref: '#/components/schemas/Language'
        whatsapp_consent:
          type: boolean
        sms_consent:
          type: boolean
        opted_out:
          type: boolean
          description: An opt-out overrides consent until an explicit opt-in
        opted_out_at:
          type: [string, 'null']
          format: date-time
        whatsapp_allowed:
          type: boolean
          description: WhatsApp consent given and not opted out - the one rule every sender uses
        sms_allowed:
          type: boolean
          description: SMS consent given and not opted out
        consent_recorded_at:
          type: [string, 'null']
          format: date-time
          description: Null means never asked; set (with both flags false) means asked and declined
        consent_recorded_by:
          type: [string, 'null']
          format: uuid
          description: The staff member who recorded the current consent
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NewPatient:
      type: object
      additionalProperties: false
      required: [full_name, phone, sex]
      description: Give exactly one of date_of_birth and age_years (I1).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          minLength: 1
          maxLength: 20
          description: Any usual Indian format; normalised to E.164. The guardian's for a minor.
        sex:
          $ref: '#/components/schemas/Sex'
        date_of_birth:
          type: [string, 'null']
          format: date
        age_years:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
        guardian_name:
          type: [string, 'null']
          maxLength: 200
          description: Required when the patient is under 18
        language:
          $ref: '#/components/schemas/Language'
        confirm_new:
          type: boolean
          default: false
          description: Register another person on a phone number the clinic already has
    PatientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent are changed. The code is not editable.
      properties:
        full_name:
          type: [string, 'null']
          maxLength: 200
        phone:
          type: [string, 'null']
          maxLength: 20
        sex:
          oneOf:
            - $ref: '#/components/schemas/Sex'
            - type: 'null'
        date_of_birth:
          type: [string, 'null']
          format: date
        age_years:
          type: [integer, 'null']
          minimum: 0
          maximum: 120
        guardian_name:
          type: [string, 'null']
          maxLength: 200
          description: Blank clears it (refused for a minor)
        language:
          oneOf:
            - $ref: '#/components/schemas/Language'
            - type: 'null'
    PatientConsent:
      type: object
      additionalProperties: false
      required: [whatsapp, sms]
      description: The answer to "may we message you on WhatsApp, on SMS?" (the guardian's for a minor)
      properties:
        whatsapp:
          type: boolean
        sms:
          type: boolean
    PatientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Patient'
    PatientCandidate:
      type: object
      required: [id, code, full_name, age_years]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        full_name:
          type: string
        age_years:
          type: integer
    PhoneExistsEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              const: PAT_PHONE_EXISTS
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              required: [candidates]
              properties:
                candidates:
                  type: array
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/PatientCandidate'
    DoctorList:
      type: object
      required: [items]
      description: Unpaginated by design; a clinic has one to four doctors
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'
    Doctor:
      type: object
      required:
        - id
        - user_id
        - display_name
        - qualification
        - registration_number
        - registration_council
        - specialty
        - is_active
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: [string, 'null']
          description: The staff account that signs in as this doctor, if any
        display_name:
          type: string
        qualification:
          type: string
        registration_number:
          type: string
          description: Printed on every prescription (FR-RX-04)
        registration_council:
          type: string
        specialty:
          type: [string, 'null']
        is_active:
          type: boolean
    StaffList:
      type: object
      required: [items]
      description: Unpaginated by design; a clinic has a handful of staff
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffMember'
    StaffMember:
      type: object
      required: [membership_id, user_id, full_name, role, status]
      properties:
        membership_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MembershipStatus'
    StaffMembershipUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Send a role, a status, or both. status accepts DEACTIVATED only (M1).
      properties:
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          const: DEACTIVATED
    StaffInvitation:
      allOf:
        - $ref: '#/components/schemas/StaffMember'
        - type: object
          required: [accept_url]
          properties:
            accept_url:
              type: string
              format: uri
              description: |
                Where the invitee sets their password. Contains the single-use secret, which
                is never stored in clear and never shown again.
    NewStaffInvite:
      type: object
      additionalProperties: false
      required: [full_name, role]
      description: An email address or a phone number is required (it is how they sign in).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/Role'
        email:
          type: [string, 'null']
          maxLength: 254
        phone:
          type: [string, 'null']
          maxLength: 20
          description: Indian 10-digit input accepted; normalised to E.164
    Invite:
      type: object
      required: [clinic_name, full_name, role, expires_at, has_password]
      properties:
        clinic_name:
          type: string
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        expires_at:
          type: [string, 'null']
          format: date-time
        has_password:
          type: boolean
          description: True when the person already has an account; the page can offer sign-in
    AcceptInviteRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: |
            For a new account (the invite's has_password is false): the password to set, at least
            12 characters (the domain's policy). For an existing account (has_password is true):
            its current password, which is checked and never changed.
    NewClinic:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 3
          maxLength: 63
          description: Lower-case words joined by single hyphens; unique platform-wide
        timezone:
          type: [string, 'null']
          description: IANA name; defaults to Asia/Kolkata
        phone:
          type: [string, 'null']
          maxLength: 20
        address_line:
          type: [string, 'null']
          maxLength: 300
        city:
          type: [string, 'null']
          maxLength: 100
        state:
          type: [string, 'null']
          maxLength: 100
        pincode:
          type: [string, 'null']
          maxLength: 6
        specialties:
          type: array
          maxItems: 20
          items:
            type: string
        patient_code_prefix:
          type: [string, 'null']
          maxLength: 4
          description: 2-4 upper-case letters for patient codes (ME-0142); derived from the name when omitted. Fixed once the clinic has patients.
    ClinicUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent are changed. The slug and status are not editable here.
      properties:
        name:
          type: [string, 'null']
          maxLength: 200
        timezone:
          type: [string, 'null']
        phone:
          type: [string, 'null']
          maxLength: 20
        address_line:
          type: [string, 'null']
          maxLength: 300
        city:
          type: [string, 'null']
          maxLength: 100
        state:
          type: [string, 'null']
          maxLength: 100
        pincode:
          type: [string, 'null']
          maxLength: 6
        specialties:
          type: [array, 'null']
          maxItems: 20
          items:
            type: string
    NewDoctor:
      type: object
      additionalProperties: false
      required: [display_name, qualification, registration_number, registration_council]
      description: I3 — every prescription prints the qualification and registration details.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        qualification:
          type: string
          minLength: 1
          maxLength: 200
        registration_number:
          type: string
          minLength: 1
          maxLength: 50
        registration_council:
          type: string
          minLength: 1
          maxLength: 200
        specialty:
          type: [string, 'null']
          maxLength: 100
        user_id:
          type: [string, 'null']
          format: uuid
          description: An active member of this clinic who has no doctor profile yet
    DoctorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the fields sent are changed; the required ones cannot be emptied (I3).
      properties:
        display_name:
          type: [string, 'null']
          maxLength: 200
        qualification:
          type: [string, 'null']
          maxLength: 200
        registration_number:
          type: [string, 'null']
          maxLength: 50
        registration_council:
          type: [string, 'null']
          maxLength: 200
        specialty:
          type: [string, 'null']
          maxLength: 100
        user_id:
          type: [string, 'null']
          format: uuid
        is_active:
          type: [boolean, 'null']
          description: false deactivates the doctor; history keeps referring to them
    OnboardingChecklist:
      type: object
      description: When each onboarding step first happened (FR-OPS-04, R12)
      required:
        - started_at
        - clinic_created_at
        - doctors_added_at
        - staff_invited_at
        - patients_imported_at
        - first_appointment_at
        - first_prescription_at
      properties:
        started_at:
          type: string
          format: date-time
        clinic_created_at:
          type: [string, 'null']
          format: date-time
        doctors_added_at:
          type: [string, 'null']
          format: date-time
        staff_invited_at:
          type: [string, 'null']
          format: date-time
        patients_imported_at:
          type: [string, 'null']
          format: date-time
          description: Written from M2
        first_appointment_at:
          type: [string, 'null']
          format: date-time
          description: Written from M3
        first_prescription_at:
          type: [string, 'null']
          format: date-time
          description: Written from M4
    OpsClinicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Clinic'
              - type: object
                required: [onboarding]
                properties:
                  onboarding:
                    oneOf:
                      - $ref: '#/components/schemas/OnboardingChecklist'
                      - type: 'null'
    OpsClinicDetail:
      allOf:
        - $ref: '#/components/schemas/Clinic'
        - type: object
          required: [onboarding, doctor_count, staff]
          properties:
            onboarding:
              oneOf:
                - $ref: '#/components/schemas/OnboardingChecklist'
                - type: 'null'
            doctor_count:
              type: integer
            staff:
              type: array
              items:
                $ref: '#/components/schemas/StaffMember'
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable error code from docs/ERRORS.md
          examples: [READY_DB_UNAVAILABLE]
        message:
          type: string
          description: Human-readable, safe to show to clinic staff
        request_id:
          type: string
        details:
          type: object
          description: Structured, non-clinical context for the error
          additionalProperties: true
