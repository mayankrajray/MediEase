  /api/v1/clinic/doctors/{doctor_id}/schedule:
    get:
      tags: [scheduling]
      operationId: getDoctorSchedule
      summary: A doctor's weekly blocks and upcoming exceptions
      description: |
        FR-APT-01. Permission: DOCTORS_VIEW (every clinic role). The blocks in force from the
        clinic's today, and leave or extra sessions from today up to 180 days ahead. Times are
        the clinic's wall clock (HH:MM); `overnight` is true when a block ends the next day.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/DoctorPath'
      responses:
        '200':
          description: The schedule
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    put:
      tags: [scheduling]
      operationId: replaceDoctorSchedule
      summary: Replace a doctor's weekly schedule
      description: |
        FR-APT-01; spec R14-R16, R20. Permission: SCHEDULES_MANAGE (owners). The blocks replace
        the whole weekly schedule from the clinic's today; an empty list clears it. An end at or
        before the start means the next day, and a block lasts 15 minutes to 12 hours, so
        13:00-10:00 is refused (422 SCH_INVALID_BLOCK) while 23:00-01:00 is accepted. Blocks may
        not overlap, also across midnight and from Sunday into Monday (409 SCH_OVERLAP). Slot mode
        needs slot_minutes (dividing the block); token mode needs capacity. Future sessions that no
        longer match are removed if nobody is booked; booked ones are kept and listed in
        kept_sessions. Records schedule.changed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/DoctorPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleReplace'
      responses:
        '200':
          $ref: '#/components/responses/ScheduleChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ScheduleError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ScheduleError'
  /api/v1/clinic/doctors/{doctor_id}/schedule-exceptions:
    post:
      tags: [scheduling]
      operationId: addScheduleException
      summary: Add a whole-day leave or an extra session on a date
      description: |
        FR-APT-01; spec R15, R17, R18. Permission: SCHEDULES_MANAGE (owners). The date is the
        clinic's today up to 180 days ahead. LEAVE covers the whole day (send no times; one per
        doctor and date, else 409 SCH_LEAVE_EXISTS): that day's generated sessions with nobody
        booked are removed and booked ones are listed in kept_sessions. EXTRA is one block
        validated like a weekly block; it may not overlap what the rules plan that day, the day
        before or the day after (409 SCH_OVERLAP). Records schedule.exception_added. Needs
        X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/DoctorPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewScheduleException'
      responses:
        '201':
          $ref: '#/components/responses/ScheduleExceptionChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ScheduleError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ScheduleError'
  /api/v1/clinic/doctors/{doctor_id}/schedule-exceptions/{exception_id}:
    delete:
      tags: [scheduling]
      operationId: removeScheduleException
      summary: Remove a leave or an extra session
      description: |
        Spec R17, R18. Permission: SCHEDULES_MANAGE (owners). Past exceptions are history and
        cannot be removed (422). Removing an extra deletes its session if nobody is booked (a
        booked one is listed in kept_sessions); removing a leave lets the day generate again.
        Records schedule.exception_removed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/DoctorPath'
        - name: exception_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/ScheduleExceptionChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/ScheduleError'
  /api/v1/sessions:
    get:
      tags: [scheduling]
      operationId: listSessions
      summary: The sessions of one date
      description: |
        FR-APT-01, FR-APT-02; spec R1-R4. Permission: APPOINTMENTS_MANAGE (every clinic role).
        A date from the clinic's today up to 180 days ahead first generates the sessions its
        rules plan (idempotent: two screens asking at once still get one set); an earlier date
        shows what was generated then, a later one is 422. Without doctor_id, every active
        doctor. A session belongs to the clinic-local date it starts on, also when it runs past
        midnight. Slot mode lists the slots; token mode gives the next token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
