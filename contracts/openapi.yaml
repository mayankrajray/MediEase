            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/prescriptions/{rx_id}:
    get:
      tags: [prescriptions]
      operationId: getPrescription
      summary: One prescription version with its chain
      description: FR-RX-01, 09; spec R16. Records one prescription.viewed. Permission CLINICAL_VIEW.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '200':
          description: The version
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    put:
      tags: [prescriptions]
      operationId: replacePrescription
      summary: Save the whole draft
      description: |
        FR-RX-01..03; decision 3A. Replaces items, advice and follow-up date. 409 RX_NOT_DRAFT on an
        issued version, 409 RX_STALE (details.revision) when another tab saved first. Records
        prescription.updated with counts only. Permission CLINICAL_WRITE, the visit's doctor. Needs
        X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PrescriptionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionDraft'
      responses:
        '200':
          description: The draft after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/PrescriptionError'
    delete:
      tags: [prescriptions]
      operationId: discardPrescription
      summary: Discard a draft
