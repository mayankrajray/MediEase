            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [clinic]
      operationId: updateDoctor
      summary: Correct a doctor's details or deactivate them
      description: |
        FR-ORG-02. Permission: CLINIC_MANAGE (owners). Only the fields sent are changed; send
        at least one. The required fields can be corrected but not emptied (I3). Setting
        is_active to false stops offering the doctor for new work; history keeps referring to
        them. Records doctor.updated. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: doctor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
