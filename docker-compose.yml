# Local development stack.
# Rule (CLAUDE.md): a service appears here only when the application uses it today.
# M0-P1: database only. api, migrate and web are added in M0-P3..P5; worker in M5.
# Target shape: docs/ARCHITECTURE.md §12.

name: mediease

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # The database always works in UTC; clinic timezones are applied at the edge.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only: never expose the dev database on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
