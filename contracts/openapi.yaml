openapi: 3.1.0
info:
  title: MediEase API
  version: 0.1.0
  description: |
    Source of truth for the MediEase HTTP contract (ADR-0008).
    Endpoints are added here in the same change that implements them.
    Planned surface: docs/API.md. Error codes: docs/ERRORS.md.
servers:
  - url: http://localhost:8000
    description: Local API (direct)
  - url: http://localhost:3000
    description: Local web origin (browser path, proxied to the API)
tags:
  - name: platform
    description: Liveness and readiness (M0)
paths:
  /health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Liveness — the process is up
      description: Does not check dependencies. Used by container healthchecks and uptime probes.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /ready:
    get:
      tags: [platform]
      operationId: getReady
      summary: Readiness — the service can handle traffic
      description: Checks the database with a 2-second timeout.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: All dependencies usable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: A dependency is unavailable (READY_DB_UNAVAILABLE, READY_DB_TIMEOUT)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Correlation ID. Generated by the API when absent and always echoed back.
      schema:
        type: string
        maxLength: 64
  headers:
    RequestId:
      description: Correlation ID for this request; quote it when reporting a problem.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          const: ready
        checks:
          type: object
          required: [database]
          properties:
            database:
              type: string
              const: ok
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: Stable error code from docs/ERRORS.md
          examples: [READY_DB_UNAVAILABLE]
        message:
          type: string
          description: Human-readable, safe to show to clinic staff
        request_id:
          type: string
        details:
          type: object
          description: Structured, non-clinical context for the error
          additionalProperties: true
