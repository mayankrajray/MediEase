          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [register_checked, certificate_matches]
              properties:
                register_checked: {type: boolean}
                certificate_matches: {type: boolean}
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required: [verified, changed]
                properties:
                  verified: {type: boolean, const: true}
                  changed: {type: boolean}
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/ApplicationError'
        '422':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/ops/clinics/{clinic_id}/verify:
    post:
      tags: [ops]
      operationId: verifyOpsClinic
      summary: Verify an ops-created clinic
      description: |
        M6c-P3, spec R45 (FR-ONB-06). OPS_REVIEWER only. Needs at least one active verified
        doctor (else 422). A verified ACTIVE clinic has a public page.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The clinic, verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/ApplicationError'
        '422':
          $ref: '#/components/responses/ApplicationError'
  /api/v1/clinic/listing:
