      description: |
        Spec R7, D14. From BOOKED or ARRIVED until the session ends (else 409 APT_NOT_MODIFIABLE).
        OTHER needs a note. The place is freed; the token is not. Records appointment.cancelled
        with the reason code, never the note. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AppointmentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCancel'
      responses:
        '200':
          description: Cancelled
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/AppointmentError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/appointments/{appointment_id}/reschedule:
    post:
      tags: [appointments]
      operationId: rescheduleAppointment
      summary: Move a booking to another session or slot
      description: |
        Spec R8, D15. From BOOKED only, to any open session of the clinic (another doctor's, or
        another slot of the same session); the old appointment is cancelled with RESCHEDULED and
        the new one points at it, in one transaction. A closed source session is fine. Records
        appointment.rescheduled. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AppointmentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentReschedule'
