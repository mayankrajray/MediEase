[project]
name = "mediease-api"
version = "0.0.0"
description = "MediEase API — WhatsApp-native clinic operating system (hexagonal Flask backend)"
requires-python = ">=3.12,<3.13"
# Pinned to the exact versions installed and tested in M0-P2 (issue #8).
# Bumping a version is a deliberate change recorded in its PR (AGENTS.md §2).
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "structlog==26.1.0",
    "python-ulid==4.0.1",
    # M0-P3 (issue #10). psycopg's binary wheel bundles libpq, so neither the
    # host nor the image needs PostgreSQL client libraries or a compiler.
    "sqlalchemy==2.1.5",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    # M1-P2 (issue #19). Argon2id password hashing through the reference C
    # implementation (FR-AUTH-01), and JWT access tokens with algorithm pinning
    # (FR-AUTH-02). Both ship binary wheels / pure Python: no compiler needed.
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    # M4-P4 (ADR-0012). In-house prescription PDFs: WeasyPrint (BSD; needs Pango, installed in
    # the image) with Jinja2 templates (already installed with Flask, now named because we use it
    # directly), and boto3 for the S3-compatible blob store used in production from M6.
    "weasyprint==70.0",
    "jinja2==3.1.6",
    "boto3==1.43.114",
    # M5-P2 (decisions 1A, 2A): PyCA cryptography for Fernet encryption of the phone numbers
    # stored on messages, and PyYAML for the template catalogue (read with yaml.safe_load only).
    # Both were already installed in dev through moto; the runtime now needs them directly.
    "cryptography==50.0.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    # Contract tests: validate real responses against contracts/openapi.yaml (ADR-0008).
    "openapi-core==0.23.1",
    # Known-vulnerability check of installed dependencies (make audit, CI).
    "pip-audit==2.10.1",
    # Layer boundaries (apps/api/CLAUDE.md) and the coverage gate (NFR-14).
    "import-linter==2.15",
    "pytest-cov==7.1.0",
    # A test that waits forever (a deadlock, a thread barrier nobody reaches) fails after
    # `timeout` seconds with every thread's stack, instead of hanging the run and CI.
    "pytest-timeout==2.4.0",
    # M4-P4: an in-process S3 for the blob adapter (no network), PDF text extraction that
    # understands WeasyPrint's font encoding (pdfium), and boto3 type stubs for mypy.
    "moto[s3]==5.2.4",
    "pypdfium2==5.14.0",
    "types-boto3[s3]==1.43.114",
    # M5-P2: PyYAML type stubs for mypy.
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The PDF renderer's template, stylesheet and vendored fonts ship inside the package (M4-P4).
[tool.setuptools.package-data]
"mediease_api.adapters.pdf" = ["assets/*"]
# The message template catalogue (M5-P2) and the price table (M5-P5).
"mediease_api.adapters.messaging" = ["templates.yaml", "prices.yaml"]

# --- Ruff: lint + format -----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mediease_api"]

# --- mypy ----------------------------------------------------------------------
# The whole package is type-checked; domain/ and application/ are strict
# (AGENTS.md §6). Those overrides take effect once the layers have modules.
[tool.mypy]
python_version = "3.12"
packages = ["mediease_api"]
mypy_path = "src"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["mediease_api.domain.*", "mediease_api.application.*"]
strict = true

# WeasyPrint ships no type information; only adapters/pdf imports it.
[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

# --- pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# No single test may run longer than this (the slowest, 10,000 patients, takes a few seconds).
# "thread" also works when the hang is inside a worker thread, and dumps all stacks on failure.
timeout = 120
timeout_method = "thread"

# --- Coverage gate (NFR-14) -------------------------------------------------------
# make test-api and CI run `pytest --cov`; below the threshold the run fails.
# A second gate, `coverage report --include=domain,application --fail-under=80`
# (Makefile CORE_COVERAGE, CI), holds the business core to NFR-14 on its own (M1-P1).
[tool.coverage.run]
source = ["mediease_api"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# --- Layer boundaries (apps/api/CLAUDE.md "Layer rules") ---------------------------
# `lint-imports` (make lint, CI) fails when a module crosses a boundary.
[tool.importlinter]
root_package = "mediease_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports only the standard library"
type = "forbidden"
source_modules = ["mediease_api.domain"]
forbidden_modules = [
    "mediease_api.application", "mediease_api.ports", "mediease_api.adapters",
    "mediease_api.delivery", "mediease_api.config", "mediease_api.bootstrap", "mediease_api.wsgi",
    "flask", "werkzeug", "sqlalchemy", "alembic", "psycopg", "pydantic", "pydantic_settings",
    "structlog", "gunicorn", "ulid", "argon2", "jwt", "weasyprint", "jinja2", "boto3", "botocore",
    "cryptography", "yaml",
]

[[tool.importlinter.contracts]]
name = "application depends only on domain and ports"
type = "forbidden"
source_modules = ["mediease_api.application"]
forbidden_modules = [
    "mediease_api.adapters", "mediease_api.delivery", "mediease_api.config",
    "mediease_api.bootstrap", "mediease_api.wsgi",
    "flask", "werkzeug", "sqlalchemy", "alembic", "psycopg", "pydantic", "pydantic_settings",
    "gunicorn", "argon2", "jwt", "cryptography", "yaml",
]

[[tool.importlinter.contracts]]
name = "ports are interfaces over the domain only"
type = "forbidden"
source_modules = ["mediease_api.ports"]
forbidden_modules = [
    "mediease_api.application", "mediease_api.adapters", "mediease_api.delivery",
    "mediease_api.config", "mediease_api.bootstrap", "mediease_api.wsgi",
    "flask", "werkzeug", "sqlalchemy", "alembic", "psycopg", "pydantic", "pydantic_settings",
    "gunicorn", "argon2", "jwt", "cryptography", "yaml",
]

[[tool.importlinter.contracts]]
name = "adapters know nothing about HTTP or the composition root"
type = "forbidden"
source_modules = ["mediease_api.adapters"]
forbidden_modules = [
    "mediease_api.delivery", "mediease_api.bootstrap", "mediease_api.wsgi", "flask", "werkzeug",
]
