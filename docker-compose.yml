# Local development stack. `make up` starts everything with one command.
# Rule (CLAUDE.md): a service appears here only when the application uses it today.
# Start-up order is declared, not scripted:
#   db (healthy) -> migrate (exits 0) -> api (healthy) -> web (healthy).
# The worker (M5-P1) starts after migrate and runs beside the api. Target shape: docs/ARCHITECTURE.md §12.

name: mediease

# The only settings the API reads (config/settings.py). Passed explicitly rather
# than via env_file, so containers never receive variables they do not use.
x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_ECHO_PARAMS: ${DB_ECHO_PARAMS:-false}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
  AUDIT_IP_SALT: ${AUDIT_IP_SALT:?set AUDIT_IP_SALT in .env}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1209600}
  # M4-P4: prescription PDFs on the blobs volume (s3 from M6).
  BLOB_STORAGE: ${BLOB_STORAGE:-local}
  BLOB_LOCAL_DIR: /var/lib/mediease/blobs
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  # M4-P5: patient link keys (empty locally means the development key).
  PATIENT_LINK_SIGNING_KEYS: ${PATIENT_LINK_SIGNING_KEYS:-}
  PATIENT_LINK_TTL_DAYS: ${PATIENT_LINK_TTL_DAYS:-90}
  # M5-P1: the background worker's polling.
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
  # M5-P2: messaging (empty phone keys locally means the development key; required when deployed).
  MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-console}
  MESSAGING_PHONE_KEYS: ${MESSAGING_PHONE_KEYS:-}
  RX_LINK_SEND_WINDOW_HOURS: ${RX_LINK_SEND_WINDOW_HOURS:-24}
  # M5-P5: the SMS fallback for reminders (FR-REM-06), off unless set; console only until L-03.
  MESSAGING_SMS_FALLBACK_ENABLED: ${MESSAGING_SMS_FALLBACK_ENABLED:-false}
  SMS_PROVIDER: ${SMS_PROVIDER:-console}
  # M5-P3: WhatsApp Cloud API and its webhook (empty secrets: the webhook refuses everything).
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
  WHATSAPP_GRAPH_URL: ${WHATSAPP_GRAPH_URL:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  # M6a-P3: Google sign-in; `fake` locally (refused when deployed), `google` after L-09.
  GOOGLE_OIDC_PROVIDER: ${GOOGLE_OIDC_PROVIDER:-fake}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # M6a-P4 (ADR-0016): the worker sends account emails; locally into Mailpit (localhost:8025).
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:-MediEase <no-reply@mediease.example>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURITY: ${SMTP_SECURITY:-none}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

# Least privilege for our own containers (CLAUDE.md): read-only root
# filesystem, no Linux capabilities, no privilege escalation. Writable scratch
# space is an explicit tmpfs. `db` keeps the PostgreSQL image's defaults: its
# entrypoint needs to own its data directory.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# When a service is stopped, Docker's DNS forwards its name upstream and the
# lookup takes ~4 s to fail (DEBUG_JOURNAL 2026-10-02). One 1-second attempt
# keeps "unreachable" answers inside the 2 s readiness / 5 s client budgets.
x-fast-dns: &fast-dns
  - timeout:1
  - attempts:1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # The database always works in UTC; clinic timezones are applied at the edge.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only: never expose the dev database on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-off schema migration on the API image. Runs to completion, then exits;
  # the API never migrates at boot (CLAUDE.md "Schema changes run as a discrete step").
  migrate:
    <<: *hardened
    build: ./apps/api
    image: mediease-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    tmpfs: ["/tmp"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *hardened
    build: ./apps/api
    image: mediease-api:local
    environment: *api-environment
    tmpfs: ["/tmp"]
    # Prescription PDFs, written once per version (ADR-0012); the only writable path besides /tmp.
    volumes:
      - blobs:/var/lib/mediease/blobs
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    dns_opt: *fast-dns
    # Healthy means ready: the database answers within 2 s. The slim image has
    # no curl, so the probe uses Python's standard library.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # The background worker (M5-P1, ADR-0005): the API image, a different command. It claims due
  # jobs from the database, so a second one is safe. The root filesystem is read-only; /tmp is a
  # 1 MB tmpfs for the heartbeat file, which the health check reads (spec R11a).
  worker:
    <<: *hardened
    build: ./apps/api
    image: mediease-api:local
    command: ["python", "-m", "mediease_api.delivery.worker"]
    environment: *api-environment
    tmpfs: ["/tmp:size=1m,mode=1777"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    dns_opt: *fast-dns
    healthcheck:
      test: ["CMD", "python", "-m", "mediease_api.delivery.worker.health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    # SIGTERM lets the job in hand finish; the rest are handed back.
    stop_grace_period: 30s
    restart: unless-stopped

  # M6a-P4 (ADR-0016 decision 3): catches every email the worker sends locally. SMTP on the
  # compose network only; the inbox and its API on localhost:8025 (and mailpit:8025 for e2e).
  mailpit:
    <<: *hardened
    image: axllent/mailpit:v1.32.0
    environment:
      MP_MAX_MESSAGES: "500"
    tmpfs: ["/tmp", "/data"]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  web:
    <<: *hardened
    build:
      context: ./apps/web
      args:
        # next build bakes the rewrite destinations into the image (NEXT_STEPS_PLAN Task 5).
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    image: mediease-web:local
    environment:
      # Read at runtime by the server-side API client (src/lib/api/client.ts).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    # Next.js writes its runtime cache here; the node user (uid 1000) must own it.
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    dns_opt: *fast-dns
    # Liveness of the web process only (/livez calls nothing); /status is the
    # whole-system view for people.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
