          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/ops/clinics/{clinic_id}/doctors/{doctor_id}/schedule:
    put:
      tags: [ops]
      operationId: replaceOpsDoctorSchedule
      summary: Set a doctor's weekly schedule while onboarding
      description: |
        FR-APT-01, FR-OPS-01; spec D5. Ops only; the same body, rules and response as the
        clinic's own endpoint (RUNBOOK §10 step 5). Records schedule.changed with actor OPS.
        Needs X-CSRF-Token.
      security:
