          description: The date's sessions, by start time
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorSessionList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/appointments:
    post:
      tags: [appointments]
      operationId: bookAppointment
      summary: Book a patient into a session
      description: |
        FR-APT-03, FR-APT-04, FR-APT-07; spec R3-R6, D12, D13. Slot mode needs slot_start (one of
        the session's slots, any offset); token mode refuses it and hands out the next token,
        never reused. Bookable until the session (token) or the slot (slot mode) ends. Source is
        FRONT_DESK (default), PHONE or WHATSAPP. Records appointment.booked. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
