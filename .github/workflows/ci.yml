# CI gates for MediEase (docs/TESTING.md §5).
# The api and web jobs switch on automatically once their manifests exist, so this workflow is
# valid from the first commit. From M0-P5: image builds + vulnerability scan, a fresh-clone smoke
# test of the whole stack, and security scans.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      web: ${{ steps.check.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          echo "api=$([ -f apps/api/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  config:
    name: Config and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenAPI contract is valid
        run: |
          pip install "openapi-spec-validator==0.7.1"
          openapi-spec-validator contracts/openapi.yaml

  api:
    name: API — lint, types, tests
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediease
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mediease_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediease -d mediease_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      LOG_LEVEL: INFO
      DB_ECHO_PARAMS: "false"
      DATABASE_URL: postgresql+psycopg://mediease:ci-only-password@localhost:5432/mediease_test
      # Real-PostgreSQL integration tests (tests/conftest.py::database_url).
      TEST_DATABASE_URL: postgresql+psycopg://mediease:ci-only-password@localhost:5432/mediease_test
      # Deliberately not Asia/Kolkata: flushes out code that relies on the machine timezone.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q

  web:
    name: Web — lint, types, tests, build
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # next.config builds the /api rewrites from this; the build fails without it.
      API_INTERNAL_URL: http://api:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types match contracts/openapi.yaml
        run: npm run gen:api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  images:
    name: Images — build and scan
    needs: detect
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t mediease-api:ci apps/api
      - name: Build web image
        run: docker build --build-arg API_INTERNAL_URL=http://api:8000 -t mediease-web:ci apps/web
      # Fails on any HIGH or CRITICAL vulnerability that has a fix available.
      # Trivy is pinned and run from its official image (no third-party action).
      - name: Scan images (Trivy)
        run: |
          for image in mediease-api:ci mediease-web:ci; do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
            echo "::endgroup::"
          done

  smoke:
    name: Stack — fresh-clone smoke test
    needs: detect
    if: needs.detect.outputs.api == 'true' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The M0 exit criterion, exactly as a developer runs it on a fresh clone.
      - run: cp .env.example .env
      - run: make up
      - run: make smoke
      - name: Show service state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
