              type: object
              additionalProperties: false
              description: At least one of the two (422 otherwise)
              properties:
                listed: {type: boolean}
                search_indexing:
                  type: boolean
                  description: M6c-P5 (R62) - false keeps search engines away from the profiles
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicListing'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/v1/clinic/listing/doctors/{doctor_id}:
    put:
      tags: [clinic]
      operationId: setDoctorVisibility
      summary: Show or hide a doctor on the public page and in the directory
      description: |
        M6c-P4, spec R53. CLINIC_MANAGE. Showing needs an active doctor verified by MediEase
        (409 CLN_DOCTOR_NOT_VERIFIED). Another clinic's doctor is 404.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: doctor_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [visible]
              properties:
                visible: {type: boolean}
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicListing'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
  /api/v1/ops/clinics/{clinic_id}/suspend:
    post:
      tags: [ops]
      operationId: suspendOpsClinic
      summary: Suspend a clinic
      description: |
        M6c-P4, spec R56, R57 (FR-ONB-05). OPS_ADMIN. ACTIVE -> SUSPENDED (409 otherwise). In the
        same transaction every open booking request is declined with CLINIC_UNAVAILABLE and its
        patient told in the portal. The clinic leaves every public surface at once and its staff
        are refused (CLN_SUSPENDED). OTHER needs a note (422); the note is not audited.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  $ref: '#/components/schemas/SuspendReason'
                note: {type: [string, 'null'], maxLength: 500}
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema:
                type: object
                required: [clinic, requests_withdrawn]
                properties:
                  clinic:
                    $ref: '#/components/schemas/Clinic'
                  requests_withdrawn: {type: integer, minimum: 0}
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ConflictError'
  /api/v1/ops/clinics/{clinic_id}/reactivate:
    post:
      tags: [ops]
      operationId: reactivateOpsClinic
      summary: Reactivate a suspended clinic
      description: |
        M6c-P4, spec R58. OPS_ADMIN. SUSPENDED -> ACTIVE (422 otherwise; 409 CLN_OWNER_REQUIRED
        without an active owner). The owner's listing choice is kept.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          $ref: '#/components/responses/ConflictError'
  /api/v1/public/search/clinics:
    get:
      tags: [public]
      operationId: searchClinics
      summary: Find clinics in the MediEase directory
      description: |
        M6c-P6, spec discovery R1-R10 (FR-DIS-01, 02, 04, 05; ADR-0021). No session; rate
        limited per caller (PRT_RATE_LIMITED). Only discoverable clinics and their public
        doctors, ordered by relevance, then place, then the earliest free day. At most 20.
        An allow-list body. A bad filter is 422 naming it.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
          description: Words to match a clinic's or doctor's name or a specialty (trigram similarity)
        - name: city
          in: query
          schema: {type: string, maxLength: 100}
        - name: pincode
          in: query
          schema: {type: string, pattern: '^[1-9][0-9]{5}$'}
          description: Near this PIN - the same PIN, the same city, then the same PIN district
        - name: specialty
          in: query
          schema: {type: string, maxLength: 100}
        - name: language
          in: query
          schema: {type: string}
          description: One of options.languages
        - name: available
          in: query
          schema: {type: boolean, default: false}
          description: Only those with a free time in the next 7 days
      responses:
        '200':
          description: The results and the filter options
          content:
            application/json:
              schema:
                type: object
                required: [items, options]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClinicSearchHit'
                  options:
                    $ref: '#/components/schemas/SearchOptions'
        '422':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/ConflictError'
  /api/v1/public/search/doctors:
    get:
      tags: [public]
      operationId: searchDoctors
      summary: Find doctors in the MediEase directory
      description: |
        M6c-P6, spec discovery R1-R10 (FR-DIS-01, 02, 04, 05; ADR-0021). No session; rate
        limited per caller (PRT_RATE_LIMITED). Only discoverable clinics and their public
        doctors, ordered by relevance, then place, then the earliest free day. At most 20.
        An allow-list body. A bad filter is 422 naming it.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
          description: Words to match a clinic's or doctor's name or a specialty (trigram similarity)
        - name: city
          in: query
          schema: {type: string, maxLength: 100}
        - name: pincode
          in: query
          schema: {type: string, pattern: '^[1-9][0-9]{5}$'}
          description: Near this PIN - the same PIN, the same city, then the same PIN district
        - name: specialty
          in: query
          schema: {type: string, maxLength: 100}
        - name: language
          in: query
          schema: {type: string}
          description: One of options.languages
        - name: available
          in: query
          schema: {type: boolean, default: false}
          description: Only those with a free time in the next 7 days
      responses:
        '200':
          description: The results and the filter options
          content:
            application/json:
              schema:
                type: object
                required: [items, options]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DoctorSearchHit'
                  options:
                    $ref: '#/components/schemas/SearchOptions'
        '422':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/ConflictError'
  /api/v1/public/sitemap:
    get:
      tags: [public]
      operationId: getPublicSitemap
      summary: The indexable public profiles, for sitemap.xml
      description: |
        M6c-P5, spec clinic-onboarding R63 (FR-DIS-06). No session. The clinic page and each shown
        doctor's profile of every discoverable clinic that has not opted out of search engines, as
        absolute URLs under PUBLIC_BASE_URL. Unlisted, unverified, suspended and opted-out clinics
        are absent. Cacheable for an hour; the JSON itself is noindex.
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The URLs
          content:
            application/json:
              schema:
                type: object
                required: [base_url, items]
                properties:
                  base_url: {type: string}
                  items:
                    type: array
                    items:
                      type: object
                      required: [loc, lastmod]
                      properties:
                        loc: {type: string}
                        lastmod: {type: string, format: date-time}
  /api/v1/clinic/listing/doctors/{doctor_id}/profile:
    put:
      tags: [clinic]
      operationId: setDoctorProfile
      summary: A doctor's published languages and fee
      description: |
        M6c-P5, spec R61. CLINIC_MANAGE. Languages from language_options (422 otherwise); the fee
        in paise, 0 to 1 000 000, or null to show none. Another clinic's doctor is 404.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: doctor_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                languages:
                  type: array
                  items: {type: string}
                fee_paise: {type: [integer, 'null'], minimum: 0, maximum: 1000000}
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicListing'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/ConflictError'
  /api/v1/ops/messaging-costs:
    get:
      tags: [ops]
      operationId: getOpsMessagingCosts
      summary: Each clinic's messages and their cost in one month
      description: |
        Spec reminders-and-messaging R18 (M5-P5 decision 7A). Ops only. For every clinic that
        sent messages in the month (read in the clinic's own time zone on the sending time),
        the count per channel, how many are priced and the cost in paise, excluding GST.
        A WhatsApp message is priced once its delivery is reported, at the webhook's pricing
        category (free when Meta reports it is not billable); a failed message costs nothing;
        a message whose cost is not yet known is counted as unpriced, never guessed. Costs are
        kept in millipaise and rounded half up to paise at each total. Counts and money only:
        no message, patient or number.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: month
          in: query
          required: true
          description: The calendar month, YYYY-MM
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-10'
      responses:
        '200':
          description: The month's messages and costs per clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsMessagingCosts'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          description: REQ_VALIDATION_FAILED (month is missing or not YYYY-MM)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Liveness — the process is up
      description: Does not check dependencies. Used by container healthchecks and uptime probes.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /ready:
    get:
      tags: [platform]
      operationId: getReady
      summary: Readiness — the service can handle traffic
      description: Checks the database with a 2-second timeout.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: All dependencies usable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: A dependency is unavailable (READY_DB_UNAVAILABLE, READY_DB_TIMEOUT)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/visits:
    post:
      tags: [visits]
      operationId: startVisit
      summary: Start the visit for an appointment in consultation
      description: |
        FR-VIS-01; spec R1, M4-P1 decisions 1A and 5A. The appointment must be IN_CONSULTATION
        (409 VIS_NOT_STARTABLE, details.status) and the caller its doctor (403 VIS_NOT_YOURS). One
        visit per appointment: 409 VIS_ALREADY_EXISTS with details.visit_id. Records
        visit.started. Permission CLINICAL_WRITE. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVisit'
      responses:
        '201':
          description: Started
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/VisitError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/VisitError'
  /api/v1/visits/{visit_id}:
    get:
      tags: [visits]
      operationId: getConsultation
      summary: The consultation view - the visit, the patient and their last 10 visits
      description: |
        FR-VIS-02, FR-VIS-03; spec R2, R16, AC9. One response for the consultation screen, and one
        visit.viewed audit row for it. history is the patient's previous visits, newest first.
        Permission CLINICAL_VIEW.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/VisitPath'
      responses:
        '200':
          description: The consultation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consultation'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [visits]
      operationId: updateVisit
      summary: Change the visit's notes or vitals
      description: |
        FR-VIS-02; spec R3, M4-P1 decision 4A. Only the fields sent change; null clears one,
        vitals replaces the whole set. revision is the one the screen has: 409 VIS_STALE
        (details.revision, the current one) when another tab saved first; 409 VIS_LOCKED
        (details.locked_at) 24 hours after completion. Records visit.updated with the changed
        field names only. Permission CLINICAL_WRITE, the visit's doctor. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/VisitPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitChange'
      responses:
        '200':
          description: The visit after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/VisitError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/VisitError'
  /api/v1/visits/{visit_id}/complete:
    post:
      tags: [visits]
      operationId: completeVisit
      summary: Complete the visit (and its appointment)
      description: |
        FR-VIS-05; spec R3, M4-P1 decision 2A. Sets completed_at and locked_at = completed_at +
        24 h, and moves the appointment IN_CONSULTATION -> COMPLETED when it is still there on the
        session's day. Completing again changes nothing. Records visit.completed (and
        appointment.status_changed). Permission CLINICAL_WRITE, the visit's doctor. Needs
        X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/VisitPath'
      responses:
        '200':
          description: Completed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/visits/{visit_id}/addenda:
    post:
      tags: [visits]
      operationId: addVisitAddendum
      summary: Add an addendum to a completed visit
      description: |
        FR-VIS-05; spec R3, AC6, M4-P1 decision 3A. Allowed on a completed visit, locked or not
        (409 VIS_NOT_COMPLETED on an open one). Addenda never change. Records
        visit.addendum_added. Permission CLINICAL_WRITE, the visit's doctor. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/VisitPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVisitAddendum'
      responses:
        '201':
          description: Added
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitAddendum'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/VisitError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/VisitError'
  /api/v1/patients/{patient_id}/visits:
    get:
      tags: [visits]
      operationId: listPatientVisits
      summary: A patient's visits, newest first
      description: |
        FR-VIS-03; spec R2, R16. Pages of limit (1-50, default 10); pass next_before back as before
        for the next page. One patient.visits_viewed audit row per page. Permission CLINICAL_VIEW.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: before
          in: query
          required: false
          description: A visit ID from next_before
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A page of visits
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitPage'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/visits/{visit_id}/prescriptions:
    post:
      tags: [prescriptions]
      operationId: createPrescription
      summary: Start the visit's prescription (an empty draft, version 1)
      description: |
        FR-RX-01; M4-P2 decision 1A. One chain per visit: 409 RX_ALREADY_EXISTS with
        details.prescription_id when it has one. 409 VIS_LOCKED once the visit is locked. Records
        prescription.created. Permission CLINICAL_WRITE, the visit's doctor. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/VisitPath'
      responses:
        '201':
          description: The draft
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/prescriptions/{rx_id}:
    get:
      tags: [prescriptions]
      operationId: getPrescription
      summary: One prescription version with its chain
      description: FR-RX-01, 09; spec R16. Records one prescription.viewed. Permission CLINICAL_VIEW.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '200':
          description: The version
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    put:
      tags: [prescriptions]
      operationId: replacePrescription
      summary: Save the whole draft
      description: |
        FR-RX-01..03; decision 3A. Replaces items, advice and follow-up date. 409 RX_NOT_DRAFT on an
        issued version, 409 RX_STALE (details.revision) when another tab saved first. Records
        prescription.updated with counts only. Permission CLINICAL_WRITE, the visit's doctor. Needs
        X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PrescriptionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionDraft'
      responses:
        '200':
          description: The draft after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/PrescriptionError'
    delete:
      tags: [prescriptions]
      operationId: discardPrescription
      summary: Discard a draft
      description: Only a draft (409 RX_NOT_DRAFT otherwise). Records prescription.discarded. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '204':
          description: Discarded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/prescriptions/{rx_id}/issue:
    post:
      tags: [prescriptions]
      operationId: issuePrescription
      summary: Issue the draft (it never changes again)
      description: |
        FR-RX-06, 09; spec R4, R5, R14, R20, AC1, AC4. Freezes the draft with the doctor and clinic
        as printed, the patient's language and link_delivery (PENDING when the patient allows
        WhatsApp or SMS, else NOT_CONSENTED). A revision supersedes the version before it. 422
        RX_EMPTY, 422 RX_DOCTOR_INCOMPLETE (details.fields). Records prescription.issued. No message
        is sent in M4. Permission CLINICAL_WRITE, the visit's doctor. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PrescriptionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionIssue'
      responses:
        '200':
          description: Issued
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/prescriptions/{rx_id}/revise:
    post:
      tags: [prescriptions]
      operationId: revisePrescription
      summary: Start a new version from the latest issued one
      description: |
        FR-RX-09; spec R6, decision 2A (at any time). A draft, version n+1, with the same content.
        409 RX_DRAFT_EXISTS (details.prescription_id), 409 RX_NOT_LATEST (details.latest_id).
        Records prescription.revised. Permission CLINICAL_WRITE, the visit's doctor. Needs
        X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '201':
          description: The new draft
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prescription'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/prescriptions/{rx_id}/preview:
    get:
      tags: [prescriptions]
      operationId: previewPrescription
      summary: A draft as the patient's page will show it once issued
      description: |
        M4-P6 decision 3A; spec §6 ("Issue shows a preview of exactly what the patient will
        see"), R20. The same page model as GET /public/links/{token}/prescription, built from the
        draft with the doctor and clinic as they are now and today's date; lang defaults to the
        patient's language. 409 RX_NOT_DRAFT for an issued version; 422 RX_DOCTOR_INCOMPLETE as
        issuing would be. Read only, part of the consultation already audited, so no audit row.
        Permission CLINICAL_VIEW.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PrescriptionPath'
        - name: lang
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: The page the draft would give
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPrescriptionPage'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/VisitPermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
        '422':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/prescriptions/{rx_id}/pdf:
    get:
      tags: [prescriptions]
      operationId: getPrescriptionPdf
      summary: The printable PDF of an issued prescription
      description: |
        FR-RX-04, 06; spec R8, R16, R18, D6; ADR-0012; M4-P4. Rendered on the first download of a
        version and stored (write-once); later downloads stream the stored file, so every caller
        gets the same bytes and concurrent first downloads cause one render (AC8). Labels and
        structured phrases in the prescription's language, the doctor's text as written (R20).
        Paper size from the clinic setting at first render. Records one
        prescription.pdf_downloaded per download. Permission RX_PRINT (every role): the latest
        issued version; a superseded one also needs CLINICAL_VIEW, else 409 RX_NOT_LATEST
        (details.latest_id). 409 RX_NOT_ISSUED for a draft. 503 RX_PDF_BUSY with Retry-After
        while another download renders it; 500 RX_PDF_FAILED (nothing stored; try again).
        Served only here: never a public or pre-signed URL.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '200':
          description: The PDF
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              description: private, no-store
              schema:
                type: string
            Content-Disposition:
              description: inline; filename="prescription-<id>-v<version>.pdf"
              schema:
                type: string
          content:
            application/pdf:
              schema:
                description: The PDF bytes (OpenAPI 3.1 binary content)
                contentMediaType: application/pdf
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
        '500':
          description: RX_PDF_FAILED; nothing was stored, so the next download tries again
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: RX_PDF_BUSY; another download is preparing it
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds to wait before trying again
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/patients/{patient_id}/prescriptions:
    get:
      tags: [prescriptions]
      operationId: listPrintablePrescriptions
      summary: A patient's current prescriptions, for printing (no content)
      description: |
        M4-P4 decision 2A, spec D6. The patient's issued versions (never drafts or superseded
        ones), newest first, at most 20: IDs, version, issue time and the doctor's name, without
        any clinical content. Not audited (nothing clinical is read); each download is.
        Permission RX_PRINT.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
      responses:
        '200':
          description: The printable versions
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintablePrescriptionList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/prescriptions/{rx_id}/link:
    get:
      tags: [prescriptions]
      operationId: getPatientLink
      summary: The prescription chain's patient link, for the QR code and copy button
      description: |
        M4-P5 decisions 1A, 6A; spec R9. One link per chain, made when version 1 is issued
        (and here for chains issued before M4-P5, recording patient_link.created); any version's
        ID names the chain. IDs, expiry, lock state and open count only, never content. 409
        RX_NOT_ISSUED while the chain has only a draft. Permission RX_PRINT.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '200':
          description: The chain's link
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkInfo'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/prescriptions/{rx_id}/link/reset:
    post:
      tags: [prescriptions]
      operationId: resetPatientLink
      summary: Unlock a patient link after five wrong last-4 answers
      description: |
        Spec R10, decision 6A. 409 LINK_NOT_LOCKED when it is not locked. Records
        patient_link.reset. Permission RX_PRINT. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '200':
          description: The chain's link
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkInfo'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/prescriptions/{rx_id}/link/replace:
    post:
      tags: [prescriptions]
      operationId: replacePatientLink
      summary: Revoke the chain's patient link and make a new one
      description: |
        Decision 6A: for an expired, forwarded or lost link. The old token answers 410
        LINK_REVOKED from now on. Records patient_link.replaced. Permission RX_PRINT. Needs
        X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/PrescriptionPath'
      responses:
        '200':
          description: The chain's link
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkInfo'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PrescriptionError'
  /api/v1/public/links/{token}:
    get:
      tags: [patient-links]
      operationId: describePatientLink
      summary: What the patient page shows before the last-4 check
      description: |
        Spec R9, R12; FR-RX-08. No session. The clinic's name, the patient's saved language and
        whether the link is locked; nothing clinical. 404 LINK_INVALID for any token that is not
        exactly one of ours; 410 LINK_EXPIRED or LINK_REVOKED; 429 LINK_RATE_LIMITED.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/LinkToken'
      responses:
        '200':
          description: The link is usable
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkSummary'
        '404':
          $ref: '#/components/responses/LinkError'
        '410':
          $ref: '#/components/responses/LinkError'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
  /api/v1/public/links/{token}/verify:
    post:
      tags: [patient-links]
      operationId: verifyPatientLink
      summary: The last-4 check; returns a 30-minute view token
      description: |
        Spec R10, R13; FR-RX-08; AC3. The last 4 digits of the patient's phone. Wrong: 401
        LINK_CHALLENGE_FAILED with details.attempts_left; the fifth wrong answer, and every
        attempt after it, is 423 LINK_LOCKED until clinic staff reset it. Right: records
        patient_link.opened and returns a view token for this link only (30 minutes), which the
        patient page keeps in its own HttpOnly cookie and sends as X-Link-View.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/LinkToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientLinkChallenge'
      responses:
        '200':
          description: Opened
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientLinkView'
        '401':
          $ref: '#/components/responses/LinkError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '423':
          $ref: '#/components/responses/LinkError'
        '404':
          $ref: '#/components/responses/LinkError'
        '410':
          $ref: '#/components/responses/LinkError'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
  /api/v1/public/links/{token}/prescription:
    get:
      tags: [patient-links]
      operationId: viewLinkedPrescription
      summary: The patient page's content (the latest issued version)
      description: |
        Spec R11, R12, R19, R20; FR-RX-07; AC2, AC10. Needs X-Link-View from verify, else 401
        LINK_CHALLENGE_REQUIRED. The chain's latest issued version, with updated_note when older
        versions exist; labels and structured phrases in lang (default: the patient's saved
        language), everything the doctor wrote exactly as written. No patient details.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/LinkToken'
        - name: X-Link-View
          in: header
          required: false
          description: The view token from verify
          schema:
            type: string
            maxLength: 200
        - name: lang
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: The page
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientPrescriptionPage'
        '401':
          $ref: '#/components/responses/LinkError'
        '422':
          $ref: '#/components/responses/AuthError'
        '423':
          $ref: '#/components/responses/LinkError'
        '404':
          $ref: '#/components/responses/LinkError'
        '410':
          $ref: '#/components/responses/LinkError'
        '429':
          $ref: '#/components/responses/LinkRateLimited'
