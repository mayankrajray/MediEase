        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/AppointmentError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/appointments/to-move:
    get:
      tags: [appointments]
      operationId: listBookingsToMove
      summary: Bookings a schedule change left to move
      description: |
        M6a-P8 (FR-APT-09, decision 6A). BOOKED or ARRIVED appointments from today on whose session
        is CLOSED, because the doctor took leave that day (reason LEAVE) or the weekly schedule
        changed (SCHEDULE_CHANGED); earliest first, at most 200. Reschedule or cancel each with the
        usual routes. The patient as code, first name and masked phone only. APPOINTMENTS_MANAGE.
      security:
        - sessionCookie: []
