# Local development stack. `make up` starts everything with one command.
# Rule (CLAUDE.md): a service appears here only when the application uses it today.
# Start-up order is declared, not scripted:
#   db (healthy) -> migrate (exits 0) -> api (healthy) -> web (healthy).
# worker joins in M5. Target shape: docs/ARCHITECTURE.md §12.

name: mediease

# The only settings the API reads (config/settings.py). Passed explicitly rather
# than via env_file, so containers never receive variables they do not use.
x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_ECHO_PARAMS: ${DB_ECHO_PARAMS:-false}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
  AUDIT_IP_SALT: ${AUDIT_IP_SALT:?set AUDIT_IP_SALT in .env}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1209600}
  # M4-P4: prescription PDFs on the blobs volume (s3 from M6).
  BLOB_STORAGE: ${BLOB_STORAGE:-local}
  BLOB_LOCAL_DIR: /var/lib/mediease/blobs
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-ap-south-1}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}

# Least privilege for our own containers (CLAUDE.md): read-only root
# filesystem, no Linux capabilities, no privilege escalation. Writable scratch
# space is an explicit tmpfs. `db` keeps the PostgreSQL image's defaults: its
# entrypoint needs to own its data directory.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# When a service is stopped, Docker's DNS forwards its name upstream and the
# lookup takes ~4 s to fail (DEBUG_JOURNAL 2026-10-02). One 1-second attempt
# keeps "unreachable" answers inside the 2 s readiness / 5 s client budgets.
x-fast-dns: &fast-dns
  - timeout:1
  - attempts:1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # The database always works in UTC; clinic timezones are applied at the edge.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Bound to localhost only: never expose the dev database on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-off schema migration on the API image. Runs to completion, then exits;
  # the API never migrates at boot (CLAUDE.md "Schema changes run as a discrete step").
  migrate:
    <<: *hardened
    build: ./apps/api
    image: mediease-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    tmpfs: ["/tmp"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *hardened
    build: ./apps/api
    image: mediease-api:local
    environment: *api-environment
    tmpfs: ["/tmp"]
    # Prescription PDFs, written once per version (ADR-0012); the only writable path besides /tmp.
    volumes:
      - blobs:/var/lib/mediease/blobs
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    dns_opt: *fast-dns
    # Healthy means ready: the database answers within 2 s. The slim image has
    # no curl, so the probe uses Python's standard library.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    <<: *hardened
    build:
      context: ./apps/web
      args:
        # next build bakes the rewrite destinations into the image (NEXT_STEPS_PLAN Task 5).
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    image: mediease-web:local
    environment:
      # Read at runtime by the server-side API client (src/lib/api/client.ts).
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    # Next.js writes its runtime cache here; the node user (uid 1000) must own it.
    tmpfs: ["/tmp", "/app/.next/cache:uid=1000,gid=1000"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    dns_opt: *fast-dns
    # Liveness of the web process only (/livez calls nothing); /status is the
    # whole-system view for people.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/livez').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
