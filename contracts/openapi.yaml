openapi: 3.1.0
info:
  title: MediEase API
  version: 0.15.0
  description: |
    Source of truth for the MediEase HTTP contract (ADR-0008).
    Endpoints are added here in the same change that implements them.
    Planned surface: docs/API.md. Error codes: docs/ERRORS.md.
servers:
  - url: http://localhost:8000
    description: Local API (direct)
  - url: http://localhost:3000
    description: Local web origin (browser path, proxied to the API)
tags:
  - name: platform
    description: Liveness and readiness (M0)
  - name: auth
    description: |
      Sign-in, refresh rotation and sign-out (M1-P2, ADR-0006). Tokens travel only in
      HttpOnly cookies (me_access, me_refresh) and never in a body. Unsafe requests that
      carry a session cookie must send X-CSRF-Token equal to the me_csrf cookie.
  - name: identity
    description: |
      Who the caller is and what they may do (M1-P3, FR-AUTH-03). Every request is
      re-checked: the session must still be live and the user still active, so signing out
      or deactivating a member takes effect on their next request.
  - name: clinic
    description: |
      Clinic settings, doctors and staff (M1-P3 reads, M1-P4 the role change, M1-P5 the rest).
      The clinic is never a parameter: it is the caller's only membership, or the one named in
      X-Clinic-ID. Another clinic's resource is 404, never 403 (NFR-08).
  - name: ops
    description: |
      The internal ops console (M1-P5, FR-OPS-01/04). Platform staff only: clinic staff are
      refused even as owners (spec R10). Ops users have no membership, so the clinic is named
      in the path. No clinical content is ever returned here. The CSV patient import (M2-P4)
      reports row numbers and counts, never a patient's name or phone.
  - name: patients
    description: |
      Register, look up, read and correct patients (M2-P2, FR-PAT-01..04). Every role in a clinic
      holds PATIENTS_MANAGE; ops users are refused (spec identity-and-tenancy R10). The clinic is the
      request's (X-Clinic-ID when the user has several), and another clinic's patient is 404 (NFR-08).
      Responses carry personal data and are never cached.
  - name: scheduling
    description: Doctor schedules, leave and extra sessions, and the sessions they generate (M3)
  - name: appointments
    description: |
      Book, read, cancel and reschedule (M3-P2, FR-APT-03..05, FR-APT-07). Every clinic role holds
      APPOINTMENTS_MANAGE. A session row lock serialises bookings, and the database refuses a
      double booking whatever the code does (FR-APT-04). `reason` is a short non-clinical note;
      it is never logged, audited or messaged.
  - name: queue
    description: |
      The daily queue (M3-P3, FR-QUE-01/02/04): status transitions, walk-ins and the day's read.
      Every clinic role holds QUEUE_MOVE. A transition names the status the screen showed, so a
      stale tab cannot move a patient who has already moved. Live refresh (ETag, 304) is M3-P4.
  - name: visits
    description: |
      Visits (M4-P1, FR-VIS-01..03, 05): the clinical record of one consultation. Reads need
      CLINICAL_VIEW (doctors, owners), writes CLINICAL_WRITE and being the visit's doctor; front
      desk gets 403 PERM_DENIED. Read-only 24 hours after completion, then addenda. Every read
      that returns clinical content records one audit row for the whole view (spec R16).
      Responses are never cached.
  - name: prescriptions
    description: |
      Prescriptions (M4-P2, FR-RX-01..03, 06, 09): one chain of versions per visit. A draft is
      saved whole with its revision; issuing freezes it with the doctor and clinic as printed, the
      patient's language and the pending-delivery marker. An issued version never changes (409
      RX_NOT_DRAFT, also refused by the database); revise it for a new version. Same permissions,
      audit and caching rules as visits. Nothing validates a medicine or a dose.
  - name: rx-library
    description: |
      A doctor's own favourites and templates and medicine-name suggestions (M4-P3, FR-RX-05,
      FR-RX-10). CLINICAL_WRITE and a doctor profile: another doctor's items are 404. Suggestions
      come from the caller's favourites and this clinic's issued prescriptions only; nothing else
      is ever suggested, and no dose or drug data exists. Use is counted when a prescription built
      from them is issued.
  - name: invites
    description: |
      Accepting a staff invitation (M1-P5). Public, because the invitee has no session yet: the
      authority is the single-use secret in the URL, which is also why these paths need no
      X-CSRF-Token. Accepting sets a password, activates the membership and signs the person in.
paths:
  /api/v1/auth/sign-in:
    post:
      tags: [auth]
      operationId: signIn
      summary: Sign in with an email or phone number and a password
      description: |
        FR-AUTH-01, FR-AUTH-04. Phone numbers are normalised to E.164 (Indian 10-digit input
        accepted). Five consecutive wrong passwords lock the account for 15 minutes.
        Sets me_access, me_refresh and me_csrf. Exempt from the CSRF header.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '423':
          description: Account locked (AUTH_LOCKED)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the lock ends
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        FR-AUTH-02. Reads me_refresh. Presenting an already-rotated token revokes the whole
        session (AUTH_REFRESH_REUSED). On any 401/403 from the session itself the cookies are
        cleared.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: End the session (revokes its refresh-token family)
      description: Idempotent. Always clears the session cookies.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The signed-in user, their clinics and their permissions
      description: |
        FR-AUTH-03. Needs a session but no clinic: the response lists every active
        membership with the clinic's status, the role and the permissions that role holds
        (PRD §8.1), which is what the web app needs to render a clinic switcher and a
        role's screens. Cache-Control: no-store.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The current user and their memberships
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic:
    get:
      tags: [clinic]
      operationId: getClinic
      summary: The clinic this request is for
      description: 'Permission: CLINIC_VIEW (every role).'
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: The clinic
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [clinic]
      operationId: updateClinic
      summary: Edit the clinic's details
      description: |
        FR-ORG-01. Permission: CLINIC_MANAGE (owners). Only the fields sent are changed; send
        at least one. The slug is not editable (it appears in public links from M7) and the
        status has its own transitions. Records clinic.updated. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicUpdate'
      responses:
        '200':
          description: The clinic after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clinic'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/doctors:
    get:
      tags: [clinic]
      operationId: listDoctors
      summary: The clinic's doctors
      description: |
        Permission: DOCTORS_VIEW (every role). Unpaginated: a clinic has one to four
        doctors (PRD §2).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: Doctors of this clinic, oldest first
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
    post:
      tags: [clinic]
      operationId: addDoctor
      summary: Add a doctor to this clinic
      description: |
        FR-ORG-02. Permission: CLINIC_MANAGE (owners). Qualification, registration number and
        council are required because every prescription prints them (I3). An optional user_id
        links a staff account that is an active member and has no doctor profile yet (spec §8
        "owner who is also a doctor"). Records doctor.added and the checklist's first doctor.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDoctor'
      responses:
        '201':
          description: The new doctor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/doctors/{doctor_id}:
    get:
      tags: [clinic]
      operationId: getDoctor
      summary: One doctor of this clinic
      description: |
        Permission: DOCTORS_VIEW. A doctor of another clinic returns 404 REQ_NOT_FOUND,
        so the resource's existence is never confirmed (NFR-08, spec R8).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: doctor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The doctor
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [clinic]
      operationId: updateDoctor
      summary: Correct a doctor's details or deactivate them
      description: |
        FR-ORG-02. Permission: CLINIC_MANAGE (owners). Only the fields sent are changed; send
        at least one. The required fields can be corrected but not emptied (I3). Setting
        is_active to false stops offering the doctor for new work; history keeps referring to
        them. Records doctor.updated. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: doctor_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorUpdate'
      responses:
        '200':
          description: The doctor after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/doctors/{doctor_id}/schedule:
    get:
      tags: [scheduling]
      operationId: getDoctorSchedule
      summary: A doctor's weekly blocks and upcoming exceptions
      description: |
        FR-APT-01. Permission: DOCTORS_VIEW (every clinic role). The blocks in force from the
        clinic's today, and leave or extra sessions from today up to 180 days ahead. Times are
        the clinic's wall clock (HH:MM); `overnight` is true when a block ends the next day.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/DoctorPath'
      responses:
        '200':
          description: The schedule
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    put:
      tags: [scheduling]
      operationId: replaceDoctorSchedule
      summary: Replace a doctor's weekly schedule
      description: |
        FR-APT-01; spec R14-R16, R20. Permission: SCHEDULES_MANAGE (owners). The blocks replace
        the whole weekly schedule from the clinic's today; an empty list clears it. An end at or
        before the start means the next day, and a block lasts 15 minutes to 12 hours, so
        13:00-10:00 is refused (422 SCH_INVALID_BLOCK) while 23:00-01:00 is accepted. Blocks may
        not overlap, also across midnight and from Sunday into Monday (409 SCH_OVERLAP). Slot mode
        needs slot_minutes (dividing the block); token mode needs capacity. Future sessions that no
        longer match are removed if nobody is booked; booked ones are kept and listed in
        kept_sessions. Records schedule.changed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/DoctorPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleReplace'
      responses:
        '200':
          $ref: '#/components/responses/ScheduleChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ScheduleError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ScheduleError'
  /api/v1/clinic/doctors/{doctor_id}/schedule-exceptions:
    post:
      tags: [scheduling]
      operationId: addScheduleException
      summary: Add a whole-day leave or an extra session on a date
      description: |
        FR-APT-01; spec R15, R17, R18. Permission: SCHEDULES_MANAGE (owners). The date is the
        clinic's today up to 180 days ahead. LEAVE covers the whole day (send no times; one per
        doctor and date, else 409 SCH_LEAVE_EXISTS): that day's generated sessions with nobody
        booked are removed and booked ones are listed in kept_sessions. EXTRA is one block
        validated like a weekly block; it may not overlap what the rules plan that day, the day
        before or the day after (409 SCH_OVERLAP). Records schedule.exception_added. Needs
        X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/DoctorPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewScheduleException'
      responses:
        '201':
          $ref: '#/components/responses/ScheduleExceptionChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ScheduleError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ScheduleError'
  /api/v1/clinic/doctors/{doctor_id}/schedule-exceptions/{exception_id}:
    delete:
      tags: [scheduling]
      operationId: removeScheduleException
      summary: Remove a leave or an extra session
      description: |
        Spec R17, R18. Permission: SCHEDULES_MANAGE (owners). Past exceptions are history and
        cannot be removed (422). Removing an extra deletes its session if nobody is booked (a
        booked one is listed in kept_sessions); removing a leave lets the day generate again.
        Records schedule.exception_removed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/DoctorPath'
        - name: exception_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/ScheduleExceptionChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/ScheduleError'
  /api/v1/sessions:
    get:
      tags: [scheduling]
      operationId: listSessions
      summary: The sessions of one date
      description: |
        FR-APT-01, FR-APT-02; spec R1-R4. Permission: APPOINTMENTS_MANAGE (every clinic role).
        A date from the clinic's today up to 180 days ahead first generates the sessions its
        rules plan (idempotent: two screens asking at once still get one set); an earlier date
        shows what was generated then, a later one is 422. Without doctor_id, every active
        doctor. A session belongs to the clinic-local date it starts on, also when it runs past
        midnight. Slot mode lists the slots; token mode gives the next token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: doctor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The date's sessions, by start time
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorSessionList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/appointments:
    post:
      tags: [appointments]
      operationId: bookAppointment
      summary: Book a patient into a session
      description: |
        FR-APT-03, FR-APT-04, FR-APT-07; spec R3-R6, D12, D13. Slot mode needs slot_start (one of
        the session's slots, any offset); token mode refuses it and hands out the next token,
        never reused. Bookable until the session (token) or the slot (slot mode) ends. Source is
        FRONT_DESK (default), PHONE or WHATSAPP. Records appointment.booked. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAppointment'
      responses:
        '201':
          description: Booked
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/AppointmentError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/appointments/{appointment_id}:
    get:
      tags: [appointments]
      operationId: getAppointment
      summary: One appointment with its status history
      description: FR-APT-05. Permission APPOINTMENTS_MANAGE.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/AppointmentPath'
      responses:
        '200':
          description: The appointment
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/appointments/{appointment_id}/cancel:
    post:
      tags: [appointments]
      operationId: cancelAppointment
      summary: Cancel with a reason
      description: |
        Spec R7, D14. From BOOKED or ARRIVED until the session ends (else 409 APT_NOT_MODIFIABLE).
        OTHER needs a note. The place is freed; the token is not. Records appointment.cancelled
        with the reason code, never the note. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AppointmentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCancel'
      responses:
        '200':
          description: Cancelled
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/AppointmentError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/appointments/{appointment_id}/reschedule:
    post:
      tags: [appointments]
      operationId: rescheduleAppointment
      summary: Move a booking to another session or slot
      description: |
        Spec R8, D15. From BOOKED only, to any open session of the clinic (another doctor's, or
        another slot of the same session); the old appointment is cancelled with RESCHEDULED and
        the new one points at it, in one transaction. A closed source session is fine. Records
        appointment.rescheduled. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AppointmentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentReschedule'
      responses:
        '201':
          description: The new appointment
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/AppointmentError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/patients/{patient_id}/appointments:
    get:
      tags: [appointments]
      operationId: listPatientAppointments
      summary: A patient's appointments, newest first
      description: FR-APT-05. At most 50, cancelled ones included. Permission APPOINTMENTS_MANAGE.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
      responses:
        '200':
          description: The patient's appointments
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/appointments/{appointment_id}/transitions:
    post:
      tags: [queue]
      operationId: transitionAppointment
      summary: Move an appointment along the queue
      description: |
        FR-QUE-02; spec R9, AC3, D18, D19. BOOKED -> ARRIVED | NO_SHOW, ARRIVED -> IN_CONSULTATION |
        NO_SHOW, IN_CONSULTATION -> COMPLETED, NO_SHOW -> ARRIVED. `from` must be the current
        status (else 409 QUE_INVALID_TRANSITION with the real `from`). Only on the session's
        clinic-local date (or while an overnight session runs); NO_SHOW once the session or slot
        has started (409 QUE_WRONG_TIME). Records appointment.status_changed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AppointmentPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentTransition'
      responses:
        '200':
          description: Moved
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/QueueError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/queue/walk-ins:
    post:
      tags: [queue]
      operationId: addWalkIn
      summary: Add a walk-in to today's queue
      description: |
        FR-QUE-04; spec R11, D21. Joins the doctor's open session running now, else the next one
        today, or the named session_id of today's (409 QUE_NO_SESSION when there is none): the next
        token, or in slot mode slot_start or the earliest free slot that has not ended (409
        APT_SESSION_FULL when none). Source WALK_IN, status ARRIVED at once. Records
        appointment.booked. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWalkIn'
      responses:
        '201':
          description: Added and arrived
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/QueueError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AppointmentError'
  /api/v1/queue:
    get:
      tags: [queue]
      operationId: getQueue
      summary: A day's queue
      description: |
        FR-QUE-01; D22. The date's sessions (generated as GET /sessions does) with their active
        appointments in token or slot order, each with the patient's code, name and age and the
        minutes waited. date defaults to the clinic's today. Permission APPOINTMENTS_MANAGE.
        FR-QUE-03, R12, D23 (M3-P4): the 200 carries a strong ETag, a hash of the body; send it
        back in If-None-Match (compared weakly, as RFC 9110 says) and an unchanged queue is a
        bodiless 304. Screens poll every 5 seconds. Still no-store: nothing is cached.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of the queue the screen already has
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: doctor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: include_cancelled
          in: query
          required: false
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: The day's queue
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '304':
          description: Unchanged since the ETag sent; no body
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/staff:
    get:
      tags: [clinic]
      operationId: listStaff
      summary: The clinic's members with their roles
      description: |
        Permission: STAFF_MANAGE (owners only; FR-ORG-03). Includes invited and
        deactivated memberships so an owner can see the whole team. Unpaginated.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: Memberships of this clinic, by member name
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
    post:
      tags: [clinic]
      operationId: inviteStaff
      summary: Invite somebody to join this clinic
      description: |
        FR-ORG-04. Permission: STAFF_MANAGE (owners). An email address or a phone number is
        required, because that is how they will sign in (R1). A person who already has a
        MediEase account keeps it and gains a membership; somebody who already belongs to
        this clinic is refused (409 CLN_MEMBER_EXISTS); a still-pending invitation is
        re-issued, which retires the previous link. The response carries accept_url — the one
        place the invitation secret appears. Records staff.invited. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewStaffInvite'
      responses:
        '201':
          $ref: '#/components/responses/StaffInvited'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/staff/{membership_id}:
    patch:
      tags: [clinic]
      operationId: changeStaffMembership
      summary: Change a member's role, deactivate them, or both
      description: |
        FR-ORG-04, FR-AUD-01. Permission: STAFF_MANAGE (owners only). Send a role, a status,
        or both; each change is written with its own audit event in one transaction, so it is
        never unrecorded (spec R11). status accepts DEACTIVATED only: the lifecycle is
        INVITED → ACTIVE → DEACTIVATED with no way back in M1, so somebody removed by mistake
        is invited again. The last active owner can be neither demoted nor deactivated
        (409 CLN_LAST_OWNER). The member keeps their session, but their next request is
        refused once deactivated, and a new role applies from their next request. Setting the
        role they already hold changes nothing and records nothing. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffMembershipUpdate'
      responses:
        '200':
          description: The member after the change
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients:
    post:
      tags: [patients]
      operationId: registerPatient
      summary: Register a patient
      description: |
        FR-PAT-01, 02, 03, 06; spec patients R1-R4, R9, R10. Permission: PATIENTS_MANAGE.
        `phone` is the contact of record: for a patient under 18 it is the guardian's, and
        `guardian_name` is then required (422 PAT_GUARDIAN_REQUIRED). Give a
        date of birth or an age, not both. If the clinic already has patients on that number
        the answer is 409 PAT_PHONE_EXISTS with up to 10 candidates (families share phones);
        send `confirm_new: true` to register another person on it. A refusal takes no code.
        Registration is serialised per clinic, so two simultaneous registrations of one new
        number have exactly one winner. Records patient.created and the checklist's first
        patient. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPatient'
      responses:
        '201':
          description: The new patient
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/PhoneExistsError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
    get:
      tags: [patients]
      operationId: lookupPatients
      summary: Look patients up by phone, code or name
      description: |
        FR-PAT-04; spec patients R5. Permission: PATIENTS_MANAGE. `q` is read in order as a phone
        number (7 or more digits, any usual formatting), then a patient code (`ME-0142`, any case,
        hyphen optional), otherwise the start of a name (case-insensitive). At most 20 results,
        ordered by name. Blank text, or phone-shaped text that is not a number, returns an empty
        list. The text is never logged.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Matching patients
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientList'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}:
    get:
      tags: [patients]
      operationId: getPatient
      summary: One patient of this clinic
      description: |
        Permission: PATIENTS_MANAGE. A patient of another clinic returns 404 REQ_NOT_FOUND, so
        its existence is never confirmed (NFR-08, AC7).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
      responses:
        '200':
          description: The patient
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
    patch:
      tags: [patients]
      operationId: updatePatient
      summary: Correct a patient's demographics
      description: |
        FR-PAT-01; spec patients R3, R7. Permission: PATIENTS_MANAGE. Only the fields sent change;
        send at least one. The code never changes. A date of birth or an age replaces the whole
        age fact. A blank `guardian_name` clears it (refused for a minor). Changing the phone
        does not run the duplicate check. Records one patient.updated listing the changed field
        *names* (never values); an edit that changes nothing records nothing. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdate'
      responses:
        '200':
          description: The patient after the edit
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}/consent:
    put:
      tags: [patients]
      operationId: recordPatientConsent
      summary: Record whether the patient may be messaged on WhatsApp and SMS
      description: |
        FR-PAT-05, FR-PAT-06; spec patients R6. Permission: PATIENTS_MANAGE. Both flags are required:
        this records an answer, with who and when. Both false is "asked and declined", which differs
        from never asked (`consent_recorded_at` null). For a patient under 18 it is the guardian's
        answer. Refused with 409 PAT_OPTED_OUT while the patient is opted out: use opt-in, which
        takes the new consent. Records patient.consent_changed. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientConsent'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConsentConflict'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/patients/{patient_id}/opt-out:
    post:
      tags: [patients]
      operationId: optOutPatient
      summary: Stop all messages to the patient
      description: |
        FR-MSG-05; spec patients R6. Permission: PATIENTS_MANAGE. An opt-out overrides consent until
        an explicit opt-in (AC5); the consent record is kept. Idempotent: opting out an opted-out
        patient changes nothing and records nothing. Records patient.opted_out (source staff; M5's
        STOP replies use the same action). No body. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
  /api/v1/patients/{patient_id}/opt-in:
    post:
      tags: [patients]
      operationId: optInPatient
      summary: Undo an opt-out, recording the consent given on the way back
      description: |
        FR-PAT-05, FR-MSG-05; spec patients R6, AC5. Permission: PATIENTS_MANAGE. The explicit way
        back from an opt-out: clears it and records consent in one step. 409 PAT_NOT_OPTED_OUT if
        the patient has not opted out (record consent instead). Records patient.opted_in.
        Needs X-CSRF-Token.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/PatientPath'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientConsent'
      responses:
        '200':
          $ref: '#/components/responses/PatientChanged'
        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '404':
          $ref: '#/components/responses/PermissionError'
        '409':
          $ref: '#/components/responses/ConsentConflict'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/auth/invites/{token}:
    get:
      tags: [invites]
      operationId: describeInvite
      summary: What this invitation is for
      description: |
        Public (M1-P5): the invitee has no session yet. Returns the clinic, their name and
        the role, so the page can ask for a password with context. Unknown secrets are 404
        CLN_INVITE_INVALID; one that is expired or already used says which, because the
        person holding the link needs to know whether to ask for a new one.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The pending invitation
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '404':
          $ref: '#/components/responses/InviteError'
        '410':
          $ref: '#/components/responses/InviteError'
  /api/v1/auth/invites/{token}/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Join the clinic and sign in (sets a new password, or proves the existing one)
      description: |
        FR-ORG-04, FR-AUTH-01, spec R13. Public: the secret in the URL is needed but is not enough
        for an account that already exists, so no X-CSRF-Token is needed (a cross-site request
        would have to know the secret). What password means depends on the invite's
        has_password (see describeInvite):

        - false, a new account: it is the password being chosen, at least 12 characters.
        - true, an existing account: it is that account's **current** password, verified and never
          changed. Whoever holds the link is not necessarily the account holder (the inviting
          owner receives it), so the link alone cannot take the account over. A wrong password is
          401 AUTH_INVALID_CREDENTIALS and counts towards the sign-in lockout (423 AUTH_LOCKED
          with Retry-After); the invitation stays pending.

        Accepting activates the membership, records staff.accepted, activates an ONBOARDING clinic
        when the new member is its owner (I1), and sets the session cookies — the invitee is
        signed in.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/InviteToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionStarted'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AuthError'
        '404':
          $ref: '#/components/responses/InviteError'
        '410':
          $ref: '#/components/responses/InviteError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
        '423':
          description: The existing account is locked (AUTH_LOCKED)
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Retry-After:
              description: Seconds until the lock ends
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/ops/clinics:
    post:
      tags: [ops]
      operationId: createClinic
      summary: Create a clinic
      description: |
        FR-ORG-01, FR-OPS-01. Ops only. The clinic starts in ONBOARDING and becomes ACTIVE
        when its first owner accepts their invitation (I1). The slug is unique platform-wide
        because it appears in public links from M7 (409 CLN_SLUG_TAKEN). Records
        clinic.created and starts the onboarding checklist. Needs X-CSRF-Token.
      security:
        - sessionCookie: []
