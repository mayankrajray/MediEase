# Alembic configuration for the MediEase API (ADR-0004).
#
# The database URL is deliberately absent: migrations/env.py reads it from the
# validated settings object (DATABASE_URL), like the rest of the application.
# Logging is configured by env.py through the application's JSON logging, so
# there are no [logger_*] sections here.
#
# Run from apps/api (or the image's /app):  alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Revisions are numbered explicitly:  alembic revision --rev-id 0002 -m "add clinics"
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os
