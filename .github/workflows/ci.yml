# CI gates for MediEase (docs/TESTING.md §5).
#
# Incremental from M7c (11 Nov 2026): a pull request runs only the jobs its changes can affect,
# and every job reuses cached dependencies. The selection is by component, because the
# components meet only at known points:
#
#   apps/api/**             -> api, images, smoke   (the whole API suite: shared code, coverage)
#   apps/web/** (not e2e)   -> web, images, smoke   (the whole web suite and the build)
#   apps/web/e2e/**         -> smoke                (the journeys themselves)
#   contracts/**            -> api, web, smoke      (the contract both sides are checked against)
#   compose, Makefile, .env.example, scripts/** -> smoke (the stack the journeys run on)
#   .github/**              -> everything           (the gates themselves changed)
#   docs and other text     -> config and secrets only
#
# A push to main, the nightly schedule and a manual run with "full" run everything, so nothing
# skipped on a pull request goes unchecked for long. Inside a job nothing is skipped: the API
# and web suites always run whole when their component is touched (a changed shared module can
# break a test whose files did not change). Caches are keyed on what they hold (lockfiles,
# pyproject, the runner image) and a cache never stands in for a test result.
#
# Runners: the light jobs (detect, config, result) use ubuntu-slim, a 1 vCPU container with a
# hard 15-minute limit and no Docker daemon. secrets (docker run gitleaks), api (~15 minutes of
# tests), web, images (docker build, Trivy) and smoke (Compose, Playwright) need a full VM,
# pinned to ubuntu-24.04 so a label move cannot change them unannounced. The API job runs in
# its image's base container; see the comment there.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every night at 02:00 IST on main: the full pipeline, whatever changed.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run every job, whatever changed"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-slim # light shell work: 1 vCPU container, 15-minute cap
    timeout-minutes: 5
    outputs:
      api: ${{ steps.check.outputs.api }}
      web: ${{ steps.check.outputs.web }}
      images: ${{ steps.check.outputs.images }}
      smoke: ${{ steps.check.outputs.smoke }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the pull request's base, to list what it changes
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FULL_INPUT: ${{ inputs.full }}
        run: |
          has_api=$([ -f apps/api/pyproject.toml ] && echo true || echo false)
          has_web=$([ -f apps/web/package.json ] && echo true || echo false)
          full=false
          reason="pull request"
          if [ "$EVENT" != "pull_request" ] && { [ "$EVENT" != "workflow_dispatch" ] || [ "$FULL_INPUT" = "true" ]; }; then
            full=true; reason="$EVENT: full run"
          fi
          if [ "$full" = false ]; then
            if [ -z "$BASE" ] || ! git diff --name-only "$BASE...$HEAD" > changed.txt; then
              full=true; reason="changes could not be listed: full run"
            fi
          fi
          touched() { [ "$full" = true ] || grep -Eq "$1" changed.txt; }
          if touched '^\.github/'; then full=true; reason="the workflow changed: full run"; fi
          api=false; web=false; smoke=false
          if touched '^(apps/api/|contracts/)'; then api=true; fi
          # Web files other than the journeys (read whole: a grep -q here would end the pipe early).
          web_files=$([ "$full" = true ] || grep -E '^(apps/web/|contracts/)' changed.txt | grep -Ev '^apps/web/e2e/' || true)
          if [ "$full" = true ] || [ -n "$web_files" ]; then web=true; fi
          if [ "$api" = true ] || [ "$web" = true ] || touched '^(apps/web/e2e/|docker-compose\.yml$|Makefile$|\.env\.example$|scripts/)'; then smoke=true; fi
          images=false
          if [ "$api" = true ] || [ "$web" = true ]; then images=true; fi
          api=$([ "$has_api" = true ] && echo "$api" || echo false)
          web=$([ "$has_web" = true ] && echo "$web" || echo false)
          both=$([ "$has_api" = true ] && [ "$has_web" = true ] && echo true || echo false)
          images=$([ "$both" = true ] && echo "$images" || echo false)
          smoke=$([ "$both" = true ] && echo "$smoke" || echo false)
          {
            echo "api=$api"; echo "web=$web"; echo "images=$images"; echo "smoke=$smoke"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### What this run checks ($reason)"
            echo "| Job | Runs |"; echo "|---|---|"
            echo "| API | $api |"; echo "| Web | $web |"; echo "| Images | $images |"; echo "| Stack and journeys | $smoke |"
            if [ "$full" = false ]; then
              echo ""; echo "<details><summary>Changed files</summary>"; echo ""
              sed 's/^/- /' changed.txt; echo ""; echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  config:
    name: Config and contract
    runs-on: ubuntu-slim # docker compose config needs the CLI only, not a daemon
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: OpenAPI contract is valid
        run: |
          pip install "openapi-spec-validator==0.7.1"
          openapi-spec-validator contracts/openapi.yaml

  secrets:
    name: Secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan every commit, not only the tip
      # gitleaks from its official image, pinned by tag and digest. Findings are
      # redacted in the log; any finding fails the job.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1

  api:
    name: API — lint, types, tests
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The suite runs in the API image's own base (the same tag and digest as apps/api/Dockerfile),
    # so it tests against the Python, Pango and HarfBuzz that ship, and the system libraries come
    # from Debian's mirrors. On 11 Nov 2026 every Ubuntu mirror was unreachable from the runner
    # host (noble and resolute alike) while deb.debian.org served the image builds.
    container:
      image: python:3.12.15-slim-trixie@sha256:29113dcae7aad06daa8e95260fa09f27d62be33b9687ea3774f771d601a02256
    defaults:
      run:
        # In a container the default shell is sh; the steps use bash arrays and need pipefail.
        shell: bash
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediease
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mediease_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mediease -d mediease_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      LOG_LEVEL: INFO
      DB_ECHO_PARAMS: "false"
      # The job runs in a container, so the service is reached by its name.
      DATABASE_URL: postgresql+psycopg://mediease:ci-only-password@postgres:5432/mediease_test
      JWT_SIGNING_KEY: ci-only-signing-key-not-a-secret-0123456789
      AUDIT_IP_SALT: ci-only-audit-ip-salt-not-a-secret-0123456789
      # Real-PostgreSQL integration tests (tests/conftest.py::database_url).
      TEST_DATABASE_URL: postgresql+psycopg://mediease:ci-only-password@postgres:5432/mediease_test
      # Deliberately not Asia/Kolkata: flushes out code that relies on the machine timezone.
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v7
      # The PDF renderer (WeasyPrint, M4-P4) needs Pango, HarfBuzz and fontconfig, as in the API
      # image, and tzdata makes the TZ above real. The .deb files are cached per base image (the
      # key names its digest: change both together), so a hit installs them without the network.
      - name: Cache the system packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt-ci
          key: apt-v2-python-3.12.15-slim-trixie-29113dcae7aa
      - name: PDF renderer and timezone libraries
        working-directory: .
        timeout-minutes: 8
        run: |
          pkgs=(libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fontconfig tzdata)
          mkdir -p /var/cache/apt-ci/partial
          # Not /var/cache/apt/archives: the image's docker-clean hook empties that after installs.
          opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Dir::Cache::archives=/var/cache/apt-ci)
          if ls /var/cache/apt-ci/*.deb >/dev/null 2>&1 && dpkg -i /var/cache/apt-ci/*.deb >/dev/null; then
            echo "installed from the cache"
          else
            apt-get "${opts[@]}" update
            DEBIAN_FRONTEND=noninteractive apt-get "${opts[@]}" install --yes --no-install-recommends "${pkgs[@]}"
          fi
          dpkg -s "${pkgs[@]}" >/dev/null
      # The virtual environment, keyed on the exact pins in pyproject.toml and the base image (its
      # Python); a hit only re-registers the editable package.
      - name: Cache the virtual environment
        id: venv
        uses: actions/cache@v4
        with:
          path: apps/api/.venv
          key: venv-v2-python-3.12.15-slim-trixie-${{ hashFiles('apps/api/pyproject.toml') }}
      - name: Install dependencies
        run: |
          [ -x .venv/bin/python ] || python -m venv .venv
          if [ "${{ steps.venv.outputs.cache-hit }}" = "true" ]; then
            .venv/bin/pip install --quiet --no-deps -e .
          else
            .venv/bin/pip install --quiet -e ".[dev]"
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # mypy's own incremental cache: it re-checks only changed modules and their dependants.
      - name: Cache mypy results
        uses: actions/cache@v4
        with:
          path: apps/api/.mypy_cache
          key: mypy-v1-${{ hashFiles('apps/api/pyproject.toml') }}-${{ github.sha }}
          restore-keys: mypy-v1-${{ hashFiles('apps/api/pyproject.toml') }}-
      - run: ruff check .
      - run: ruff format --check .
      - name: Layer boundaries (import-linter)
        run: lint-imports
      - run: mypy src
      - name: Tests with coverage gate (NFR-14)
        run: pytest -q --cov
      - name: Coverage gate on domain and application (NFR-14, >= 80%)
        run: coverage report --include='*/mediease_api/domain/*,*/mediease_api/application/*' --fail-under=80
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --skip-editable

  web:
    name: Web — lint, types, tests, build
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # next.config builds the /api rewrites from this; the build fails without it.
      API_INTERNAL_URL: http://api:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
      # node_modules, keyed on the lockfile and the Node version; npm ci only on a miss.
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: modules-v1-${{ runner.os }}-${{ hashFiles('apps/web/.nvmrc', 'apps/web/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      # Next.js's own build cache: unchanged pages and modules are not compiled again.
      - name: Cache the Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/next.config.ts') }}
          restore-keys: next-v1-${{ hashFiles('apps/web/package-lock.json') }}-
      # Blocking: anything that ships in the web image (production dependencies).
      - name: Dependency vulnerabilities (npm audit, production, high and above)
        run: npm audit --omit=dev --audit-level=high
      # Informational: the full tree, including dev tooling. Not blocking because the braces
      # advisory GHSA-vfj7-8cjw-p6xm has no patched version and is reachable only through
      # eslint-config-next (dev-only, not in the image). Revisit when braces is patched or
      # Next drops fast-glob; then remove continue-on-error.
      - name: Dependency vulnerabilities (npm audit, all, informational)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Generated API types match contracts/openapi.yaml
        run: npm run gen:api:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  images:
    name: Images — build and scan
    needs: detect
    if: needs.detect.outputs.images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t mediease-api:ci apps/api
      - name: Build web image
        run: docker build --build-arg API_INTERNAL_URL=http://api:8000 -t mediease-web:ci apps/web
      # Fails on any HIGH or CRITICAL vulnerability that has a fix available.
      # Trivy is pinned and run from its official image (no third-party action).
      - name: Scan images (Trivy)
        run: |
          for image in mediease-api:ci mediease-web:ci; do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
            echo "::endgroup::"
          done

  smoke:
    name: Stack — smoke test and browser journeys
    needs: detect
    if: needs.detect.outputs.smoke == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The M0 exit criterion, exactly as a developer runs it on a fresh clone.
      - run: cp .env.example .env
      - run: make up
      - run: make smoke
      # Browser journeys (docs/TESTING.md §3) on the same stack, with synthetic seed data.
      # Playwright runs in its official image (make e2e); the host only needs node_modules.
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
      - name: Cache node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: modules-v1-${{ runner.os }}-${{ hashFiles('apps/web/.nvmrc', 'apps/web/package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: make install-web
      - run: make seed
      - run: make e2e
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - name: Show service state and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # One check to require on main: green when every job that ran passed and the rest were not
  # needed for this change. A failed or cancelled job fails it.
  result:
    name: CI result
    if: always()
    needs: [detect, config, secrets, api, web, images, smoke]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A required job failed or was cancelled."; exit 1
          fi
          echo "Every job that this change needed passed."
