        '400':
          $ref: '#/components/responses/PermissionError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/PermissionError'
        '415':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/AuthError'
  /api/v1/clinic/doctors/{doctor_id}:
    get:
      tags: [clinic]
      operationId: getDoctor
